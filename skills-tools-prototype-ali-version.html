   Render + wiring
   ========================================================= */
function wire(root){
  root.querySelectorAll('[data-share]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const [kind,id]=b.dataset.share.split(':');
    openSharePanel(kind,id);
  });
  root.querySelectorAll('[data-access]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const [kind,id]=b.dataset.access.split(':');
    openAccessPanel(kind,id);
  });
  root.querySelectorAll('[data-ftab]').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); state.tabFile=b.dataset.ftab; state.editing=null; render();
  });
  root.querySelectorAll('[data-item]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    state.item=b.dataset.item; state.editing=null; state.tabFile='main';
    const [k,id]=state.item.split(':');
    state.team=null;
    state.view='skills';
    if(k==='tool'){ if(state.cat!=='all'&&state.cat!==shelfForTool(id)) state.cat=shelfForTool(id); }
    else { const s=skillById(id); if(state.cat!=='all'&&!(state.cat==='owned'&&ownsSkill(s))&&s&&state.cat!==shelfFor(s)) state.cat=shelfFor(s); }
    render(); window.scrollTo({top:0});
  });
  root.querySelectorAll('[data-grant-cat]').forEach(b=>b.onclick=()=>{
    state.view='skills'; state.cat=b.dataset.grantCat; state.item=null; state.team=null; state.editing=null;
    render(); window.scrollTo({top:0});
  });
  root.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{ state.item=null; state.editing=null; render(); });
  /* propose → edit → pending. A branch and a pull request underneath; none of
     that shows here, only the text and who has to say yes. */
  root.querySelectorAll('[data-propose]').forEach(b=>b.onclick=()=>{
    const [box,fid]=b.dataset.propose.split('|');
    const t=targetOf(box,fid); if(!t) return;
    state.editing=fileKey(t.c,t.f);
    render();
  });
  root.querySelectorAll('[data-edit-cancel]').forEach(b=>b.onclick=()=>{ state.editing=null; render(); });
  root.querySelectorAll('[data-edit-submit]').forEach(b=>b.onclick=()=>{
    const [box,fid]=b.dataset.editSubmit.split('|');
    const t=targetOf(box,fid); if(!t) return;
    const base=fileText(t.c,t.f), text=$('#edit-text').value;
    if(text.trim()===base.trim()){ toast('Nothing changed yet — edit the text first.'); return; }
    PROPOSALS.push({ id:'p-'+(++propSeq), box, file:fid, by:state.user, when:'today', status:'pending', base, text });
    state.editing=null; render();
    toast('Sent to '+t.c.owner+' — nothing changes until they approve.');
  });
  root.querySelectorAll('[data-prop-approve]').forEach(b=>b.onclick=()=>{
    const p=PROPOSALS.find(x=>x.id===b.dataset.propApprove); if(!p) return;
    const t=targetOf(p.box,p.file); if(!t) return;
    if(p.conflict || p.base!==fileText(t.c,t.f)){    /* never merge onto text it was not written against */
      p.conflict=true; render();
      toast('Blocked — '+proposalAuthor(p).name.split(' ')[0]+' has to resolve this against the current text first.');
      return;
    }
    setFileText(t.c,t.f,p.text);
    p.status='approved'; p.decided='today';
    const blocked=reconcile(p.box,p.file);
    render();
    toast(blocked
      ? 'Approved. '+blocked+' other change'+(blocked===1?'':'s')+' on this file '+(blocked===1?'is':'are')+' now blocked — same lines.'
      : 'Approved — it now reads with '+proposalAuthor(p).name.split(' ')[0]+'’s change.');
  });
  root.querySelectorAll('[data-prop-decline]').forEach(b=>b.onclick=()=>{
    const p=PROPOSALS.find(x=>x.id===b.dataset.propDecline); if(!p) return;
    p.status='declined'; p.decided='today';
    render();
    toast('Declined. Nothing was changed.');
  });
  root.querySelectorAll('[data-prop-withdraw]').forEach(b=>b.onclick=()=>{
    const i=PROPOSALS.findIndex(x=>x.id===b.dataset.propWithdraw);
    if(i>=0) PROPOSALS.splice(i,1);
    render();
    toast('Withdrawn.');
  });
  root.querySelectorAll('[data-connect]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const t=toolById(b.dataset.connect);
    state.connected[t.id]=true;
    render();
    toast(t.vars.some(v=>v.oauth)?'Signed in to '+t.name+'.':'Key added for '+t.name+'.');
  });
  root.querySelectorAll('[data-copy]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const v=b.dataset.copy;
    (navigator.clipboard?.writeText(v)||Promise.reject()).then(()=>{
      if(b._t) clearTimeout(b._t);
      if(!b.dataset.orig) b.dataset.orig=b.innerHTML;
      b.innerHTML='✓ Copied';
      b._t=setTimeout(()=>{ b.innerHTML=b.dataset.orig; },1400);
    }).catch(()=>toast(v));
  });
  root.querySelectorAll('[data-copyskill]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const v=b.dataset.copyskill;
    (navigator.clipboard?.writeText(v)||Promise.reject()).then(()=>{
      if(b._t) clearTimeout(b._t);
      b.innerHTML='<span class="ck">✓</span>';
      b._t=setTimeout(()=>{ b.innerHTML=COPY_SVG; },1200);
    }).catch(()=>toast(v));
  });
  /* admin surfaces */
  root.querySelectorAll('[data-acc]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const [k,id]=(state.item||'').split(':');
    if(k) openAccessPanel(k,id);
  });
  root.querySelectorAll('[data-team]').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); closeAgentModal();
    state.view='console'; state.team=b.dataset.team||null; state.item=null; state.editing=null;
    render(); window.scrollTo({top:0});
  });
  root.querySelectorAll('[data-exit-console]').forEach(b=>b.onclick=()=>{
    state.view='skills'; state.team=null; render();
  });
  root.querySelectorAll('[data-exit-settings]').forEach(b=>b.onclick=()=>{
    state.view='skills'; state.team=null; render(); window.scrollTo({top:0});
  });
  root.querySelectorAll('[data-secret-rotate]').forEach(b=>b.onclick=()=>
    toast('“'+b.dataset.secretRotate+'” — a new value would be requested here. It is never displayed afterwards.'));
  root.querySelectorAll('[data-add-grants]').forEach(b=>b.onclick=()=>openGrantModal(b.dataset.addGrants));
  root.querySelectorAll('[data-add-person]').forEach(b=>b.onclick=()=>openPersonModal(b.dataset.addPerson));
  root.querySelectorAll('[data-g-rm]').forEach(b=>b.onclick=()=>{
    const [tid,kind,id]=b.dataset.gRm.split('|');
    const a=ACCESS[tid];
    if(kind==='cat') a.cats=a.cats.filter(x=>x!==id);
    else if(kind==='tool') a.tools=a.tools.filter(x=>x!==id);
    else a.items=a.items.filter(i=>!(i.kind==='skill'&&i.id===id));
    toast('Removed.');
    render();
  });
  root.querySelectorAll('[data-x-restore]').forEach(b=>b.onclick=()=>{
    const [kind,id]=b.dataset.xRestore.split('|');
    const i=EXCLUSIONS.findIndex(x=>x.kind===kind&&x.id===id);
    if(i>=0) EXCLUSIONS.splice(i,1);
    toast('Restored to the baseline.');
    render();
  });
  root.querySelectorAll('[data-mem-rm]').forEach(b=>b.onclick=()=>{
    const [tid,pid]=b.dataset.memRm.split('|');
    const t=teamById(tid);
    t.members=t.members.filter(x=>x!==pid);
    t.headcount=Math.max(0,t.headcount-1);
    toast(personById(pid).name+' removed from '+t.name+' — they keep the baseline.');
    render();
  });
  root.querySelectorAll('[data-ex-rm]').forEach(b=>b.onclick=()=>{
    EXCEPTIONS.splice(+b.dataset.exRm,1);
    toast('Individual access removed.');
    render();
  });
}

function render(){
  if(state.view==='console' && !currentUser().admin){ state.view='skills'; state.team=null; }
  renderTop();
  renderSide();
  const main = $('#main');
  if(state.view==='secrets'){
    main.innerHTML = renderSecrets();
    wire(main);
  } else if(state.app==='knowledge'){
    main.innerHTML = renderKnowledge();
    wire(main);
    if(state.editing) setTimeout(()=>$('#edit-text')?.focus(), 40);
  } else if(state.view==='console'){
    main.innerHTML = state.team ? renderTeam(state.team) : renderConsole();
    wire(main);
  } else if(state.item){
    const [kind,id] = state.item.split(':');
    main.innerHTML = kind==='skill' ? renderSkillItem(skillById(id)) : renderToolItem(toolById(id));
    wire(main);
    if(state.editing) setTimeout(()=>$('#edit-text')?.focus(), 40);
  } else {
    main.innerHTML = renderShelf();
    wire(main);
    wireSearch();
  }
}

    if(state.pal && state.pal.open) closeSdrop();

    else if(state.appMenu){ state.appMenu=false; renderAppMenu(); }

    else if(state.editing){ state.editing=null; render(); }
    else if(state.item){ state.item=null; render(); }
    else if(state.view==='console'){ if(state.team) state.team=null; else state.view='skills'; render(); }
  }
  if(e.key==='/'){
    const el=document.activeElement;
    if(el && (el.tagName==='INPUT'||el.tagName==='TEXTAREA')) return;
    e.preventDefault();
    slashSearch();
  }
});

  const hp2 = new URLSearchParams(location.hash.slice(1));
  if(hp2.get('menu')){ state.menu=true; renderMenu(); }
  if(hp2.get('pal')){ state.pal={open:true,q:'',sel:0}; renderSdrop(); }
  if(hp2.get('acc') && state.item){
    const [k,id] = state.item.split(':');
    openAccessPanel(k, id, hp2.get('acc')==='fork' ? groupOf(id) : undefined);
  }
  if(hp2.get('share') && state.item){
    const [k,id] = state.item.split(':');
    openSharePanel(k,id);
  }
  if(hp2.get('review')) setTimeout(()=>$('.changebox')?.scrollIntoView({block:'center'}),120);
  if(hp2.get('grants')) openGrantModal(hp2.get('grants'));
}catch(e){}
</script>
