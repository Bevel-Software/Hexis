<title>Bevel — Skills &amp; tools</title>
<style>
  /* ————— tokens — light-first, warm ink, one interactive blue ————— */
  :root{
    --bg:#FFFFFF; --side:#F7F6F4; --card:#FFFFFF; --card2:#FAFAF8; --inset:#F4F3F0;
    --ink:#37352F; --ink2:#73706A; --ink3:#A3A099;
    --line:rgba(55,53,47,.11); --line2:rgba(55,53,47,.19);
    --hover:rgba(55,53,47,.05);
    --accent:#2383E2; --accent-hover:#1B74CB;
    --ok:#337B58; --wait:#C79100; --waitb:#F2C100; --attn:#CE5426;
    --ok-soft:#EBF5EE; --wait-soft:#FEF8DC;
    --sel:rgba(255,225,106,.55);
    --shadow:0 18px 55px rgba(55,53,47,.16);
    --card-shadow:0 1px 2px rgba(55,53,47,.05);
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  }
  :root[data-theme="dark"]{
    --bg:#191918; --side:#1F1F1E; --card:#232322; --card2:#2B2B2A; --inset:#1D1D1C;
    --ink:#EDEDEA; --ink2:#A5A5A0; --ink3:#71716C;
    --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.15);
    --hover:rgba(255,255,255,.05);
    --accent:#4E9FE0; --accent-hover:#5FACEA;
    --ok:#7FBE95; --wait:#F0CC4E; --waitb:#F0CC4E; --attn:#E86B3F;
    --ok-soft:rgba(127,190,149,.13); --wait-soft:rgba(240,204,78,.13);
    --sel:rgba(240,204,78,.26);
    --shadow:0 30px 90px rgba(0,0,0,.5);
    --card-shadow:none;
  }
  :root[data-theme="light"]{
    --bg:#FFFFFF; --side:#F7F6F4; --card:#FFFFFF; --card2:#FAFAF8; --inset:#F4F3F0;
    --ink:#37352F; --ink2:#73706A; --ink3:#A3A099;
    --line:rgba(55,53,47,.11); --line2:rgba(55,53,47,.19);
    --hover:rgba(55,53,47,.05);
    --accent:#2383E2; --accent-hover:#1B74CB;
    --ok:#337B58; --wait:#C79100; --waitb:#F2C100; --attn:#CE5426;
    --ok-soft:#EBF5EE; --wait-soft:#FEF8DC;
    --sel:rgba(255,225,106,.55);
    --shadow:0 18px 55px rgba(55,53,47,.16);
    --card-shadow:0 1px 2px rgba(55,53,47,.05);
  }

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{height:100%}
  body{min-height:100%;font-family:var(--sans);font-size:14px;line-height:1.5;color:var(--ink);background:var(--bg);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  ::selection{background:var(--sel)}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
  input,textarea{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--ink2);outline-offset:2px;border-radius:6px}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

  /* ————— app frame: one bar across the top, sidebar under it ————— */
  .topnav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:6px;height:47px;padding:0 12px;
    background:var(--bg);border-bottom:1px solid var(--line)}
  .topnav .right{margin-left:auto;display:flex;align-items:center;gap:2px}
  .wordmark{display:inline-flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px;transition:background .14s ease}
  .wordmark:hover{background:var(--hover)}
  .wordmark .tile{width:21px;height:21px;border-radius:6px;background:var(--ink);color:var(--bg);flex:0 0 21px;
    display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700}
  .wordmark .bn{font-size:14.5px;font-weight:600;letter-spacing:-.012em}
  .appchip{display:inline-flex;align-items:center;gap:8px;padding:5px 10px;border-radius:8px;font-size:13px;color:var(--ink2);
    transition:background .14s ease,color .14s ease}
  .appchip:hover,.appchip[aria-expanded="true"]{background:var(--hover);color:var(--ink)}
  .appchip .chev{font-size:9px;color:var(--ink3)}
  .who{display:inline-flex;align-items:center;gap:8px;padding:5px 9px;border-radius:8px;font-size:12.5px;color:var(--ink2);
    transition:background .14s ease,color .14s ease}
  .who:hover,.who[aria-expanded="true"]{background:var(--hover);color:var(--ink)}
  .who .av{width:22px;height:22px;font-size:8.5px}
  .iconbtn{position:relative;width:30px;height:30px;border-radius:8px;flex:0 0 30px;color:var(--ink3);
    display:flex;align-items:center;justify-content:center;transition:background .14s ease,color .14s ease}
  .iconbtn:hover,.iconbtn[aria-expanded="true"]{background:var(--hover);color:var(--ink)}
  .iconbtn svg{width:16px;height:16px}
  .iconbtn .badge{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;
    background:var(--attn);border:1.5px solid var(--bg)}

  .app{display:flex;min-height:calc(100dvh - 47px)}
  .side{width:212px;flex:0 0 auto;position:sticky;top:47px;height:calc(100dvh - 47px);overflow:hidden;
    border-right:1px solid var(--line);background:var(--side);
    transition:width .24s cubic-bezier(.2,.8,.2,1)}
  .side-inner{width:212px;height:100%;display:flex;flex-direction:column;padding:14px 14px 18px}
  .app.collapsed .side{width:0;border-right-color:transparent}
  #appmenu{left:12px;top:52px;bottom:auto;width:266px}
  #setmenu{right:12px;left:auto;top:52px;bottom:auto;width:238px}
  #pmenu{right:12px;left:auto;top:52px;bottom:auto;width:248px}
  #appmenu .applogo{width:26px;height:26px;border-radius:7px;flex:0 0 26px;display:flex;align-items:center;
    justify-content:center;font-size:12px;font-weight:700;background:var(--inset);border:1px solid var(--line);color:var(--ink2)}
  #appmenu .user-option[aria-current="true"] .applogo{background:var(--ink);color:var(--bg);border-color:transparent}
  .nav{display:flex;flex-direction:column;gap:1px}
  .nav .lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600;padding:16px 10px 7px}
  .nav .lbl.folder{display:flex;align-items:center;gap:7px;text-transform:none;letter-spacing:0;font-size:12px;color:var(--ink2)}
  .nav .doc-link{font-size:13px;padding-left:24px;gap:8px}
  .nav .doc-link .fdot{margin-left:auto}
  .nav button{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-radius:7px;
    font-size:13.5px;color:var(--ink2);transition:background .14s ease,color .14s ease}
  .nav button:hover{background:var(--hover);color:var(--ink)}
  .nav button[aria-current="true"]{color:var(--ink);font-weight:600;background:var(--hover)}
  .nav .n{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums;font-weight:400}
  .nav .pending{font-size:10px;line-height:18px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
    color:var(--wait);background:var(--wait-soft);font-weight:700;text-align:center;flex:0 0 auto}
  .nav .locked{opacity:.45;cursor:default}
  .nav .locked:hover{background:none;color:var(--ink2)}
  .side .spacer{flex:1}

  /* profile menu */
  .pmenu{position:fixed;left:14px;bottom:64px;width:248px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none;z-index:60}
  .pmenu.on{display:block}
  .pmenu button{display:flex;flex-direction:column;gap:1px;width:100%;padding:8px 10px;border-radius:8px}
  .pmenu button:hover{background:var(--hover)}
  .pmenu .mt{font-size:13px;font-weight:500}
  .pmenu .ms{font-size:11px;color:var(--ink3);line-height:1.4}
  .pmenu .menu-label{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700;
    padding:10px 10px 5px;margin-top:4px;border-top:1px solid var(--line)}
  .pmenu button.user-option{flex-direction:row;align-items:center;gap:9px}
  .pmenu button.user-option .ui{min-width:0;flex:1}
  .pmenu button.user-option .mt,.pmenu button.user-option .ms{display:block}
  .pmenu button.user-option .check{color:var(--ok);font-weight:700}

  /* small modal */
  .mwrap{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;
    background:rgba(55,53,47,.25);padding:16px}
  .mwrap.on{display:flex}
  .mcard{width:440px;max-width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);padding:24px}
  .mcard h3{font-size:17px;font-weight:600;letter-spacing:-.012em;margin-bottom:6px}
  .mcard p{font-size:13px;color:var(--ink2);line-height:1.55}
  .mcard .endpoint{font-family:var(--mono);font-size:11.5px;background:var(--inset);border:1px solid var(--line);
    border-radius:8px;padding:8px 11px;margin:14px 0;color:var(--ink);overflow-x:auto;white-space:nowrap}
  .mcard .mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

  .main{flex:1;min-width:0}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 40px 110px}

  /* search + strip */
  .search{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line2);
    border-radius:13px;padding:12px 16px;width:100%;cursor:pointer;transition:border-color .15s ease}
  .search:hover{border-color:var(--ink3)}
  .search .glyph{color:var(--ink3);font-size:15px}
  .search input{flex:1;background:transparent;border:none;outline:none;font-size:15px;min-width:0}
  .search input::placeholder{color:var(--ink3)}
  .search kbd{font-family:var(--mono);font-size:11px;color:var(--ink3);border:1px solid var(--line);
    border-radius:5px;padding:2px 6px;background:var(--inset)}
  .strip{display:flex;flex-direction:column;margin-top:12px}
  .strip-row{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:9px;font-size:13px;color:var(--ink2);
    transition:background .14s ease;width:100%}
  .strip-row:hover{background:var(--hover);color:var(--ink)}
  .sdot{width:6px;height:6px;border-radius:50%;flex:0 0 6px}
  .sdot.wait{background:var(--waitb)} .sdot.ok{background:var(--ok)}
  .strip-row .go{margin-left:auto;font-size:12px;color:var(--ink3);white-space:nowrap}

  /* shelf */
  .shelf-head{display:flex;align-items:baseline;gap:10px;margin:30px 0 14px}
  .shelf-head h1{font-size:20px;font-weight:600;letter-spacing:-.014em}
  .shelf-head .n{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px 12px;
    display:flex;flex-direction:column;gap:6px;min-height:106px;box-shadow:var(--card-shadow);cursor:pointer;
    position:relative;transition:border-color .15s ease,background .15s ease,transform .1s ease}
  .copybtn{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:7px;
    display:flex;align-items:center;justify-content:center;color:var(--ink3);
    background:var(--card);border:1px solid var(--line);opacity:0;transition:opacity .12s ease}
  .card:hover .copybtn{opacity:1}
  .copybtn:hover{color:var(--ink);background:var(--hover)}
  .copybtn .ck{color:var(--ok);font-size:13px;font-weight:600}
  .card:hover{border-color:var(--line2);background:var(--card2)}
  .card:active{transform:scale(.995)}
  .card .t{font-size:14.5px;font-weight:600;letter-spacing:-.008em;display:flex;align-items:center;gap:9px}
  .card .t .new{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
  .card .d{font-size:12.5px;color:var(--ink2);line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .foot{margin-top:auto;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink3);padding-top:6px}
  .rdot{width:6px;height:6px;border-radius:50%;flex:0 0 6px}
  .rdot.ok{background:var(--ok)} .rdot.wait{background:var(--waitb)} .rdot.none{background:var(--ink3);opacity:.5}
  .card .foot .r-ok{color:var(--ok)} .card .foot .r-wait{color:var(--wait)}
  .card .foot .upd{margin-left:auto;text-align:right}
  .empty{padding:26px 4px;color:var(--ink3);font-size:13.5px}

  /* logos */
  .logo{width:26px;height:26px;border-radius:7px;background:var(--inset);border:1px solid var(--line);
    display:inline-flex;align-items:center;justify-content:center;flex:0 0 26px}
  .logo svg{width:15px;height:15px;display:block}
  .logo .mg{font-size:11.5px;font-weight:700}
  .logo.lg{width:40px;height:40px;border-radius:10px;flex-basis:40px}
  .logo.lg svg{width:22px;height:22px}
  .logo.lg .mg{font-size:16px}
  .logo .ic-ink{color:var(--ink)}

  /* ————— item page ————— */
  .back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);padding:6px 10px;
    border-radius:8px;margin:2px 0 18px -10px}
  .back:hover{background:var(--hover);color:var(--ink)}
  .item-grid{display:grid;grid-template-columns:minmax(0,620px) 300px;gap:46px;align-items:start}
  .item-grid.solo{grid-template-columns:minmax(0,1fr)}
  .kicker{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin-bottom:8px}
  .item-title{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .item-title h1{font-size:26px;font-weight:600;letter-spacing:-.018em;line-height:1.15;text-wrap:balance}
  .item-top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
  .item-top .item-copy{min-width:0}
  .sharebtn{display:inline-flex;align-items:center;gap:7px;padding:7px 16px;border-radius:99px;background:var(--inset);
    border:1px solid var(--line);font-size:13px;font-weight:600;flex:0 0 auto;margin-top:18px}
  .sharebtn:hover{background:var(--hover);border-color:var(--line2)}
  .sharebtn svg{width:14px;height:14px}
  .lede{font-size:14.5px;color:var(--ink2);line-height:1.55;max-width:56ch}

  .ready{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:11px;font-size:13.5px;font-weight:500;margin-top:18px}
  .ready.ok{background:var(--ok-soft);color:var(--ok)}
  .ready.wait{background:var(--wait-soft);color:var(--wait)}
  .ready.none{background:var(--inset);color:var(--ink2);font-weight:400}
  .ready .fix{margin-left:auto}

  .h4{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin:26px 0 10px}
  .invoke{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .invoke code{font-family:var(--mono);font-size:12.5px;background:var(--inset);border:1px solid var(--line);
    border-radius:8px;padding:7px 12px;color:var(--ink)}
  .invoke .hint{font-size:12px;color:var(--ink3)}

  /* document */
  .doc{border-top:1px solid var(--line);margin-top:10px;padding-top:4px;
    font-size:13.5px;line-height:1.7;color:var(--ink2)}
  .doc p{margin:10px 0}
  .doc h2{font-size:15px;font-weight:600;color:var(--ink);margin:26px 0 6px;letter-spacing:-.01em}
  .doc h3{font-size:13.5px;font-weight:600;color:var(--ink);margin:18px 0 4px}
  .doc ul,.doc ol{margin:8px 0 12px 20px;display:flex;flex-direction:column;gap:5px}
  .doc pre{font-family:var(--mono);font-size:11.5px;line-height:1.65;background:var(--inset);border:1px solid var(--line);
    border-radius:9px;padding:11px 13px;overflow-x:auto;margin:10px 0;color:var(--ink2);white-space:pre}
  .doc code{font-family:var(--mono);font-size:11.5px;background:var(--inset);border:1px solid var(--line);
    border-radius:5px;padding:1px 5px;color:var(--ink)}
  .doc pre code{border:none;background:none;padding:0}
  .doc b,.doc strong{color:var(--ink);font-weight:600}
  .doc .wiki{color:var(--ink);border-bottom:1px dotted var(--line2)}
  .doc li.check{list-style:none;margin-left:-20px;display:flex;gap:9px;align-items:baseline}
  .doc li.check .cb{width:11px;height:11px;border:1.5px solid var(--ink3);border-radius:3px;flex:0 0 11px;transform:translateY(1px)}
  .doc .note{font-size:12.5px;color:var(--ink3);margin-top:10px}
  .doc mark.anch{background:var(--sel);color:inherit;border-bottom:1px dotted var(--wait);border-radius:2px;padding:0 1px}
  .doc hr{border:none;border-top:1px solid var(--line);margin:22px 0}
  .doc blockquote{border-left:2px solid var(--line2);padding-left:12px;color:var(--ink3);margin:10px 0;font-size:13px}
  .doc .tablewrap{overflow-x:auto;margin:12px 0}
  .doc table{border-collapse:collapse;font-size:12.5px;min-width:100%}
  .doc th,.doc td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top;line-height:1.5}
  .doc th{color:var(--ink);font-weight:600;background:var(--inset);white-space:nowrap}

  /* the skill's files — a skill is a folder */
  .ftabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:22px;flex-wrap:wrap}
  .ftab{padding:7px 11px 9px;color:var(--ink2);border-radius:8px 8px 0 0;
    display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .ftab .mono{font-family:var(--mono);font-size:11.5px}
  .ftab:hover{background:var(--hover);color:var(--ink)}
  .ftab.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
  .ftab.on .mono{font-weight:600}
  .fdot{width:5px;height:5px;border-radius:50%;background:var(--waitb);flex:0 0 5px}
  /* the open file, as a box: header bar with its name and the one action, then the text */
  .filepane{border:1px solid var(--line2);border-radius:12px;overflow:hidden;margin-top:16px;
    background:var(--card);box-shadow:var(--card-shadow)}
  .filebar{display:flex;align-items:center;gap:12px;padding:8px 14px;min-height:44px;
    background:var(--card2);border-bottom:1px solid var(--line)}
  .filebar .fname{font-family:var(--mono);font-size:11.5px;color:var(--ink2);margin-right:auto;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .filepane .doc{border-top:none;margin-top:0;padding:18px 24px 24px}
  .filepane .doc>:first-child{margin-top:0}

  /* people rail (admin console) */
  .railhead{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin-bottom:6px;
    display:flex;align-items:center}
  .railcount{display:inline-flex;min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--wait-soft);
    color:var(--wait);font-size:10.5px;font-weight:700;align-items:center;justify-content:center;margin-left:8px;letter-spacing:0}
  .railhint{font-size:12px;color:var(--ink3);line-height:1.5;margin-bottom:10px}

  /* search dropdown — anchored under the toolbar */
  .search-wrap{position:relative;z-index:30}
  .sdrop{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--card);border:1px solid var(--line);
    border-radius:14px;box-shadow:var(--shadow);padding:6px;display:none;max-height:46vh;overflow-y:auto}
  .sdrop.on{display:block}
  .pal-row{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border-radius:9px}
  .pal-row.sel{background:var(--hover)}
  .slashic{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);display:flex;align-items:center;
    justify-content:center;font-family:var(--mono);font-size:12px;color:var(--ink2);flex:0 0 26px;background:var(--inset)}
  .pal-row .pr-body{min-width:0;flex:1}
  .pal-row .pr-t{font-size:13.5px;font-weight:500;display:block}
  .pal-row .pr-d{font-size:12px;color:var(--ink3);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pal-row .pr-k{font-size:11px;color:var(--ink3);flex:0 0 auto;white-space:nowrap}
  .pal-empty{padding:18px;color:var(--ink3);font-size:13px}
  /* ————— propose changes: read → edit → pending diff ————— */
  .editbox textarea{display:block;width:100%;border:none;background:var(--inset);padding:18px 24px;
    font-family:var(--mono);font-size:12px;line-height:1.7;min-height:340px;resize:vertical;outline:none;color:var(--ink)}
  .editbox .ebar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--card)}
  .editbox .ebar .note{font-size:12px;color:var(--ink3);margin-right:auto}

  /* the change box — what someone proposed, rendered like a review diff */
  .changebox{border:1px solid var(--line2);border-radius:12px;overflow:hidden;margin-top:10px;background:var(--card)}

<script type="text/plain" id="kb-overview">
# What Bevel is

Bevel is the knowledge layer a company's agents run on. Everything an agent needs
in order to act on our behalf — what we sell, who we sell it to, how we work, what
we have already learned — lives here as text, owned by a person, and versioned.

## The one rule

**If an agent needs to know it, it belongs here.** Not in a thread, not in
someone's head, not in a deck attached to an email nobody can find in March.

A page nobody owns is a page nobody trusts. Every page on the left has exactly one
owner, and that owner is the only person who can approve a change to it.

## How the company is organised

| Team | Owns | Size |
|---|---|---|
| GTM | Pipeline, outbound, positioning | 36 |
| Engineering | The platform | 64 |
| Product | What we build and why | 30 |
| Delivery | Client work | 34 |
| Customer Success | Retention and expansion | 22 |
| Operations | Finance, people, legal | 14 |

## What to do when a page is wrong

Propose the change. Do not open a thread about it, and do not work around it — a
page everyone privately knows is wrong is worse than no page, because the agents
cannot tell. See [[ways-of-working]].
</script>

<script type="text/plain" id="kb-ways-of-working">
# Ways of working

## Write for the reader who was not there

Every page is read by someone with no context and by an agent with no judgement.
Both need the same thing: the conclusion first, the reasoning after, and no
pronouns pointing at something that was only ever said out loud.

## Decisions

A decision that is not written down did not happen. Record:

1. What was decided, in one sentence.
2. What it rules out — the option not taken matters more than the one taken.
3. Who decided, and when.
4. What would make us revisit it.

The fourth line is the one everyone skips and the one that makes the page useful
a year later.

## Meetings

- No meeting without a written question it exists to answer.
- Notes land in the knowledge base the same day, or the meeting did not happen.
- If the outcome changes a page, propose the change while it is still fresh.

## Proposing a change

Anyone may propose a change to any page. The owner approves it. There is no other
route — no "quick edit", no side channel, no asking someone with admin rights to
do it for you.

> Owning a page is not a privilege, it is a duty to answer within a day.
</script>

<script type="text/plain" id="kb-icp">
# Ideal customer profile

The ICP is a **hypothesis**, not a description. It is written so that it can be
proven wrong by a number, and it is revised when it is.

## Current profile

| Trait | Value |
|---|---|
| Size | 150–800 people |
| Region | DACH, Benelux |
| Trigger | Rolling out AI agents internally, first pilot already stalled |
| Buyer | COO, Head of Operations, occasionally CTO |
| Anti-signal | No internal owner for process documentation |

## Why they buy

Not "we want AI". Every one of them already tried, and the pilot stalled for the
same reason: the agent had no reliable source of truth, so its output could not be
trusted, so nobody used it.

They are not buying a model. They are buying the thing that makes the model
correct — and they have usually just paid to learn that themselves.

## The anti-signal matters most

If nobody inside owns process documentation, we lose. Not slowly — the pilot dies
at week six when the first page goes stale and nobody notices. Qualify on this
before anything else.

## How we test it

One hypothesis, one list, one campaign, one kill metric, set before launch. See
[[outbound-playbook]].
</script>

<script type="text/plain" id="kb-outbound-playbook">
# Outbound playbook

Outbound is an experiment. A list that cannot lose cannot teach us anything.

## Structure

- One hypothesis per list. Never pour two personas into one sequence.
- One campaign per list, so the numbers stay comparable.
- A kill metric written down **before** launch: reply rate under 4% at 200 sent
  means the hypothesis is dead, not that the copy needs another pass.

## Copy

1. Open on their deadline or their problem. Never on our product, never on AI.
2. One proof point with a number in it, anonymised unless we have permission.
3. Follow-ups add information. They never say "just bumping this".
4. The last touch gives an explicit exit — it protects the sender and produces a
   cleaner negative signal than silence.

## Language

German materially lifts reply rate in DACH. Only write it if the person handling
replies can hold the conversation in German.

## What we never do

- Never start a campaign on someone else's behalf.
- Never send to a list that has not been counted after import.
- Never reuse a sender across two campaigns without excluding contacted leads.
</script>

<script type="text/plain" id="kb-ontology">
# Product ontology

The words we use for our own product, and the ones we have retired. If a word is
not on this page, it is not ours yet.

## Current vocabulary

| We say | We do not say | Why |
|---|---|---|
| Knowledge base | Wiki, docs site | A wiki is edited by whoever is last; ours is owned and approved |
| Page | Article, entry | Shortest word that is not overloaded |
| Skill | Prompt, workflow, macro | A skill is a folder of instructions an agent runs |
| Tool | Integration, connector | The thing an agent calls; a credential is not a tool |
| Propose a change | Suggest an edit, open a PR | Says what happens; the git vocabulary stays out of the product |
| Sub-group | Space, workspace, team folder | People create these and invite others |

## Retired

**Connectors** — we called integrations this until July. Screenshots in older
material still say it. If you touch a page that uses it, fix it while you are
there.

## The rule for new words

A new noun needs an owner and a page before it appears in the product. Naming a
thing twice is how a product ends up with two of everything.
</script>

<script type="text/plain" id="kb-access-and-roles">
# Access and roles

## The model

Everything sits in exactly one place: **company-wide**, or **one sub-group**.
Nothing is in both. Company-wide means all 200 people. A sub-group is created by a
person, who then invites others into it.

| Role | Can |
|---|---|
| Member | Read everything they have access to, propose changes anywhere |
| Owner | Approve changes to the pages and skills they own |
| Admin | Manage access and membership; see everything |

## Two things that are deliberately separate

**Access** is who can see and use a thing — Admins manage it.
**Approval** is who decides what a page says — the owner decides, and an Admin
does not inherit that by being an Admin.

Keeping these apart is the whole point. Someone who can grant themselves access to
a page still cannot change what it says.

## Agents

An agent acts with exactly the access of the person who ran it — never more. It
proposes changes the same way a person does, under that person's name, and the
owner approves them the same way.

## Credentials

Personal credentials stay personal; team credentials are set once by an Admin. A
credential is never written into a page. If you find one here, remove it and
rotate it — in that order.
</script>

<script type="text/plain" id="md-heyreach-campaign">
# HeyReach campaign setup

## 1. Check the account state first

`get_all_linked_in_accounts` and `get_all_campaigns` before anything else.

- `authIsValid: false` → the LinkedIn session is dead, reconnect required. A real problem.
- `isActive: false` → **not** a problem. It is derived, not a setting: a sender only
  reads as active while a campaign is actually running. Draft, paused, cancelled and
  failed campaigns all leave the sender "Available". It flips on its own when a
  campaign starts. Do not tell the user to go activate anything.
- `isValidNavigator` tells you whether InMail steps are viable at all.

## 2. Read the existing sequence before writing one

Always `get_campaign_sequence` first — on the target campaign, and on any campaign
that already works, as a reference for valid node shapes.

**Newly created HeyReach campaigns ship with stock demo copy.** It reads like a
lead-gen agency pitch ("dropped a few likes on your posts lately… since you get 50+
comments on average"). If the campaign is started without replacing it, that is what
goes to real prospects. Check for it explicitly and flag it loudly.

## 3. Sequence structure

A tree of nodes: `nodeType`, `actionDelay`, `actionDelayUnit` (`HOUR`|`DAY`),
`unconditionalNode`, `conditionalNode`, `payload`.

Rules that the API enforces and will reject you for:

- Every path ends in `END`.
- `actionDelay >= 3 HOUR` (or use `DAY`) on **every** node following a
  `CONNECTION_REQUEST`, `MESSAGE`, `INMAIL`, `VIEW_PROFILE`, `FOLLOW` or `LIKE_POST`
  — including `END` nodes. Omitting it becomes `00:00:00` and the call fails.
- `CONNECTION_REQUEST` needs both branches: `conditionalNode` = accepted,
  `unconditionalNode` = not accepted.
- `MESSAGE` and `INMAIL` need both, and their `conditionalNode` **must** be `END`
  (that is the reply-detected exit).
- `MESSAGE` may only appear after the lead is connected — on the accepted side of
  `CONNECTION_REQUEST`, or under `CHECK_IS_CONNECTION`.

Payloads:

```
MESSAGE  { messages: ["…{FIRST_NAME}…"], fallbackMessage: "…" }
INMAIL   { messages: [{subject, message}], fallbackMessage: {subject, message} }
CONNECTION_REQUEST { messages: [""], fallbackMessage: "", toBeWithdrawnAfterDays: 25 }
```

`fallbackMessage` is used when the variable cannot be filled — it must read
correctly with the name removed entirely, not with a blank left in it.

Prefer a `CHECK_IS_CONNECTION` root over a bare `CONNECTION_REQUEST` root: it
handles leads who are already 1st-degree instead of failing their first step.

## 4. Copy

- Open on the prospect's deadline or problem, never on your product, and never on AI.
- One concrete proof point with a number, anonymised unless you have permission to
  name the client.
- Follow-ups add information; they never say "just bumping this".
- Last touch gives an explicit exit ("say so and I'll leave it there") — it protects
  the sender's reputation and produces cleaner negative signal.
- Match the copy to the persona. One list per hypothesis, one campaign per list; do
  not pour mixed personas into one sequence. See [[icp-hypothesis-lists]].
- For DACH prospects, German materially lifts reply rate — but only write it if the
  human can handle replies in German. Ask.

## 5. Wire it up

```
create_empty_list → create_campaign(name, listId, accountIds, schedule, sequenceJson)
```

Or on an existing campaign: `update_campaign_settings` (name + list),
`update_campaign_accounts` (sender), `update_campaign_sequence`,
`update_campaign_schedule`.

Note that `update_campaign_settings` is where the lead list is bound — a campaign
created earlier is often still pointing at an empty starter list.

Set `excludeContactedFromOtherCampaigns: true` when running several campaigns off
one sender, or the same person gets two different pitches.

Schedule: business hours in the prospect's timezone, weekdays only
(`W. Europe Standard Time` for DACH).

## 6. Pre-launch checklist — report, do not act

- [ ] Lead count verified via `get_list_by_id` (not the import response)
- [ ] Demo copy gone, every message read end to end
- [ ] `fallbackMessage` reads correctly for every step
- [ ] InMail credits exist, if the sequence has an InMail branch — without them that
      branch silently does nothing, and it is typically half the list
- [ ] Sender attached, schedule set, daily limits sane (~20-25 connections/day/sender)

**Never call `start_campaign`.** It sends messages to real people under the human's
name. Present the checklist and stop.
</script>

<script type="text/plain" id="md-crd-skill">
# Reading deck

A **reading deck** is a document that lands in someone's inbox and is read with
nobody there to narrate it. That single fact drives every rule here: no slide may
depend on a speaker, every headline must carry its own conclusion, and anything a
reader could misread has already failed.

This skill exists because building one of these by feel costs a day of rework.
Everything below was paid for once already — see `reference/LESSONS.md`.

Version **1.4.1**. Changes are recorded in `CHANGELOG.md`.

---

## 0. Get the toolkit onto disk

This skill is scripts plus reference docs, and the scripts have to run somewhere.
Fetch the bundled files and write them into your working folder, preserving the
structure:

```
scripts/check-layout.py     deterministic visual QA
scripts/export-pdf.py       HTML -> PDF at native resolution
scripts/embed-fonts.py      inline the webfonts
scripts/video-to-gif.py     screen recording -> looping GIF (cross-platform)
scripts/video-to-gif.sh     the same, for POSIX shells
template/deck.html          the design system + worked examples of every component
template/storyline.md       the outline you write before any HTML
reference/QA-STANDARDS.md   researched MBB standards, with numbers and sources
reference/DESIGN-SYSTEM.md  exact CSS spec — read before touching styling
reference/LESSONS.md        the traps, and what each one cost
```

**Dependencies:** ffmpeg (GIFs and poster frames), Pillow (`pip install pillow`,
PDF assembly), and Google Chrome (driven headlessly for rendering and
measurement). All four scripts find Chrome automatically; set `CHROME_PATH` if
yours lives somewhere unusual.

**The KB copy is the source of truth.** If you improve the skill, land the change
here as a change request (step 9) — not only in your local copy, which nobody
else will ever see.

---

## The order of work

Do these in order. Steps 1 and 2 are where the time is won or lost.

### 1. Agree the structure before writing anything

Ask for, or extract, the **content hierarchy** and **mirror it**. If the person
gave you a nested list of sections, that IS the deck's structure. Reframing it
into a problem/solution narrative is a *proposal* you offer, never a default you
assume. Getting this wrong means rewriting every slide.

Pin down, explicitly:

| Question | Why it must be settled first |
|---|---|
| How many slides? | Copy density is a function of slide count. Changing it rewrites everything. |
| Whose hierarchy? | Theirs, unless they ask for a reframe. |
| Read-alone or presented? | Read-alone needs full sentences and no orphan context. |
| Who is the reader? | Anchors every scope decision. |

### 2. Write `storyline.md` before any HTML

Arguing about an outline is cheap; arguing about markup is not. The storyline
holds the slide map, the action titles, the horizontal-logic read-through, and —
critically — two lists the deck itself cannot carry:

- **Claims deliberately NOT made.** Anything the reader would *like* to hear but
  the source does not support. Keeping these visible stops them leaking into the
  copy.
- **Open questions.** What the source cannot answer. Do not invent answers.

Start from `template/storyline.md`.

### 3. Write the deck

Copy `template/` into your deck folder. `template/deck.html` carries the full
design system, the layout contract in a head comment, and worked examples of
every component. **Read `reference/DESIGN-SYSTEM.md` before changing any CSS.**

**Pick a theme** — one attribute on `<html>`:

    data-theme="sales"     light editorial, no accent colour  (default)
    data-theme="signal"    dark, one purple accent on the icon badges

Both themes share the same geometry, type scale and measure, so the QA
thresholds mean the same thing in either. A theme is a token block; if you are
typing a hex value into component CSS you are forking the stylesheet by
accident.

Action titles are the highest-leverage thing on the page. See
`reference/QA-STANDARDS.md` §6 for the label-vs-assertion test.

### 4. Media

Screen recordings beat still screenshots for showing a product working.

    scripts/video-to-gif.py recording.mov screenshots/01-thing.gif --width 1400

It builds a two-pass palette so UI text stays sharp, and verifies the loop flag.
The frame is kept **exactly as recorded** by default. Add `--crop` when the
recording has dead space baked in.

Whichever you use, do not force the clip into the grid's aspect ratio. Let the
media keep its aspect and size the slot to match.

**Then look at the last frame.** A GIF rests there every cycle. A recording that
ends on an empty credentials form, a spinner, or an error will loop through that
forever, under a headline claiming the opposite. Trim with `--to`.

### 5. QA gate 1 — the deck is correct

    scripts/check-layout.py deck.html --md storyline.md

Must exit 0. Run it as often as you like while writing; it is fast.

It measures what eyes miss: clipping, title-band drift, characters per line
against the WCAG ceiling, type-scale creep, bold budget, headline orphans,
vertical balance, column stranding, missing assets, placeholder text, whether the
PDF is stale, and whether the storyline still matches the deck.

**Also do a consistency pass no script covers yet:** grep every product noun and
feature name across all slides and check that no two slides contradict each
other, and that your prose vocabulary matches the words visible *inside* the
screenshots.

### 6. Make it actually self-contained

    scripts/embed-fonts.py deck.html          # inline the webfonts
    scripts/embed-fonts.py deck.html --check  # exit 1 if a remote fetch remains

The template links Google Fonts so it stays readable while you author. That link
is a **dependency**, and a deck is a document someone opens in five years,
offline, behind a proxy. Embedding costs ~270KB and buys three things: it cannot
break, it does not ping a third party from the recipient's network, and it
removes the font race.

### 7. Export

    scripts/export-pdf.py deck.html

**PDF has no animated raster format.** If the deck uses GIFs you must declare a
poster frame per slot in `posters.json`, or the exporter freezes each on frame 1.
Pick each frame for what it *proves*, not for where the clip happens to end.

### 8. QA gate 2 — the deck is sendable, then ship

    scripts/check-layout.py deck.html --md storyline.md --ship

Must exit 0. This is a **different question** from gate 1. Gate 1 asks "is the
deck correct?"; gate 2 asks "is it safe to leave the building?" — it escalates
to failure the four things that are acceptable while authoring and unacceptable
in a client's inbox: a placeholder where a screenshot should be, placeholder text
in the copy, a stale PDF, and fonts fetched from a CDN at render time.

| | Check |
|---|---|
| E2 | Client, product and person names spelled right — **check their website, not your notes** |
| E5 | Every animated file has a deliberately chosen poster frame in `posters.json` |
| E7 | Cover carries the client name, the date, and any confidentiality marking |
| E8 | Every hyperlink resolves |
| D6 | Numbers agree across pages; units and rounding consistent |

The deck is a **folder**, not a file — `deck.html` needs `screenshots/`
alongside it. Zip them.

### 9. Write down what this build taught you — required, not optional

**This is the step that makes the skill worth more next quarter than it is
today.** Skip it and the next person re-learns the same thing at the same cost.

Append to `reference/LESSONS.md` **in the knowledge base** — a lesson that only
reaches your local copy is a lesson thrown away. Open a change request against
this folder before you close the task.

Three rules that keep the file useful rather than a dump:

1. **One lesson per trap, not per incident.** If it is a new instance of an
   existing lesson, strengthen that entry.
2. **Delete lessons that stop being true.** A lessons file nobody trusts is a
   lessons file nobody reads.
3. **If the fix can be automated, automate it instead.** A lesson that could be a
   check in `scripts/check-layout.py` belongs in the script.

---

## Non-negotiables

These are cheap to honour and expensive to fix later.

1. **Every headline is an assertion.** "Knowledge you can trust" is a label and
   fails. "The graph stays current on its own" is a conclusion and passes.
2. **The titles alone must tell the story.** Read only the h2s, top to bottom. If
   that is a table of contents rather than an argument, the deck has no spine.
3. **Never fabricate a capability.** If the source does not say it, it does not
   go in — no matter how well it answers what the reader wants.
4. **Measure, do not eyeball.** Every numeric claim about the layout comes from
   `check-layout.py`.
5. **Validate your validator.** Break the deck deliberately and confirm the
   checker catches it. A check that always passes is worse than no check.
6. **Flag, do not silently fix, a content contradiction.** It is usually a real
   ambiguity in the product, not a typo.
7. **Say what you did not do.** A deck that looks finished but is not is worse
   than one that is visibly incomplete.
8. **Leave the skill better than you found it.** Step 9 is not optional.
</script>

# create-reading-deck

Build a client-grade **reading deck** — a leave-behind that gets read with nobody
there to narrate it.

`SKILL.md` is the workflow; read it first. This file is the operational detail:
how to get the toolkit onto a machine, what it depends on, and the three things
people get wrong.

## Getting it onto your machine

The knowledge base is the source of truth. Two ways to work from it.

**From an agent with knowledge-base access** — the normal path. `get_skill` with
`name: create-reading-deck` returns the workflow; pass `file:` for each bundled
path to pull the scripts and reference docs (§0 of `SKILL.md` lists them).

**As a local Claude Code skill** — if you build decks often enough that you want
`/create-reading-deck` on tap. The folder has to land at
`~/.claude/skills/create-reading-deck/` and nowhere else. Restart Claude Code afterwards.

A local copy is a **cache**, not a fork. Improvements go back to the KB (step 9),
or the next person re-learns what you just learned.

## The four things people get wrong

1. **Writing copy before the slide count and structure are agreed.** Every change
   to either rewrites everything downstream. Settle it first, in writing.
2. **Topic labels instead of action titles.** "Knowledge you can trust" says
   nothing. "The graph stays current on its own" is a claim someone can agree or
   disagree with.
3. **Shipping a deck that phones home for its fonts.** Run `embed-fonts.py` before
   sending, or the deck renders in a fallback face offline.
4. **Trusting your eyes for layout.** Run `check-layout.py`. It catches clipping,
   over-long lines, type-scale creep and storyline drift that look fine at a glance.

## Dependencies

| | macOS | Windows | Linux |
|---|---|---|---|
| ffmpeg | `brew install ffmpeg` | `winget install Gyan.FFmpeg` | `apt install ffmpeg` |
| Pillow | `pip install pillow` | `pip install pillow` | `pip install pillow` |
| Chrome | install normally | install normally | install normally |

Chrome is driven headlessly for rendering and measurement. All four scripts find
it automatically; if yours lives somewhere unusual, set `CHROME_PATH`.

## Keeping the skill sharp

Step 9 of `SKILL.md` is **required**: when a build teaches you something, append
it to `reference/LESSONS.md` in the house format and open a change request
against this folder before you close the task.

# Bevel Light Editorial — Reading-Deck Design System

The spec for `template/deck.html` — and for any new deck built on it.

A **reading deck** argues unattended, in a browser or as a PDF. No presenter, no
narrator, no live Q&A. Every rule below protects that: fixed frames so nothing
clips, one measure so nothing tires the eye, no colour so nothing encodes meaning
the reader can't decode alone.

All CSS here is quoted verbatim from the template. Copy it exactly. If you change a
value you are authoring a different system — say so in the commit message.

**Do not use this system for:** a stage deck (needs bigger type, fewer words), a
deck over ~8 pages (see §9), or anything needing charts or tables (§9 — the
system has no component for either).

> §1–§13 describe the **sales** theme: light editorial, no accent colour. That
> is the default and the one every number here was measured against. A second
> theme, **signal** (dark, one purple accent), ships alongside it — see §14.

---

## 0 · The 30-second version

| | |
|---|---|
| Page | `#ECEAE4` · Slide `#FAF9F6` · ink `#14130F` |
| Type | Hanken Grotesk + IBM Plex Mono |
| Scale | **110 / 56 / 28 / 22 / 18 / 13** — exactly six, forever |
| Accent | none |
| Native size | 1920 × 1080, scaled to fit width by a 10-line script |
| Title | frozen in a 168px band, same y on every slide |
| Measure | 680px body / 780px lede — never removed |
| Body budget | **631px** of vertical space under the band, per slide |

Shipped deck: 6 pages, 5 content slides + title. 3 looping GIFs at 2100×1682.

---

## 1 · Starting a new deck

Copy the skill's `template/` folder. Then change exactly these seven things —
nothing else in the boilerplate is deck-specific.

| # | What | Where |
|---|---|---|
| 1 | `<title>` | `<head>` |
| 2 | Capture standard block | `<head>` comment |
| 3 | Title-slide `h1` / subtitle / legal line | `.title-center` |
| 4 | `.foot` denominators on every slide | every `.foot` |
| 5 | `.toplabel` taxonomy | every `.head` |
| 6 | The five to seven `h2`s | every `.titleband` |
| 7 | Poster frames: gif path → source, timestamp, reason | `posters.json` |

**The fonts are a hard dependency, not a nicety.** Every character-count ceiling
in §6 and §8 assumes Hanken Grotesk is loaded.

<script type="text/plain" id="code-crd-checklayout">
#!/usr/bin/env python3
"""
check-layout.py — deterministic visual QA for a reading deck.

Renders the deck in headless Chrome, injects a measurement probe, and reports
pass/fail against numeric thresholds. Exits non-zero if any FAIL, so it can gate
a commit.

    ./check-layout.py deck.html                    # human report
    ./check-layout.py deck.html --json             # machine-readable
    ./check-layout.py deck.html --md storyline.md  # also check md<->html sync

WHY THIS EXISTS
Every check here corresponds to a defect that actually shipped in a real deck and
had to be caught by eye. Eyes miss these; arithmetic does not.

MEASUREMENT TRAPS THIS SCRIPT AVOIDS (learned the hard way):
  * Slides are transform:scale()d to fit the viewport. getBoundingClientRect()
    returns SCALED pixels and will silently give you nonsense (we once measured
    23 CPL on a line that was really 84).
  * .body is flex:1, so its scrollHeight always equals its own height. We
    measure the union of its CHILDREN's bounds instead.
  * Characters-per-line cannot be counted from the string: it depends on the
    font's average advance. We measure the advance by rendering the actual text
    in the actual computed font, then divide.
"""

# ----------------------------------------------------------------- thresholds
# Every number here is defensible; see reference/QA-STANDARDS.md for sources.
T = {
    "cpl_target_max": 75,     # Bringhurst 45-75 for a single column
    "cpl_hard_max": 80,       # WCAG 2.x SC 1.4.8 (AAA) ceiling for Latin script
    "cpl_min": 40,            # below this, too many return sweeps
    "type_scale_max": 6,      # distinct font sizes carrying text
    "bold_ratio_max": 0.16,   # share of body words in <strong>
    "bold_span_max": 5,       # words in one <strong>
    "orphan_min_frac": 0.25,  # last line of a block vs the measure
}

const exNote = f => '<p class="note" style="margin-top:14px">Excerpt — the full file ('+esc(f.excerpt)+') lives in the knowledge base.</p>';

/* One text per file, read once from the page and kept here afterwards. An
   approved proposal rewrites it — that write is the merge commit in the real
   product; here it is just the new string. */
const FILE_TEXT = {};
const fileKey = (s,f) => s.id+':'+f.id;
function fileText(s, f){
  const k = fileKey(s,f);
  if(FILE_TEXT[k] == null){
    const src = f.mdId || f.codeId || (f.inline && f.inline.md);
    if(f.stub) FILE_TEXT[k] = f.file+' · '+f.stub+' — not loaded in this prototype. The full file lives in the knowledge base.';
    else if(src) FILE_TEXT[k] = document.getElementById(src).textContent.trim();
    else FILE_TEXT[k] = f.inline.instr.map((i,n)=>(n+1)+'. '+i).join('\n') + (f.inline.note ? '\n\n'+f.inline.note : '');
  }
  return FILE_TEXT[k];
}
const setFileText = (s,f,txt) => { FILE_TEXT[fileKey(s,f)] = txt; };
function fileDoc(s, f){
  const txt = fileText(s, f);
  if(f.stub) return '<p>'+esc(txt)+'</p>';
  if(f.codeId) return '<pre><code>'+esc(txt)+'</code></pre>'+(f.excerpt?exNote(f):'');
  return mdRender(txt)+(f.excerpt?exNote(f):'');
}

/* =========================================================
   Proposed changes.
   A proposal is a branch and a pull request in the git layer
   underneath. None of that vocabulary reaches the screen: a
   person edits the text, and what they changed sits under the
   file until the owner approves it. Skills and knowledge pages
   go through exactly the same flow.
   ========================================================= */
const PROPOSALS = [];
let propSeq = 0;
const proposalsFor = (boxId, fileId) => PROPOSALS.filter(p=>p.box===boxId && p.file===fileId && p.status==='pending');
const proposalFor = (boxId, fileId) => proposalsFor(boxId, fileId)[0];
const pendingForSkill = s => PROPOSALS.filter(p=>p.box===s.id && p.status==='pending');
/* a proposal targets a file inside a box: a skill folder, or the knowledge base */
function targetOf(boxId, fileId){
  if(boxId==='knowledge'){ const d = kbById(fileId); return d && { c:kbBox(d), f:d }; }
  const s = skillById(boxId); if(!s) return null;
  const f = skillFiles(s).find(x=>x.id===fileId);
  return f && { c:s, f };
}
function seedProposal(boxId, fileId, find, replace, by, when){
  const t = targetOf(boxId, fileId); if(!t) return;
  const base = fileText(t.c, t.f);
  if(!base.includes(find)) return;
  PROPOSALS.push({ id:'p-'+(++propSeq), box:boxId, file:fileId, by, when, status:'pending',
    base, text:base.replace(find, replace) });
}

/* ————— when someone else's change lands first —————
   Every proposal was written against the text as it stood at the time. Once a
   different change is approved, the others have to be carried onto the new text.
   Touching a different part of the file carries over silently, the way git
   rebases a clean patch. Touching the same lines cannot be carried over by
   anyone but the author, so it is marked and the merge is blocked. */
function hunksOf(base, text){
  const rows = diffLines(base, text), out = [];
  let i = 0;
  while(i < rows.length){
    if(rows[i][0]==='ctx'){ i++; continue; }
    const del = [], add = [];
    let anchor = null;
    for(let k=i-1;k>=0;k--) if(rows[k][0]==='ctx'){ anchor = rows[k][1]; break; }
    while(i<rows.length && rows[i][0]!=='ctx'){ (rows[i][0]==='del'?del:add).push(rows[i][1]); i++; }
    out.push({ del, add, anchor });
  }
  return out;
}
/* returns the proposal's text carried onto `cur`, or null if it cannot be */
function carryOnto(p, cur){
  let out = cur;
  for(const h of hunksOf(p.base, p.text)){
    if(h.del.length){
      const oldBlock = h.del.join('\n');
      if(!out.includes(oldBlock)) return null;          /* those lines are gone or already changed */
      out = out.replace(oldBlock, h.add.join('\n'));
    } else {
      if(h.anchor == null || !out.includes(h.anchor)) return null;
      out = out.replace(h.anchor, h.anchor+'\n'+h.add.join('\n'));
    }
  }
  return out;
}
/* after a change lands, bring every other pending change on that file up to date */
function reconcile(boxId, fileId){
  const t = targetOf(boxId, fileId); if(!t) return 0;
  const cur = fileText(t.c, t.f);
  let blocked = 0;
  for(const p of proposalsFor(boxId, fileId)){
    if(p.base === cur) continue;
    const carried = carryOnto(p, cur);
    if(carried == null){ p.conflict = true; blocked++; }
    else { p.base = cur; p.text = carried; p.conflict = false; }
  }
  return blocked;
}

/* small markdown renderer for real KB files: headings, lists, checklists,
   fenced + indented code, tables, blockquotes, rules */
function mdRender(raw){
  const HTML_COMMENT = new RegExp('<'+'!--[\\s\\S]*?--'+'>','g');   /* built dynamically — a literal one breaks HTML script parsing */
  let md = raw.replace(/^\s*---[\s\S]*?---\s*/,'').replace(HTML_COMMENT,'').trim();
  const lines = md.split('\n');
  let out=[], inCode=false, code=[], list=null, para=[], table=null, quote=null, ind=null;
  const inline = s => esc(s)
    .replace(/\[\[([^\]]+)\]\]/g,'<span class="wiki">$1</span>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/`([^`]+)`/g,'<code>$1</code>');
  const closeList = ()=>{ if(list){ out.push(list==='ol'?'</ol>':'</ul>'); list=null; } };
  const openList = kind => { if(list!==kind){ closeList(); out.push(kind==='ol'?'<ol>':'<ul>'); list=kind; } };
  const flushPara = ()=>{ if(para.length){ out.push('<p>'+inline(para.join(' '))+'</p>'); para=[]; } };
  const flushTable = ()=>{ if(table){ out.push('<div class="tablewrap"><table>'+table.join('')+'</table></div>'); table=null; } };
  const flushQuote = ()=>{ if(quote){ out.push('<blockquote>'+quote.map(inline).join('<br>')+'</blockquote>'); quote=null; } };
  const flushInd = ()=>{ if(ind){ out.push('<pre><code>'+esc(ind.join('\n'))+'</code></pre>'); ind=null; } };
  const flushAll = ()=>{ flushPara(); closeList(); flushTable(); flushQuote(); flushInd(); };
  for(const line of lines){
    if(line.trim().startsWith('```')){
      flushAll();
      if(!inCode){ inCode=true; code=[]; }
      else { out.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>'); inCode=false; }
      continue;
    }
    if(inCode){ code.push(line); continue; }
    if(!list && /^\s{4,}\S/.test(line) && !line.trim().startsWith('- ')){
      flushPara(); flushTable(); flushQuote();
      (ind ||= []).push(line.replace(/^\s{4}/,''));
      continue;
    }
    flushInd();
    const t = line.trim();
    if(!t){ flushAll(); continue; }
    if(t==='---'){ flushAll(); out.push('<hr>'); continue; }
    if(t.startsWith('|')){
      flushPara(); closeList(); flushQuote();
      if(/^[\s|:\-]+$/.test(t)) continue;                               /* separator row */
      const cells = t.replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>inline(c.trim()));
      const tag = table ? 'td' : 'th';
      (table ||= []).push('<tr>'+cells.map(c=>'<'+tag+'>'+(c||'&nbsp;')+'</'+tag+'>').join('')+'</tr>');
      continue;
    }
    flushTable();
    if(t.startsWith('> ') || t==='>'){
      flushPara(); closeList();
      (quote ||= []).push(t.replace(/^>\s?/,''));
      continue;
    }
    flushQuote();
    if(t.startsWith('# ')){ flushPara(); closeList(); continue; }        /* h1 = page title, skip */
    if(t.startsWith('## ')){ flushPara(); closeList(); out.push('<h2>'+inline(t.slice(3))+'</h2>'); continue; }
    if(t.startsWith('### ')){ flushPara(); closeList(); out.push('<h3>'+inline(t.slice(4))+'</h3>'); continue; }
    if(t.startsWith('- [ ]')){
      flushPara(); openList('ul');
      out.push('<li class="check"><span class="cb"></span><span>'+inline(t.slice(5).trim())+'</span></li>'); continue;
    }
    if(t.startsWith('- ')){
      flushPara(); openList('ul');
      out.push('<li>'+inline(t.slice(2))+'</li>'); continue;
    }
    if(/^\d+\.\s/.test(t)){
      flushPara(); openList('ol');
      out.push('<li>'+inline(t.replace(/^\d+\.\s*/,''))+'</li>'); continue;
    }
    if(list && /^\s{2,}/.test(line)){
      const last = out[out.length-1];
      out[out.length-1] = last.endsWith('</span></li>')
        ? last.replace(/<\/span><\/li>$/,' '+inline(t)+'</span></li>')
        : last.replace(/<\/li>$/,' '+inline(t)+'</li>');
      continue;
    }
    para.push(t);
  }
  flushAll();
  return out.join('\n');
}

function openSdrop(){

function renderSdrop(){
  const el = $('#sdrop'); if(!el) return;
  if(!state.pal.open){ el.classList.remove('on'); el.innerHTML=''; return; }
  const q = (state.pal.q||'').trim().toLowerCase();
  const match = (n,d)=>!q || (n+' '+d).toLowerCase().includes(q);
  const rows = [
    ...[...SKILLS, ...ENG_SKILLS].filter(s=>visibleToMe('skill',s.id) && match(s.name,s.desc)).map(s=>({ kind:'skill', id:s.id, t:s.name, d:s.desc,
      k:'Skill · '+CAT_LABEL(shelfFor(s)) })),
    ...TOOLS.filter(t=>visibleToMe('tool',t.id) && match(t.name,t.purpose)).map(t=>({ kind:'tool', id:t.id, t:t.name, d:t.purpose,
      k:'Tool · '+CAT_LABEL(shelfForTool(t.id)), logo:t })),
  ];
  state.pal.rows = rows;
  if(state.pal.sel >= rows.length) state.pal.sel = Math.max(0, rows.length-1);
  el.innerHTML = rows.length ? rows.map((r,i)=>
    '<button class="pal-row'+(i===state.pal.sel?' sel':'')+'" data-pi="'+i+'">'+
      (r.kind==='skill' ? '<span class="slashic">/</span>' : logoHtml(r.logo))+
      '<span class="pr-body"><span class="pr-t">'+esc(r.t)+'</span><span class="pr-d">'+esc(r.d)+'</span></span>'+
      '<span class="pr-k">'+esc(r.k)+'</span>'+
    '</button>').join('')
    : '<div class="pal-empty">Nothing matches “'+esc(state.pal.q)+'”.</div>';
  el.classList.add('on');
  el.querySelectorAll('[data-pi]').forEach(b=>{
    b.onclick = ()=>openPalRow(state.pal.rows[+b.dataset.pi]);
    b.onmousemove = ()=>{ const i=+b.dataset.pi; if(state.pal.sel!==i){ state.pal.sel=i; renderSdrop(); } };
  });
}
function palScroll(){ const el=$('#sdrop .pal-row.sel'); el&&el.scrollIntoView({block:'nearest'}); }
function openPalRow(r){
  closeSdrop();
  state.item = r.kind+':'+r.id; state.editing=null; state.tabFile='main';
  state.view='skills';
  if(r.kind==='tool'){ if(state.cat!=='all' && state.cat!==shelfForTool(r.id)) state.cat=shelfForTool(r.id); }
  else { const s=skillById(r.id); if(state.cat!=='all' && !(state.cat==='owned'&&ownsSkill(s)) && state.cat!==shelfFor(s)) state.cat=shelfFor(s); }
  render(); window.scrollTo({top:0});
}
function closeSdrop(){ state.pal={open:false}; const el=$('#sdrop'); if(el){ el.classList.remove('on'); el.innerHTML=''; } }
function wireSearch(){
  const si = $('#ask'); if(!si) return;
  si.onfocus = openSdrop;
  si.oninput = ()=>{ state.pal.q=si.value; state.pal.sel=0; state.pal.open=true; renderSdrop(); };
  si.onkeydown = e=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); state.pal.sel=Math.min(state.pal.sel+1, (state.pal.rows||[]).length-1); renderSdrop(); palScroll(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); state.pal.sel=Math.max(state.pal.sel-1, 0); renderSdrop(); palScroll(); }
    else if(e.key==='Enter'){ const r=(state.pal.rows||[])[state.pal.sel]; if(r) openPalRow(r); }
    else if(e.key==='Escape'){ closeSdrop(); si.blur(); }
  };
}

function renderShelf(){
  let html = '<div class="search-wrap"><div class="search" style="cursor:text">'+
    '<span class="glyph">⌕</span>'+
    '<input id="ask" type="text" placeholder="Search skills and tools" autocomplete="off" aria-label="Search skills and tools">'+
    '<kbd>/</kbd></div><div class="sdrop" id="sdrop"></div></div>';

  {
    /* what is waiting on me, and what I am waiting on */
    const rows=[];
    for(const s of ownedSkills()){
      const n = pendingForSkill(s).length;
      if(n) rows.push('<button class="strip-row" data-item="skill:'+s.id+'"><span class="sdot wait"></span>'+
        n+' proposed '+(n===1?'change':'changes')+' to '+esc(s.name)+' '+(n===1?'needs':'need')+' your approval<span class="go">Review ›</span></button>');
    }
    for(const p of myProposals()){

      if(p.status==='pending') rows.push('<button class="strip-row" data-item="skill:'+s.id+'"><span class="sdot wait"></span>'+

    if(rows.length) html += '<div class="strip">'+rows.join('')+'</div>';

    /* a shelf holds both — the skills and the tools that belong to this group */
    const skills = shelfSkills(state.cat).filter(s=>visibleToMe('skill',s.id));
    const tools = shelfTools(state.cat).map(toolById).filter(t=>visibleToMe('tool',t.id));
    const emptyMsg = state.cat==='owned' ? 'You don’t own any skills yet.'

/* ————— what changed, and who is waiting on whom ————— */
function diffLines(a, b){
  const A=a.split('\n'), B=b.split('\n'), m=A.length, n=B.length;
  const dp=Array.from({length:m+1},()=>new Uint32Array(n+1));
  for(let i=m-1;i>=0;i--) for(let j=n-1;j>=0;j--)
    dp[i][j] = A[i]===B[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const out=[]; let i=0, j=0;
  while(i<m && j<n){
    if(A[i]===B[j]){ out.push(['ctx',A[i]]); i++; j++; }
    else if(dp[i+1][j] >= dp[i][j+1]) out.push(['del',A[i++]]);
    else out.push(['add',B[j++]]);
  }
  while(i<m) out.push(['del',A[i++]]);
  while(j<n) out.push(['add',B[j++]]);
  return out;
}
function diffHtml(base, text){
  const rows = diffLines(base, text);
  const keep = new Set();
  rows.forEach((r,i)=>{ if(r[0]!=='ctx') for(let k=i-2;k<=i+2;k++) if(k>=0 && k<rows.length) keep.add(k); });
  const gap = n => '<span class="dl gap">'+n+' unchanged '+(n===1?'line':'lines')+'</span>';
  let html='', hidden=0;
  rows.forEach((r,i)=>{
    if(!keep.has(i)){ hidden++; return; }
    if(hidden){ html += gap(hidden); hidden=0; }
    html += '<span class="dl '+r[0]+'">'+(esc(r[1]) || '&nbsp;')+'</span>';
  });
  if(hidden) html += gap(hidden);
  return html;
}
function changeBox(s, f, p, ownerView){
  const author = proposalAuthor(p);
  const mine = p.by === state.user;
  const who = mine ? 'You' : author.name;
  const first = author.name.split(' ')[0];
  /* blocked: someone else's change landed on the same lines first */
  if(p.conflict){
    const acts = ownerView
      ? '<span class="acts"><button class="btn tiny quiet" data-prop-decline="'+p.id+'">Decline</button></span>'
      : (mine ? '<span class="acts"><button class="btn tiny quiet" data-prop-withdraw="'+p.id+'">Withdraw</button></span>' : '');
    return '<div class="changebox blocked">'+
      '<div class="chead">'+avHtml(author)+'<span class="who"><b>'+esc(who)+'</b> proposed a change · '+esc(p.when)+'</span>'+
      '<span class="stat">'+esc(f.file)+'</span></div>'+
      '<div class="diff">'+diffHtml(p.base, p.text)+'</div>'+
      '<div class="cfoot conflict"><span class="stopped">Blocked — these lines changed after this was written</span>'+
      '<span class="sub">'+esc(mine
        ? 'Resolve it with your agent against the current text, then propose the change again.'
        : first+' has to resolve it with their agent against the current text and propose again. It cannot be approved as it stands.')+
      '</span>'+acts+'</div></div>';
  }
  const acts = ownerView
    ? '<span class="acts"><button class="btn tiny quiet" data-prop-decline="'+p.id+'">Decline</button>'+
      '<button class="btn tiny accept" data-prop-approve="'+p.id+'">Approve</button></span>'
    : (mine ? '<span class="acts"><button class="btn tiny quiet" data-prop-withdraw="'+p.id+'">Withdraw</button></span>' : '');
  return '<div class="changebox">'+
    '<div class="chead">'+avHtml(author)+'<span class="who"><b>'+esc(who)+'</b> proposed a change · '+esc(p.when)+'</span>'+
    '<span class="stat">'+esc(f.file)+'</span></div>'+
    '<div class="diff">'+diffHtml(p.base, p.text)+'</div>'+
    '<div class="cfoot"><span class="pending"><span class="cdot"></span>Pending approval</span>'+
    '<span class="sub">'+esc(ownerView ? 'You decide — you own this.' : 'Waiting on '+s.owner)+'</span>'+
    acts+'</div></div>';
}

function openAccessPanel(kind, id, fork){
  if(!currentUser().admin){ openSharePanel(kind,id); return; }
  const name = itemName(kind, id);
  const w = whoCanUse(kind, id);
  const s = kind==='skill' ? skillById(id) : null;
  const grp = kind==='skill' ? groupOf(id) : null;
  let body = '';
  if(fork){
    body = '<p style="margin-top:12px">Everyone’s access here comes from the <strong>'+esc(CAT_LABEL(fork))+'</strong> category — the whole category is granted to everyone at Bevel.</p>'+
      '<div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">'+
      '<button class="btn small" data-p-exclude>Exclude just this skill</button>'+
      '<button class="btn small quiet" data-p-cat>Open the category</button></div>';
  } else {
    const rows = [];
    if(w.everyone){
      const viaCat = kind==='skill' && ACCESS.company.cats.includes(grp);
      rows.push('<div class="kv"><span class="k">Everyone at Bevel'+
        '<span class="sub">'+(viaCat?'Via the '+esc(CAT_LABEL(grp))+' category':'In the baseline — every team gets it')+'</span></span>'+
        '<span class="v"><button class="btn tiny quiet" data-p-rm="everyone">Remove</button></span></div>');
    } else if(kind==='skill' && isExcluded(kind,id) && ACCESS.company.cats.includes(grp)){
      rows.push('<div class="kv"><span class="k">Everyone at Bevel'+
        '<span class="sub">Excluded from the '+esc(CAT_LABEL(grp))+' category</span></span>'+
        '<span class="v"><button class="btn tiny quiet" data-p-restore>Restore</button></span></div>');
    }
    for(const t of w.teams){
      const direct = ACCESS[t.id].items.some(i=>i.kind===kind&&i.id===id) || (kind==='tool'&&ACCESS[t.id].tools.includes(id));
      rows.push('<div class="kv"><span class="k">'+esc(t.name)+
        '<span class="sub">'+(direct?'Added directly':'Via the '+esc(CAT_LABEL(grp))+' category')+'</span></span>'+
        '<span class="v"><button class="btn tiny quiet" data-p-rm="team:'+t.id+'">Remove</button></span></div>');
    }
    for(const p of w.people){
      rows.push('<div class="kv"><span class="k" style="display:flex;gap:10px;align-items:center">'+avHtml(p)+
        '<span>'+esc(p.name)+'<span class="sub">Added individually</span></span></span>'+
        '<span class="v"><button class="btn tiny quiet" data-p-rm="person:'+p.id+'">Remove</button></span></div>');
    }
    if(!rows.length) rows.push('<p style="margin-top:12px;color:var(--wait);font-size:13px">No one can use this right now — add a team below.</p>');
    const op = s ? (PEOPLE.find(p=>p.name===s.owner) || PEOPLE.find(p=>p.name.split(' ')[0]===s.owner)) : null;
    body = rows.join('')+
      '<div class="kv"><span class="k" style="display:flex;gap:10px;align-items:center">'+(op?avHtml(op):'')+
      '<span>'+esc(s?s.owner:'The Admins')+'<span class="sub">Owner — confirms changes here</span></span></span><span class="v"></span></div>';
    if(!w.everyone){
      body += '<input class="addin" id="acc-add" type="text" placeholder="Add a team or person" autocomplete="off">'+
        '<div class="mrows" id="acc-rows"></div>';
    } else {
      body += '<p style="font-size:12px;color:var(--ink3);margin-top:12px">Everyone can already use this. Admins can always see everything.</p>';
    }
  }
  const m = openModal('<h3>Who can use '+esc(name)+'</h3>'+body+
    '<div class="mfoot" style="align-items:center"><span class="admintag" style="margin-right:auto">Only Admins see this</span>'+
    (fork?'<button class="btn quiet" data-p-back>‹ Back</button>':'<button class="btn quiet" data-m-close>Close</button>')+'</div>');
  const refresh = ()=>{ render(); openAccessPanel(kind, id); };
  if(fork){
    m.querySelector('[data-p-exclude]').onclick = ()=>{
      EXCLUSIONS.push({kind, id});
      toast('Excluded — only teams you add can use it now.');
      refresh();
    };
    m.querySelector('[data-p-cat]').onclick = ()=>{
      closeAgentModal(); state.view='console'; state.team='company'; state.item=null; render(); window.scrollTo({top:0});
    };
    m.querySelector('[data-p-back]').onclick = ()=>openAccessPanel(kind, id);
    return;
  }
  m.querySelectorAll('[data-p-rm]').forEach(b=>b.onclick=()=>{
    const v = b.dataset.pRm;
    if(v==='everyone'){
      if(kind==='skill' && ACCESS.company.cats.includes(grp)){ openAccessPanel(kind, id, grp); return; }
      if(kind==='tool') ACCESS.company.tools = ACCESS.company.tools.filter(x=>x!==id);
      ACCESS.company.items = ACCESS.company.items.filter(i=>!(i.kind===kind&&i.id===id));
      toast('Removed from the baseline.');
      refresh(); return;
    }
    const [g, pid] = v.split(':');
    if(g==='team'){
      const a = ACCESS[pid];
      if(kind==='tool') a.tools = a.tools.filter(x=>x!==id);
      a.items = a.items.filter(i=>!(i.kind===kind&&i.id===id));
      toast('Removed for '+teamById(pid).name+'.');
    } else {
      const i = EXCEPTIONS.findIndex(x=>x.person===pid && x.kind===kind && x.id===id);
      if(i>=0) EXCEPTIONS.splice(i,1);
      toast('Removed for '+personById(pid).name+'.');
    }
    refresh();
  });
  const rb = m.querySelector('[data-p-restore]');
  if(rb) rb.onclick = ()=>{
    const i = EXCLUSIONS.findIndex(x=>x.kind===kind&&x.id===id);
    if(i>=0) EXCLUSIONS.splice(i,1);
    toast('Restored — everyone can use it again.');
    refresh();
  };
  const inp = m.querySelector('#acc-add');
  if(inp){
    const rowsEl = m.querySelector('#acc-rows');
    const draw = ()=>{
      const q = inp.value.trim().toLowerCase();
      const cand = [
        ...TEAMS.filter(t=>!w.teams.some(x=>x.id===t.id))
          .map(t=>({g:'team', id:t.id, t:t.name, d:t.members.map(m2=>personById(m2).name.split(' ')[0]).join(', '), k:'Team'})),
        ...PEOPLE.filter(p=>!w.people.some(x=>x.id===p.id) && !w.teams.some(t=>t.members.includes(p.id)))
          .map(p=>({g:'person', id:p.id, t:p.name, d:p.email, k:'Person'})),
      ].filter(c=>!q || (c.t+' '+c.d).toLowerCase().includes(q));
      rowsEl.innerHTML = cand.map(c=>'<button class="pal-row" data-pk="'+c.g+':'+c.id+'">'+
        (c.g==='team'?'<span class="slashic">'+esc(c.t[0])+'</span>':avHtml(personById(c.id)))+
        '<span class="pr-body"><span class="pr-t">'+esc(c.t)+'</span><span class="pr-d">'+esc(c.d)+'</span></span>'+
        '<span class="pr-k">'+esc(c.k)+'</span></button>').join('')
        || '<div class="pal-empty">No one left to add.</div>';
      rowsEl.querySelectorAll('[data-pk]').forEach(b=>b.onclick=()=>{
        const [g, pid] = b.dataset.pk.split(':');
        if(g==='team'){
          if(kind==='tool') ACCESS[pid].tools.push(id);
          else ACCESS[pid].items.push({kind, id});
          toast('Added — everyone on '+teamById(pid).name+' can use it now.');
        } else {
          EXCEPTIONS.push({person:pid, kind, id});
          toast('Added for '+personById(pid).name+' — an individual exception.');
        }
        refresh();
      });
    };
    inp.oninput = draw; draw();
  }
}

function grantRow(tid, kind, id){
  let icon='', title='', sub='', target='';
  if(kind==='cat'){
    title = CAT_LABEL(id)+' — category';
    sub = catSkills(id).length+' skills · includes new skills automatically';
    target=' data-grant-cat="'+id+'"';
  } else if(kind==='tool'){
    const t = toolById(id); icon = logoHtml(t); title = t.name; sub = 'Tool · '+t.purpose;
    target=' data-item="tool:'+id+'"';
  } else {
    icon = '<span class="slashic">/</span>';
    title = itemName('skill', id); sub = 'Skill · from the '+CAT_LABEL(groupOf(id))+' category';
    target=' data-item="skill:'+id+'"';
  }
  return '<div class="kv"><button class="grant-link"'+target+'>'+icon+
    '<span style="min-width:0">'+esc(title)+'<span class="sub">'+esc(sub)+'</span></span></button>'+
    '<span class="v"><button class="btn tiny quiet" data-g-rm="'+tid+'|'+kind+'|'+id+'">Remove</button></span></div>';
}

    shelf += '<div class="h4">Skills everyone can use</div>'+
      ((a.cats.map(c=>grantRow(tid,'cat',c)).join('')+
        a.items.filter(i=>i.kind==='skill').map(i=>grantRow(tid,'skill',i.id)).join('')) ||
       '<p style="font-size:13px;color:var(--ink2);padding:4px 0 2px">No skills in the baseline yet.</p>');
    if(EXCLUSIONS.length) shelf += '<div class="h4">Excluded from the baseline</div>'+EXCLUSIONS.map(x=>

      '<span class="sub">Pulled out of the '+esc(CAT_LABEL(groupOf(x.id)))+' category — only teams granted it directly can use it</span></span></button>'+
      '<span class="v"><button class="btn tiny quiet" data-x-restore="'+x.kind+'|'+x.id+'">Restore</button></span></div>').join('');
    shelf += '<div class="h4">Tools everyone can use</div>'+
      (a.tools.map(x=>grantRow(tid,'tool',x)).join('') ||
       '<p style="font-size:13px;color:var(--ink2);padding:4px 0 2px">No tools in the baseline yet.</p>');
    shelf += '<div style="margin-top:16px"><button class="btn small" data-add-grants="company">+ Add to the baseline</button></div>';
  } else {
    shelf += '<div class="h4">From everyone at Bevel</div>'+
      '<div class="kv"><span class="k">The baseline<span class="sub">'+base.skills+' skills · '+base.tools+' tools — granted to everyone</span></span>'+
      '<span class="v"><button class="btn tiny quiet" data-team="company">View ›</button></span></div>';

      .concat(a.tools.map(x=>grantRow(tid,'tool',x)))

      (rows.join('') || '<p style="font-size:13px;color:var(--ink2);padding:4px 0 2px">Nothing extra yet — this team uses the baseline.</p>');

  const people = isCo ? PEOPLE.filter(p=>!p.agent) : t.members.map(personById);
  const peopleCount = isCo ? ORG_SIZE : t.headcount;
  const memRow = p => {
    const exx = EXCEPTIONS.map((x,i)=>({x,i})).filter(e=>e.x.person===p.id);
    return '<div class="mem">'+avHtml(p)+'<span class="mi">'+
      '<span class="mn">'+esc(p.name)+(p.admin?'<span class="tag">Admin</span>':'')+(p.agent?'<span class="tag">Agent account</span>':'')+'</span>'+
      '<span class="msub">'+esc(p.email)+'</span>'+
      exx.map(e=>'<span class="mx">Also has '+esc(itemName(e.x.kind,e.x.id))+' — added individually'+
        '<button class="btn tiny quiet" data-ex-rm="'+e.i+'">Remove</button></span>').join('')+
      '</span>'+
      (!isCo?'<button class="rm-x" data-mem-rm="'+tid+'|'+p.id+'" title="Remove from '+esc(t.name)+'" aria-label="Remove '+esc(p.name)+' from '+esc(t.name)+'">×</button>':'')+

  return '<button class="back" data-team="">‹ Teams</button>'+
    '<div class="item-grid"><article>'+
      '<div class="kicker">'+(isCo?'Admin console':'Admin console · Team')+'</div>'+

                              :'People on this team get the baseline, plus anything granted on this page.')+'</p>'+

function openGrantModal(tid, q0){
  const isCo = tid==='company';
  const target = isCo ? 'the baseline' : teamById(tid).name;
  const candidates = ()=>{
    const list = [];
    for(const c of ['gtm','org','general','eng']){
      if(ACCESS[tid].cats.includes(c)) continue;
      if(!isCo && ACCESS.company.cats.includes(c)) continue;
      list.push({g:'cat', id:c, t:CAT_LABEL(c)+' — category', d:catSkills(c).length+' skills · includes new skills automatically', k:'Category'});
    }
    for(const tl of TOOLS){
      if(teamGrants(tid,'tool',tl.id)) continue;
      if(!isCo && teamGrants('company','tool',tl.id)) continue;
      list.push({g:'tool', id:tl.id, t:tl.name, d:tl.purpose, k:'Tool', logo:tl});
    }
    for(const s of [...SKILLS, ...ENG_SKILLS]){
      if(teamGrants(tid,'skill',s.id)) continue;
      if(!isCo && teamGrants('company','skill',s.id)) continue;
      list.push({g:'skill', id:s.id, t:s.name, d:'Skill · from the '+CAT_LABEL(groupOf(s.id))+' category', k:'Skill'});
    }
    return list;
  };
  const m = openModal('<h3>Add to '+esc(target)+'</h3>'+
    '<p>Granting a category covers every skill in it, including new ones.</p>'+
    '<input class="addin" id="g-add" type="text" placeholder="Search skills, tools, and categories" autocomplete="off">'+
    '<div class="mrows" id="g-rows"></div>'+
    '<div class="mfoot"><button class="btn quiet" data-m-close>Done</button></div>');
  const inp = m.querySelector('#g-add'), rowsEl = m.querySelector('#g-rows');
  const draw = ()=>{
    const q = inp.value.trim().toLowerCase();
    const cand = candidates().filter(c=>!q || (c.t+' '+c.d).toLowerCase().includes(q));
    rowsEl.innerHTML = cand.map(c=>'<button class="pal-row" data-gk="'+c.g+':'+c.id+'">'+
      (c.logo?logoHtml(c.logo):'<span class="slashic">'+(c.g==='cat'?'▤':'/')+'</span>')+
      '<span class="pr-body"><span class="pr-t">'+esc(c.t)+'</span><span class="pr-d">'+esc(c.d)+'</span></span>'+
      '<span class="pr-k">'+esc(c.k)+'</span></button>').join('')
      || '<div class="pal-empty">Nothing left to add — '+esc(target)+' already covers it all.</div>';
    rowsEl.querySelectorAll('[data-gk]').forEach(b=>b.onclick=()=>{
      const [g, id] = b.dataset.gk.split(':');
      if(g==='cat') ACCESS[tid].cats.push(id);
      else if(g==='tool') ACCESS[tid].tools.push(id);
      else ACCESS[tid].items.push({kind:'skill', id});
      toast('Added to '+target+'.');
      render();
      openGrantModal(tid, inp.value);
    });
  };
  if(q0) inp.value = q0;
  inp.oninput = draw; draw();
  setTimeout(()=>inp.focus(), 40);
}

function openPersonModal(tid){
