function draftCardHtml(d){
  return '<div class="rail-card draft" data-y="'+d.y+'">'+
    '<div class="rc-head"><span>Suggest a change</span></div>'+
    '<div class="q old">'+esc(trunc(d.text))+'</div>'+
    '<textarea id="d-new">'+esc(norm(d.text))+'</textarea>'+
    '<div class="why" style="margin-top:6px">Edit the text — or clear it to suggest removing this line.</div>'+
    '<input id="d-why" type="text" placeholder="Why? (optional, one line)">'+
    '<div class="rc-foot"><button class="btn tiny quiet" data-draft-cancel>Cancel</button>'+
    '<button class="btn tiny primary" data-draft-send>Send</button></div>'+
  '</div>';
}

function anchorRail(){
  const rail = $('#rail'), doc = $('#doc'), art = $('#article');
  if(!rail || !doc || !art) return;
  const artTop = art.getBoundingClientRect().top;
  /* wrap needles in the doc */
  rail.querySelectorAll('.rail-card[data-needle]').forEach(card=>{
    const needle = card.dataset.needle.replace(/\s+/g,' ').trim();
    if(!needle || card.dataset.anchored) return;
    const walker = document.createTreeWalker(doc, NodeFilter.SHOW_TEXT);
    let node;
    while((node = walker.nextNode())){
      const hay = node.textContent.replace(/\s+/g,' ');
      const idx = hay.indexOf(needle.slice(0, 30));
      if(idx>=0){
        /* map normalized index back approximately: use raw indexOf of first 12 chars */
        const rawIdx = node.textContent.indexOf(needle.slice(0,12));
        if(rawIdx>=0){
          const range = document.createRange();
          range.setStart(node, rawIdx);
          range.setEnd(node, Math.min(node.textContent.length, rawIdx + Math.min(needle.length, 60)));
          const mark = document.createElement('mark'); mark.className='anch';
          try{ range.surroundContents(mark); card.dataset.anchorTop = (mark.getBoundingClientRect().top - artTop); }
          catch(e){ card.dataset.anchorTop = (node.parentElement.getBoundingClientRect().top - artTop); }
        }
        break;
      }
    }
    card.dataset.anchored = '1';
  });
  /* place cards top-down without overlap */
  const cards = [...rail.querySelectorAll('.rail-card')];
  cards.sort((a,b)=>(parseFloat(a.dataset.anchorTop ?? a.dataset.y ?? 0))-(parseFloat(b.dataset.anchorTop ?? b.dataset.y ?? 0)));
  let cursor = 0;
  for(const c of cards){
    const want = parseFloat(c.dataset.anchorTop ?? c.dataset.y ?? 0);
    const top = Math.max(want, cursor);
    c.style.top = top+'px';
    cursor = top + c.offsetHeight + 10;
  }
  rail.style.minHeight = Math.max(cursor, 40)+'px';
}

function renderRail(){
  const rail = $('#rail'); if(!rail) return;
  const [kind,id] = (state.item||'').split(':');
  if(kind!=='skill'){ rail.innerHTML=''; return; }
  const s=skillById(id);
  const ownerView=ownsSkill(s);
  const sugs = ownerView ? pendingForSkill(s)
    : SUGGESTIONS.filter(x=>x.skill===id && x.status==='waiting' && x.by===state.user);
  let html = sugs.map(ownerView?ownerReviewCardHtml:railCardHtml).join('');
  if(ownerView && !sugs.length) html='<div class="review-empty">You’re caught up. New suggestions to this skill will appear here and in the yellow count on Owned by me.</div>';
  if(!ownerView && state.draft && state.draft.skill===id) html += draftCardHtml(state.draft);
  rail.innerHTML = html;
  wire(rail);
  rail.querySelectorAll('[data-goto]').forEach(c=>c.onclick=e=>{
    if(e.target.closest('button,input,textarea')) return;
    state.tabFile=c.dataset.goto; state.draft=null; render();
  });
  const rc=$('#rail-count');
  if(rc){ rc.textContent=sugs.length; rc.style.display=sugs.length?'inline-flex':'none'; }
  const rj=$('#rail-jump');
  if(rj){
    rj.style.display=sugs.length?'block':'none';
    rj.textContent=ownerView ? (sugs.length===1?'Jump to suggested change ↓':'Jump to '+sugs.length+' suggested changes ↓')
      : (sugs.length===1?'Jump to your suggestion ↓':'Jump to your '+sugs.length+' suggestions ↓');
    rj.onclick=()=>{ const c=rail.querySelector('.rail-card'); c&&c.scrollIntoView({behavior:'smooth',block:'center'}); };
  }
  rail.querySelectorAll('[data-sug-edit]').forEach(b=>b.onclick=()=>{ state.editSug=b.dataset.sugEdit; state.draft=null; renderRail(); });
  rail.querySelectorAll('[data-sug-cancel]').forEach(b=>b.onclick=()=>{ state.editSug=null; renderRail(); });
  rail.querySelectorAll('[data-sug-remove]').forEach(b=>b.onclick=()=>{
    const i=SUGGESTIONS.findIndex(x=>x.id===b.dataset.sugRemove);
    if(i>=0) SUGGESTIONS.splice(i,1);
    state.editSug=null; renderRail();
    toast('Suggestion removed.');
  });
  rail.querySelectorAll('[data-sug-save]').forEach(b=>b.onclick=()=>{
    const sg=SUGGESTIONS.find(x=>x.id===b.dataset.sugSave); if(!sg) return;
    const neu=rail.querySelector('#e-new').value.trim();
    if(neu===norm(sg.old)){ toast('Edit the text — or clear it to suggest removing this line.'); return; }
    sg.neu=neu; sg.why=rail.querySelector('#e-why').value.trim();
    state.editSug=null; renderRail();
    toast('Updated — still waiting on '+sg.on+'.');
  });
  rail.querySelectorAll('[data-comment-send]').forEach(b=>{
    const sendComment=()=>{
      const sg=SUGGESTIONS.find(x=>x.id===b.dataset.commentSend); if(!sg) return;
      const input=b.closest('.comment-form').querySelector('[data-comment-input]');
      const text=input.value.trim(); if(!text){ input.focus(); return; }
      (sg.comments ||= []).push({by:state.user,text,when:'Now'});
      renderRail();
      toast('Comment added.');
    };
    b.onclick=sendComment;
    const input=b.closest('.comment-form').querySelector('[data-comment-input]');
    input.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); sendComment(); } };
  });
  rail.querySelectorAll('[data-review-accept]').forEach(b=>b.onclick=()=>{
    const sg=SUGGESTIONS.find(x=>x.id===b.dataset.reviewAccept); if(!sg) return;
    applySuggestionToSource(sg);
    sg.status='applied'; sg.when='today';
    render();
    toast('Applied. '+suggestionAuthor(sg).name+' will see the update.');
  });
  rail.querySelectorAll('[data-review-decline]').forEach(b=>b.onclick=()=>{
    const sg=SUGGESTIONS.find(x=>x.id===b.dataset.reviewDecline); if(!sg) return;
    sg.status='declined'; sg.when='today';
    render();
    toast('Declined. The skill was not changed.');
  });
  const send = rail.querySelector('[data-draft-send]');
  if(send){
    send.onclick = ()=>{
      const s = skillById(state.draft.skill);
      const neu = rail.querySelector('#d-new').value.trim();
      if(neu===norm(state.draft.text)){ toast('Edit the text — or clear it to suggest removing this line.'); return; }
      SUGGESTIONS.unshift({ id:'sg-'+Date.now(), skill:s.id, status:'waiting', on:s.owner, by:state.user, submitted:'today', comments:[],
        file:state.draft.file||'main',
        old:state.draft.text, neu, why:rail.querySelector('#d-why').value.trim(),
        needle:state.draft.text.slice(0,28) });
      state.draft=null;
      renderRail(); requestAnimationFrame(anchorRail);
      toast('Sent to '+s.owner+' — nothing changes until they confirm.');
    };
    rail.querySelector('[data-draft-cancel]').onclick = ()=>{ state.draft=null; renderRail(); requestAnimationFrame(anchorRail); };
    setTimeout(()=>rail.querySelector('#d-new')?.focus(), 60);
  }
  requestAnimationFrame(anchorRail);
}

function applySuggestionToSource(sg){
  const s=skillById(sg.skill);
  const f=skillFiles(s).find(x=>x.id===(sg.file||'main'));
  if(!f || !sg.neu) return;
  if(f.mdId || f.codeId){
    const src=document.getElementById(f.mdId||f.codeId);
    if(src){
      const pattern=sg.old.trim().split(/\s+/).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('\\s+');
      src.textContent=src.textContent.replace(new RegExp(pattern),sg.neu);
    }
  } else if(f.inline && Array.isArray(f.inline.instr)){
    const i=f.inline.instr.findIndex(x=>norm(x)===norm(sg.old));
    if(i>=0) f.inline.instr[i]=sg.neu;
  }
}

/* =========================================================
   Selection → suggest
   ========================================================= */
const selchip = $('#selchip');
document.addEventListener('selectionchange', ()=>{
  const sel = document.getSelection();
  if(!sel || sel.isCollapsed || !sel.rangeCount){ selchip.style.display='none'; return; }
  const range = sel.getRangeAt(0);
  const host = range.commonAncestorContainer.parentElement?.closest?.('#doc');
  if(!host){ selchip.style.display='none'; return; }
  if(ownsSkill(skillById(host.dataset.skill))){ selchip.style.display='none'; return; }
  const text = sel.toString().replace(/\s+/g,' ').trim();
  if(text.length<3 || text.length>500){ selchip.style.display='none'; return; }
  const r = range.getBoundingClientRect();
  const art = $('#article');
  selchip.dataset.text = text;
  selchip.dataset.skill = host.dataset.skill;
  selchip.dataset.file = host.dataset.file || 'main';
  selchip.dataset.y = art ? (r.top - art.getBoundingClientRect().top) : 0;
  selchip.style.display='block';
  selchip.style.left = Math.max(12, r.left + r.width/2 - 62 + window.scrollX)+'px';
  selchip.style.top = (r.top + window.scrollY - 40)+'px';
});
selchip.onclick = ()=>{
  state.draft = { skill:selchip.dataset.skill, file:selchip.dataset.file||'main', text:selchip.dataset.text, y:parseFloat(selchip.dataset.y)||0 };
  selchip.style.display='none';
  document.getSelection().removeAllRanges();
  renderRail();
};

/* =========================================================
   Share contains access, ownership, and role information.
   Admins can continue from it into access management.
   One grant model, two lenses: the item page answers "who can
   use this?", the console answers "what does this team have?"
   ========================================================= */
function openSharePanel(kind,id){
  const name=itemName(kind,id);
  const w=whoCanUse(kind,id);
  const s=kind==='skill'?skillById(id):null;
  const me=currentUser();
  const op=s ? PEOPLE.find(p=>p.name===s.owner) : null;
  const admins=PEOPLE.filter(p=>p.admin);
  const accessName=w.everyone ? 'Everyone at Bevel'
    : (w.teams.length?w.teams.map(t=>t.name).join(', '):'Restricted access');
  const accessSub=w.everyone ? ORG_SIZE+' people can use this '+kind
    : (w.teams.length?'Members of '+w.teams.map(t=>t.name).join(', '):'Only individually added people can use it');
  const memberRow=(!op || me.id!==op.id) ? '<div class="share-row">'+avHtml(me)+
    '<span class="si"><span class="sn">'+esc(me.name)+(me.id===op?.id?' <span class="tag">Owner</span>':'')+'</span><span class="ss">'+esc(me.email)+'</span></span>'+
    '<span class="sr">'+(me.admin?'Admin':'Member')+'</span></div>' : '';
  const ownerRow=op ? '<div class="share-row">'+avHtml(op)+'<span class="si"><span class="sn">'+esc(op.name)+
    '<span class="tag">Owner</span>'+(op.admin?'<span class="tag">Admin</span>':'')+'</span><span class="ss">Confirms suggested content changes</span></span></div>' : '';
  const otherAdmins=admins.filter(p=>(!op||p.id!==op.id) && p.id!==me.id);
  const adminNames=otherAdmins.map(p=>p.name.split(' ')[0]).join(', ');
  const link=location.href.split('#')[0]+'#item='+kind+':'+id+'&user='+state.user;
  const m=openModal('<h3>Share '+esc(kind)+'</h3><p>Access, ownership, and roles for <strong style="color:var(--ink)">'+esc(name)+'</strong>.</p>'+
    '<div class="share-summary"><div class="share-section">Access</div><div class="share-row"><span class="logo"><span class="mg">B</span></span>'+
      '<span class="si"><span class="sn">'+esc(accessName)+'</span><span class="ss">'+esc(accessSub)+'</span></span><span class="sr">Can use</span></div>'+
    '<div class="share-section">People</div>'+ownerRow+memberRow+
      '<div class="share-row"><span class="avs">'+otherAdmins.map(avHtml).join('')+'</span><span class="si"><span class="sn">'+esc(adminNames||'Admins')+'</span><span class="ss">Can manage who has access</span></span><span class="sr">Admins</span></div>'+
    '<div class="share-link"><span><span class="sn" style="font-size:13px;font-weight:500">Link access</span><span class="sub">Works for people listed above</span></span>'+
      '<button class="btn small" data-copy="'+esc(link)+'">'+COPY_SVG+' Copy link</button></div></div>'+
    '<div class="mfoot">'+(me.admin?'<button class="btn quiet" data-share-manage>Manage access</button>':'<span style="font-size:11.5px;color:var(--ink3);margin-right:auto">Ask an Admin to change access.</span>')+
      '<button class="btn" data-m-close>Done</button></div>');
  const manage=m.querySelector('[data-share-manage]');
  if(manage) manage.onclick=()=>openAccessPanel(kind,id);
}

function accStrip(kind, id){
  const w = whoCanUse(kind, id);
  const s = kind==='skill' ? skillById(id) : null;
  const who = w.everyone ? 'Everyone at Bevel'
    : (w.teams.length ? w.teams.map(t=>t.name).join(' · ') : 'No one yet');
  const extra = w.people.length ? ' · +'+w.people.length+(w.people.length===1?' person':' people') : '';
  return '<div class="acc"><span class="ak">Access</span><span'+(w.everyone||w.teams.length?'':' style="color:var(--wait)"')+'>'+
    esc(who)+extra+'</span>'+
    '<span style="color:var(--ink3)">·</span><span>Owner: '+esc(s?s.owner:'the Admins')+'</span>'+
    '<button class="btn tiny quiet" data-acc>Manage</button>'+
    '<span class="admintag">Admins only</span></div>';
}

function openModal(html){
  const w = $('#mwrap');
  w.innerHTML = '<div class="mcard">'+html+'</div>';
  w.classList.add('on');
  w.onclick = e=>{ if(e.target===w) closeAgentModal(); };
  w.querySelectorAll('[data-m-close]').forEach(b=>b.onclick=closeAgentModal);
  wire(w);
  return w;
}

function openAccessPanel(kind, id, fork){
  if(!currentUser().admin){ openSharePanel(kind,id); return; }
  const name = itemName(kind, id);
  const w = whoCanUse(kind, id);
  const s = kind==='skill' ? skillById(id) : null;
  const grp = kind==='skill' ? groupOf(id) : null;
  let body = '';
  if(fork){
    body = '<p style="margin-top:12px">Everyone’s access here comes from the <strong>'+esc(CAT_LABEL(fork))+'</strong> category — the whole category is granted to everyone at Bevel.</p>'+
      '<div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">'+
      '<button class="btn small" data-p-exclude>Exclude just this skill</button>'+
      '<button class="btn small quiet" data-p-cat>Open the category</button></div>';
  } else {
    const rows = [];
    if(w.everyone){
      const viaCat = kind==='skill' && ACCESS.company.cats.includes(grp);
      rows.push('<div class="kv"><span class="k">Everyone at Bevel'+
        '<span class="sub">'+(viaCat?'Via the '+esc(CAT_LABEL(grp))+' category':'In the baseline — every team gets it')+'</span></span>'+
        '<span class="v"><button class="btn tiny quiet" data-p-rm="everyone">Remove</button></span></div>');
    } else if(kind==='skill' && isExcluded(kind,id) && ACCESS.company.cats.includes(grp)){
      rows.push('<div class="kv"><span class="k">Everyone at Bevel'+
        '<span class="sub">Excluded from the '+esc(CAT_LABEL(grp))+' category</span></span>'+
        '<span class="v"><button class="btn tiny quiet" data-p-restore>Restore</button></span></div>');
    }
    for(const t of w.teams){
      const direct = ACCESS[t.id].items.some(i=>i.kind===kind&&i.id===id) || (kind==='tool'&&ACCESS[t.id].tools.includes(id));
      rows.push('<div class="kv"><span class="k">'+esc(t.name)+
        '<span class="sub">'+(direct?'Added directly':'Via the '+esc(CAT_LABEL(grp))+' category')+'</span></span>'+
        '<span class="v"><button class="btn tiny quiet" data-p-rm="team:'+t.id+'">Remove</button></span></div>');
    }
    for(const p of w.people){
      rows.push('<div class="kv"><span class="k" style="display:flex;gap:10px;align-items:center">'+avHtml(p)+
        '<span>'+esc(p.name)+'<span class="sub">Added individually</span></span></span>'+
        '<span class="v"><button class="btn tiny quiet" data-p-rm="person:'+p.id+'">Remove</button></span></div>');
    }
    if(!rows.length) rows.push('<p style="margin-top:12px;color:var(--wait);font-size:13px">No one can use this right now — add a team below.</p>');
    const op = s ? (PEOPLE.find(p=>p.name===s.owner) || PEOPLE.find(p=>p.name.split(' ')[0]===s.owner)) : null;
    body = rows.join('')+
      '<div class="kv"><span class="k" style="display:flex;gap:10px;align-items:center">'+(op?avHtml(op):'')+
      '<span>'+esc(s?s.owner:'The Admins')+'<span class="sub">Owner — confirms changes here</span></span></span><span class="v"></span></div>';
    if(!w.everyone){
      body += '<input class="addin" id="acc-add" type="text" placeholder="Add a team or person" autocomplete="off">'+
        '<div class="mrows" id="acc-rows"></div>';
    } else {
      body += '<p style="font-size:12px;color:var(--ink3);margin-top:12px">Everyone can already use this. Admins can always see everything.</p>';
    }
  }
  const m = openModal('<h3>Who can use '+esc(name)+'</h3>'+body+
    '<div class="mfoot" style="align-items:center"><span class="admintag" style="margin-right:auto">Only Admins see this</span>'+
    (fork?'<button class="btn quiet" data-p-back>‹ Back</button>':'<button class="btn quiet" data-m-close>Close</button>')+'</div>');
  const refresh = ()=>{ render(); openAccessPanel(kind, id); };
  if(fork){
    m.querySelector('[data-p-exclude]').onclick = ()=>{
      EXCLUSIONS.push({kind, id});
      toast('Excluded — only teams you add can use it now.');
      refresh();
    };
    m.querySelector('[data-p-cat]').onclick = ()=>{
      closeAgentModal(); state.view='console'; state.team='company'; state.item=null; render(); window.scrollTo({top:0});
    };
    m.querySelector('[data-p-back]').onclick = ()=>openAccessPanel(kind, id);
    return;
  }
  m.querySelectorAll('[data-p-rm]').forEach(b=>b.onclick=()=>{
    const v = b.dataset.pRm;
    if(v==='everyone'){
      if(kind==='skill' && ACCESS.company.cats.includes(grp)){ openAccessPanel(kind, id, grp); return; }
      if(kind==='tool') ACCESS.company.tools = ACCESS.company.tools.filter(x=>x!==id);
      ACCESS.company.items = ACCESS.company.items.filter(i=>!(i.kind===kind&&i.id===id));
      toast('Removed from the baseline.');
      refresh(); return;
    }
    const [g, pid] = v.split(':');
    if(g==='team'){
      const a = ACCESS[pid];
      if(kind==='tool') a.tools = a.tools.filter(x=>x!==id);
      a.items = a.items.filter(i=>!(i.kind===kind&&i.id===id));
      toast('Removed for '+teamById(pid).name+'.');
    } else {
      const i = EXCEPTIONS.findIndex(x=>x.person===pid && x.kind===kind && x.id===id);
      if(i>=0) EXCEPTIONS.splice(i,1);
      toast('Removed for '+personById(pid).name+'.');
    }
    refresh();
  });
  const rb = m.querySelector('[data-p-restore]');
  if(rb) rb.onclick = ()=>{
    const i = EXCLUSIONS.findIndex(x=>x.kind===kind&&x.id===id);
    if(i>=0) EXCLUSIONS.splice(i,1);
    toast('Restored — everyone can use it again.');
    refresh();
  };
  const inp = m.querySelector('#acc-add');
  if(inp){
    const rowsEl = m.querySelector('#acc-rows');
    const draw = ()=>{
      const q = inp.value.trim().toLowerCase();
      const cand = [
        ...TEAMS.filter(t=>!w.teams.some(x=>x.id===t.id))
          .map(t=>({g:'team', id:t.id, t:t.name, d:t.members.map(m2=>personById(m2).name.split(' ')[0]).join(', '), k:'Team'})),
        ...PEOPLE.filter(p=>!w.people.some(x=>x.id===p.id) && !w.teams.some(t=>t.members.includes(p.id)))
          .map(p=>({g:'person', id:p.id, t:p.name, d:p.email, k:'Person'})),
      ].filter(c=>!q || (c.t+' '+c.d).toLowerCase().includes(q));
      rowsEl.innerHTML = cand.map(c=>'<button class="pal-row" data-pk="'+c.g+':'+c.id+'">'+
        (c.g==='team'?'<span class="slashic">'+esc(c.t[0])+'</span>':avHtml(personById(c.id)))+
        '<span class="pr-body"><span class="pr-t">'+esc(c.t)+'</span><span class="pr-d">'+esc(c.d)+'</span></span>'+
        '<span class="pr-k">'+esc(c.k)+'</span></button>').join('')
        || '<div class="pal-empty">No one left to add.</div>';
      rowsEl.querySelectorAll('[data-pk]').forEach(b=>b.onclick=()=>{
        const [g, pid] = b.dataset.pk.split(':');
        if(g==='team'){
          if(kind==='tool') ACCESS[pid].tools.push(id);
          else ACCESS[pid].items.push({kind, id});
          toast('Added — everyone on '+teamById(pid).name+' can use it now.');
        } else {
          EXCEPTIONS.push({person:pid, kind, id});
          toast('Added for '+personById(pid).name+' — an individual exception.');
        }
        refresh();
      });
    };
    inp.oninput = draw; draw();
  }
}

function peoplePreview(ids,total){
  const shown=ids.map(personById).filter(p=>p&&!p.agent).slice(0,5);
  const left=Math.max(0,total-shown.length);
  return shown.map(avHtml).join('')+(left?'<span class="more-av">+'+left+'</span>':'');
}

    '<div class="oc-root"><button class="oc-card" data-team="company">'+
      '<span class="t">Everyone at Bevel</span>'+
      '<span class="row"><span class="avs">'+peoplePreview(PEOPLE.filter(p=>!p.agent).map(p=>p.id),ORG_SIZE)+'</span>'+
      '<span class="meta">'+ORG_SIZE+' people</span></span>'+
      '<span class="chiprow"><span class="chip">'+base.skills+' skills</span><span class="chip">'+base.tools+' tools</span></span>'+
      '<span class="meta">The baseline — what every team starts from.</span>'+
    '</button><div class="oc-stem"></div></div>'+
    '<div class="oc-teams">'+TEAMS.map(teamCard).join('')+'</div>'+
    '<div class="oc-note">'+esc(admins.slice(0,-1).join(', ')+' and '+admins[admins.length-1])+
      ' are Admins — they manage access and can always see everything.</div>';
}

function grantRow(tid, kind, id){
  let icon='', title='', sub='', target='';
  if(kind==='cat'){
    title = CAT_LABEL(id)+' — category';
    sub = catSkills(id).length+' skills · includes new skills automatically';
    target=' data-grant-cat="'+id+'"';
  } else if(kind==='tool'){
    const t = toolById(id); icon = logoHtml(t); title = t.name; sub = 'Tool · '+t.purpose;
    target=' data-item="tool:'+id+'"';
  } else {
    icon = '<span class="slashic">/</span>';
    title = itemName('skill', id); sub = 'Skill · from the '+CAT_LABEL(groupOf(id))+' category';
    target=' data-item="skill:'+id+'"';
  }
  return '<div class="kv"><button class="grant-link"'+target+'>'+icon+
    '<span style="min-width:0">'+esc(title)+'<span class="sub">'+esc(sub)+'</span></span></button>'+
    '<span class="v"><button class="btn tiny quiet" data-g-rm="'+tid+'|'+kind+'|'+id+'">Remove</button></span></div>';
}

function renderTeam(tid){
  const isCo = tid==='company';
  const t = isCo ? null : teamById(tid);
  if(!isCo && !t){ state.team=null; return renderConsole(); }
  const a = ACCESS[tid];
  const base = baselineCounts();
  let shelf = '';
  if(isCo){
    shelf += '<div class="h4">Skills everyone can use</div>'+
      ((a.cats.map(c=>grantRow(tid,'cat',c)).join('')+
        a.items.filter(i=>i.kind==='skill').map(i=>grantRow(tid,'skill',i.id)).join('')) ||
       '<p style="font-size:13px;color:var(--ink2);padding:4px 0 2px">No skills in the baseline yet.</p>');
    if(EXCLUSIONS.length) shelf += '<div class="h4">Excluded from the baseline</div>'+EXCLUSIONS.map(x=>
      '<div class="kv"><button class="grant-link" data-item="'+x.kind+':'+x.id+'"><span>'+esc(itemName(x.kind,x.id))+
      '<span class="sub">Pulled out of the '+esc(CAT_LABEL(groupOf(x.id)))+' category — only teams granted it directly can use it</span></span></button>'+
      '<span class="v"><button class="btn tiny quiet" data-x-restore="'+x.kind+'|'+x.id+'">Restore</button></span></div>').join('');
    shelf += '<div class="h4">Tools everyone can use</div>'+
      (a.tools.map(x=>grantRow(tid,'tool',x)).join('') ||
       '<p style="font-size:13px;color:var(--ink2);padding:4px 0 2px">No tools in the baseline yet.</p>');
    shelf += '<div style="margin-top:16px"><button class="btn small" data-add-grants="company">+ Add to the baseline</button></div>';
  } else {
    shelf += '<div class="h4">From everyone at Bevel</div>'+
      '<div class="kv"><span class="k">The baseline<span class="sub">'+base.skills+' skills · '+base.tools+' tools — granted to everyone</span></span>'+
      '<span class="v"><button class="btn tiny quiet" data-team="company">View ›</button></span></div>';
    const rows = a.cats.map(c=>grantRow(tid,'cat',c))
      .concat(a.tools.map(x=>grantRow(tid,'tool',x)))
      .concat(a.items.map(i=>grantRow(tid, i.kind==='tool'?'tool':'skill', i.id)));
    shelf += '<div class="h4">'+esc(t.name)+' also gets</div>'+
      (rows.join('') || '<p style="font-size:13px;color:var(--ink2);padding:4px 0 2px">Nothing extra yet — this team uses the baseline.</p>');
    shelf += '<div style="margin-top:16px"><button class="btn small" data-add-grants="'+tid+'">+ Add skills or tools</button></div>';
  }
  const people = isCo ? PEOPLE.filter(p=>!p.agent) : t.members.map(personById);
  const peopleCount = isCo ? ORG_SIZE : t.headcount;
  const memRow = p => {
    const exx = EXCEPTIONS.map((x,i)=>({x,i})).filter(e=>e.x.person===p.id);
    return '<div class="mem">'+avHtml(p)+'<span class="mi">'+
      '<span class="mn">'+esc(p.name)+(p.admin?'<span class="tag">Admin</span>':'')+(p.agent?'<span class="tag">Agent account</span>':'')+'</span>'+
      '<span class="msub">'+esc(p.email)+'</span>'+
      exx.map(e=>'<span class="mx">Also has '+esc(itemName(e.x.kind,e.x.id))+' — added individually'+
        '<button class="btn tiny quiet" data-ex-rm="'+e.i+'">Remove</button></span>').join('')+
      '</span>'+
      (!isCo?'<button class="rm-x" data-mem-rm="'+tid+'|'+p.id+'" title="Remove from '+esc(t.name)+'" aria-label="Remove '+esc(p.name)+' from '+esc(t.name)+'">×</button>':'')+
    '</div>';
  };
  return '<button class="back" data-team="">‹ Teams</button>'+
    '<div class="item-grid"><article>'+
      '<div class="kicker">'+(isCo?'Admin console':'Admin console · Team')+'</div>'+
      '<div class="item-title"><h1>'+esc(isCo?'Everyone at Bevel':t.name)+'</h1></div>'+
      '<p class="lede">'+(isCo?'The baseline. Anything granted here can be used by every person on every team.'
                              :'People on this team get the baseline, plus anything granted on this page.')+'</p>'+
      shelf+
    '</article>'+
    '<aside><div class="railhead">'+(isCo?'People':'Members')+
      '<span class="railcount" style="display:inline-flex;background:var(--inset);color:var(--ink2)">'+peopleCount+'</span></div>'+
      '<div class="railhint">Showing '+people.length+' sample '+(people.length===1?'profile':'profiles')+' of '+peopleCount+'.</div>'+
      people.map(memRow).join('')+
      (!isCo?'<div style="margin-top:14px"><button class="btn small" data-add-person="'+tid+'">+ Add person</button></div>':'')+
    '</aside></div>';
}

function openGrantModal(tid, q0){
  const isCo = tid==='company';
  const target = isCo ? 'the baseline' : teamById(tid).name;
  const candidates = ()=>{
    const list = [];
    for(const c of ['gtm','org','general','eng']){
      if(ACCESS[tid].cats.includes(c)) continue;
      if(!isCo && ACCESS.company.cats.includes(c)) continue;
      list.push({g:'cat', id:c, t:CAT_LABEL(c)+' — category', d:catSkills(c).length+' skills · includes new skills automatically', k:'Category'});
    }
    for(const tl of TOOLS){
      if(teamGrants(tid,'tool',tl.id)) continue;
      if(!isCo && teamGrants('company','tool',tl.id)) continue;
      list.push({g:'tool', id:tl.id, t:tl.name, d:tl.purpose, k:'Tool', logo:tl});
    }
    for(const s of [...SKILLS, ...ENG_SKILLS]){
      if(teamGrants(tid,'skill',s.id)) continue;
      if(!isCo && teamGrants('company','skill',s.id)) continue;
      list.push({g:'skill', id:s.id, t:s.name, d:'Skill · from the '+CAT_LABEL(groupOf(s.id))+' category', k:'Skill'});
    }
    return list;
  };
  const m = openModal('<h3>Add to '+esc(target)+'</h3>'+
    '<p>Granting a category covers every skill in it, including new ones.</p>'+
    '<input class="addin" id="g-add" type="text" placeholder="Search skills, tools, and categories" autocomplete="off">'+
    '<div class="mrows" id="g-rows"></div>'+
    '<div class="mfoot"><button class="btn quiet" data-m-close>Done</button></div>');
  const inp = m.querySelector('#g-add'), rowsEl = m.querySelector('#g-rows');
  const draw = ()=>{
    const q = inp.value.trim().toLowerCase();
    const cand = candidates().filter(c=>!q || (c.t+' '+c.d).toLowerCase().includes(q));
    rowsEl.innerHTML = cand.map(c=>'<button class="pal-row" data-gk="'+c.g+':'+c.id+'">'+
      (c.logo?logoHtml(c.logo):'<span class="slashic">'+(c.g==='cat'?'▤':'/')+'</span>')+
      '<span class="pr-body"><span class="pr-t">'+esc(c.t)+'</span><span class="pr-d">'+esc(c.d)+'</span></span>'+
      '<span class="pr-k">'+esc(c.k)+'</span></button>').join('')
      || '<div class="pal-empty">Nothing left to add — '+esc(target)+' already covers it all.</div>';
    rowsEl.querySelectorAll('[data-gk]').forEach(b=>b.onclick=()=>{
      const [g, id] = b.dataset.gk.split(':');
      if(g==='cat') ACCESS[tid].cats.push(id);
      else if(g==='tool') ACCESS[tid].tools.push(id);
      else ACCESS[tid].items.push({kind:'skill', id});
      toast('Added to '+target+'.');
      render();
      openGrantModal(tid, inp.value);
    });
  };
  if(q0) inp.value = q0;
  inp.oninput = draw; draw();
  setTimeout(()=>inp.focus(), 40);
}

function openPersonModal(tid){
  const t = teamById(tid);
  const left = PEOPLE.filter(p=>!t.members.includes(p.id));
  const m = openModal('<h3>Add a person to '+esc(t.name)+'</h3>'+
    '<p>They get everything this team can use.</p>'+
    '<div class="mrows" style="margin-top:12px">'+
    (left.map(p=>'<button class="pal-row" data-pp="'+p.id+'">'+avHtml(p)+
      '<span class="pr-body"><span class="pr-t">'+esc(p.name)+'</span><span class="pr-d">'+esc(p.email)+'</span></span>'+
      (p.admin?'<span class="pr-k">Admin</span>':(p.agent?'<span class="pr-k">Agent account</span>':''))+
      '</button>').join('') || '<div class="pal-empty">Everyone is already on this team.</div>')+
    '</div><div class="mfoot"><button class="btn quiet" data-m-close>Close</button></div>');
  m.querySelectorAll('[data-pp]').forEach(b=>b.onclick=()=>{
    t.members.push(b.dataset.pp);
    t.headcount++;
    toast(personById(b.dataset.pp).name+' added to '+t.name+'.');
    closeAgentModal();
    render();
  });
}

/* =========================================================
   Render + wiring
   ========================================================= */
function wire(root){
  root.querySelectorAll('[data-share]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const [kind,id]=b.dataset.share.split(':');
    openSharePanel(kind,id);
  });
  root.querySelectorAll('[data-ftab]').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); state.tabFile=b.dataset.ftab; state.draft=null; state.editSug=null; render();
  });
  root.querySelectorAll('[data-item]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    state.item=b.dataset.item; state.draft=null; state.tabFile='main';
    const [k,id]=state.item.split(':');
    state.team=null;
    if(k==='tool') state.view='tools'; else { state.view='skills'; const s=skillById(id); if(state.cat!=='all'&&!(state.cat==='owned'&&ownsSkill(s))&&s&&s.group!==state.cat) state.cat=s.group; }
    render(); window.scrollTo({top:0});
  });
  root.querySelectorAll('[data-grant-cat]').forEach(b=>b.onclick=()=>{
    state.view='skills'; state.cat=b.dataset.grantCat; state.item=null; state.team=null; state.draft=null;
    render(); window.scrollTo({top:0});
  });
  root.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{ state.item=null; state.draft=null; render(); });
  root.querySelectorAll('[data-connect]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const t=toolById(b.dataset.connect);
    state.connected[t.id]=true;
    render();
    toast(t.vars.some(v=>v.oauth)?'Signed in to '+t.name+'.':'Key added for '+t.name+'.');
  });
  root.querySelectorAll('[data-copy]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const v=b.dataset.copy;
    (navigator.clipboard?.writeText(v)||Promise.reject()).then(()=>{
      if(b._t) clearTimeout(b._t);
      if(!b.dataset.orig) b.dataset.orig=b.innerHTML;
      b.innerHTML='✓ Copied';
      b._t=setTimeout(()=>{ b.innerHTML=b.dataset.orig; },1400);
    }).catch(()=>toast(v));
  });
  root.querySelectorAll('[data-copyskill]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const v=b.dataset.copyskill;
    (navigator.clipboard?.writeText(v)||Promise.reject()).then(()=>{
      if(b._t) clearTimeout(b._t);
      b.innerHTML='<span class="ck">✓</span>';
      b._t=setTimeout(()=>{ b.innerHTML=COPY_SVG; },1200);
    }).catch(()=>toast(v));
  });
  /* admin surfaces */
  root.querySelectorAll('[data-acc]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const [k,id]=(state.item||'').split(':');
    if(k) openAccessPanel(k,id);
  });
  root.querySelectorAll('[data-team]').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); closeAgentModal();
    state.view='console'; state.team=b.dataset.team||null; state.item=null; state.draft=null;
    render(); window.scrollTo({top:0});
  });
  root.querySelectorAll('[data-exit-console]').forEach(b=>b.onclick=()=>{
    state.view='skills'; state.team=null; render();
  });
  root.querySelectorAll('[data-add-grants]').forEach(b=>b.onclick=()=>openGrantModal(b.dataset.addGrants));
  root.querySelectorAll('[data-add-person]').forEach(b=>b.onclick=()=>openPersonModal(b.dataset.addPerson));
  root.querySelectorAll('[data-g-rm]').forEach(b=>b.onclick=()=>{
    const [tid,kind,id]=b.dataset.gRm.split('|');
    const a=ACCESS[tid];
    if(kind==='cat') a.cats=a.cats.filter(x=>x!==id);
    else if(kind==='tool') a.tools=a.tools.filter(x=>x!==id);
    else a.items=a.items.filter(i=>!(i.kind==='skill'&&i.id===id));
    toast('Removed.');
    render();
  });
  root.querySelectorAll('[data-x-restore]').forEach(b=>b.onclick=()=>{
    const [kind,id]=b.dataset.xRestore.split('|');
    const i=EXCLUSIONS.findIndex(x=>x.kind===kind&&x.id===id);
    if(i>=0) EXCLUSIONS.splice(i,1);
    toast('Restored to the baseline.');
    render();
  });
  root.querySelectorAll('[data-mem-rm]').forEach(b=>b.onclick=()=>{
    const [tid,pid]=b.dataset.memRm.split('|');
    const t=teamById(tid);
    t.members=t.members.filter(x=>x!==pid);
    t.headcount=Math.max(0,t.headcount-1);
    toast(personById(pid).name+' removed from '+t.name+' — they keep the baseline.');
    render();
  });
  root.querySelectorAll('[data-ex-rm]').forEach(b=>b.onclick=()=>{
    EXCEPTIONS.splice(+b.dataset.exRm,1);
    toast('Individual access removed.');
    render();
  });
}

function render(){
  if(state.view==='console' && !currentUser().admin){ state.view='skills'; state.team=null; }
  renderSide();
  const main = $('#main');
  if(state.view==='console'){
    main.innerHTML = state.team ? renderTeam(state.team) : renderConsole();
    wire(main);
  } else if(state.item){
    const [kind,id] = state.item.split(':');
    main.innerHTML = kind==='skill' ? renderSkillItem(skillById(id)) : renderToolItem(toolById(id));
    wire(main);
    renderRail();
  } else {
    main.innerHTML = renderShelf();
    wire(main);
    wireSearch();
  }
}

document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    if(state.pal && state.pal.open) closeSdrop();
    else if($('#mwrap').classList.contains('on')) closeAgentModal();
    else if(state.menu){ state.menu=false; renderMenu(); }
    else if(state.editSug){ state.editSug=null; renderRail(); }
    else if(state.draft){ state.draft=null; renderRail(); }
    else if(state.item){ state.item=null; render(); }
    else if(state.view==='console'){ if(state.team) state.team=null; else state.view='skills'; render(); }
  }
  if(e.key==='/'){
    const el=document.activeElement;
    if(el && (el.tagName==='INPUT'||el.tagName==='TEXTAREA')) return;
    e.preventDefault();
    slashSearch();
  }
});
document.addEventListener('mousedown', e=>{
  if(state.pal && state.pal.open && !e.target.closest('.search-wrap')) closeSdrop();
});
document.addEventListener('click', e=>{
  if(state.menu && !e.target.closest('#pmenu') && !e.target.closest('#me')){ state.menu=false; renderMenu(); }
});
$('#side-open').onclick = ()=>{ state.collapsed=!state.collapsed; applyCollapse(); };
window.addEventListener('resize', ()=>requestAnimationFrame(anchorRail));

/* boot from hash for demos/QA: #item=skill:heyreach-campaign&view=tools&theme=light */
try{
  const hp = new URLSearchParams(location.hash.slice(1));
  if(hp.get('user') && PEOPLE.some(p=>p.id===hp.get('user'))) state.user = hp.get('user');
  if(hp.get('view')) state.view = hp.get('view');
  if(hp.get('cat')) state.cat = hp.get('cat');
  if(hp.get('item')) state.item = hp.get('item');
  if(hp.get('tab')) state.tabFile = hp.get('tab');
  if(hp.get('team')) state.team = hp.get('team');
  if(hp.get('theme')) document.documentElement.dataset.theme = hp.get('theme');
}catch(e){}

render();
applyCollapse();
try{
  const hp2 = new URLSearchParams(location.hash.slice(1));
  if(hp2.get('menu')){ state.menu=true; renderMenu(); }
  if(hp2.get('pal')){ state.pal={open:true,q:'',sel:0}; renderSdrop(); }
  if(hp2.get('acc') && state.item){
    const [k,id] = state.item.split(':');
    openAccessPanel(k, id, hp2.get('acc')==='fork' ? groupOf(id) : undefined);
  }
  if(hp2.get('share') && state.item){
    const [k,id] = state.item.split(':');
    openSharePanel(k,id);
  }
  if(hp2.get('review')) setTimeout(()=>$('#rail .rail-card')?.scrollIntoView({block:'center'}),120);
  if(hp2.get('grants')) openGrantModal(hp2.get('grants'));
}catch(e){}
</script>
