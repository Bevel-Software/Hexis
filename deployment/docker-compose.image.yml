# Run the image published on GHCR instead of building the monorepo from
# source. This is the overlay most self-hosted deployments want: no Node
# toolchain, no multi-minute build, and a smaller server suffices — the build
# is exactly what needed the memory.
#
# Usage, from the repository root:
#
#   docker compose -f docker-compose.yml -f deployment/docker-compose.image.yml up -d
#
# Composes with the HTTPS overlay — pass both:
#
#   DOMAIN=bevel.your-domain.com docker compose \
#     -f docker-compose.yml \
#     -f deployment/docker-compose.image.yml \
#     -f deployment/docker-compose.https.yml up -d
#
# Pin the version in .env (`HEXIS_VERSION=0.9.1`) to make upgrades a
# deliberate act: bump the value, `docker compose ... pull app`, `up -d`.
# Left unset it tracks `latest` — the newest release, which is what you want
# on a first install and a footgun after (an unplanned `pull` is an
# unplanned upgrade).

services:
  app:
    image: ghcr.io/bevel-software/hexis:${HEXIS_VERSION:-latest}
    # Prefer the registry over the base file's `build:` (an overlay can add
    # keys but never remove one). `missing` pulls when the tag is not present
    # locally and otherwise touches nothing — so `up -d` stays fast, and
    # moving to a new version is the explicit `pull` above.
    pull_policy: missing
