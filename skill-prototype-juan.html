<title>Bevel — Your setup</title>
<style>
  /* ————— tokens — light-first, warm ink, one interactive blue ————— */
  :root{
    --bg:#FFFFFF; --side:#F7F6F4; --card:#FFFFFF; --card2:#FAFAF8; --inset:#F4F3F0;
    --ink:#37352F; --ink2:#73706A; --ink3:#A3A099;
    --line:rgba(55,53,47,.11); --line2:rgba(55,53,47,.19);
    --hover:rgba(55,53,47,.05);
    --accent:#2383E2; --accent-hover:#1B74CB;
    --ok:#337B58; --wait:#C79100; --waitb:#F2C100; --del:#B3261E;
    --ok-soft:#EBF5EE; --wait-soft:#FEF8DC; --del-soft:#FDEDEB;
    --wdel:rgba(179,38,30,.17); --wins:rgba(51,123,88,.19);

    --shadow:0 18px 55px rgba(55,53,47,.16);
    --card-shadow:0 1px 2px rgba(55,53,47,.05);
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  }
  :root[data-theme="dark"]{
    --bg:#191918; --side:#1F1F1E; --card:#232322; --card2:#2B2B2A; --inset:#1D1D1C;
    --ink:#EDEDEA; --ink2:#A5A5A0; --ink3:#71716C;
    --line:rgba(255,255,255,.13); --line2:rgba(255,255,255,.21);
    --hover:rgba(255,255,255,.05);
    --accent:#4E9FE0; --accent-hover:#5FACEA;
    --ok:#7FBE95; --wait:#F0CC4E; --waitb:#F0CC4E; --del:#E8908A;
    --ok-soft:rgba(127,190,149,.13); --wait-soft:rgba(240,204,78,.13); --del-soft:rgba(232,144,138,.13);
    --wdel:rgba(232,144,138,.28); --wins:rgba(127,190,149,.28);

    --shadow:0 30px 90px rgba(0,0,0,.5);
    --card-shadow:none;
  }
  :root[data-theme="light"]{
    --bg:#FFFFFF; --side:#F7F6F4; --card:#FFFFFF; --card2:#FAFAF8; --inset:#F4F3F0;
    --ink:#37352F; --ink2:#73706A; --ink3:#A3A099;
    --line:rgba(55,53,47,.11); --line2:rgba(55,53,47,.19);
    --hover:rgba(55,53,47,.05);
    --accent:#2383E2; --accent-hover:#1B74CB;
    --ok:#337B58; --wait:#C79100; --waitb:#F2C100; --del:#B3261E;
    --ok-soft:#EBF5EE; --wait-soft:#FEF8DC; --del-soft:#FDEDEB;
    --wdel:rgba(179,38,30,.17); --wins:rgba(51,123,88,.19);

    --shadow:0 18px 55px rgba(55,53,47,.16);
    --card-shadow:0 1px 2px rgba(55,53,47,.05);
  }

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{height:100%}
  body{min-height:100%;font-family:var(--sans);font-size:14px;line-height:1.5;color:var(--ink);background:var(--bg);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
  input,textarea{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--ink2);outline-offset:2px;border-radius:6px}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

  /* ————— the top bar — the app's chrome, above both surfaces —————
     It carries what belongs to the APP rather than to a page: the nav
     toggle, which app you are in, which branch you stand on, and you.
     The sidebar's old brand block is gone with it — one identity, one
     place, not a wordmark in two corners. */
  .topbar{position:sticky;top:0;z-index:60;height:48px;flex:0 0 auto;display:flex;align-items:center;
    gap:8px;padding:0 12px;background:var(--bg);border-bottom:1px solid var(--line)}
  .tbicon{width:28px;height:28px;border-radius:7px;color:var(--ink3);flex:0 0 auto;
    display:inline-flex;align-items:center;justify-content:center;transition:background .14s ease,color .14s ease}
  .tbicon:hover{background:var(--hover);color:var(--ink)}
  .tbicon.on{color:var(--ink)}
  .tbbrand{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:8px;
    transition:background .14s ease}
  .tbbrand:hover,.tbbrand[aria-expanded="true"]{background:var(--hover)}
  .tbbrand .bw{font-size:13.5px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
  .tbbrand .bchev{color:var(--ink3);display:inline-flex;transition:transform .16s ease}
  .tbbrand[aria-expanded="true"] .bchev{transform:rotate(180deg)}
  .tbsep{width:1px;height:18px;background:var(--line);flex:0 0 auto;margin:0 2px}
  .tbspacer{flex:1}
  /* ————— the one thing a new account still has to do —————
     A skills catalogue does nothing until an agent is connected to it, so on
     a fresh account this is not a suggestion, it is the next step. It sits in
     the top bar rather than on a page because it is true on every page, and
     it goes away the moment it stops being true.

     Quiet, not loud: a tinted pill with a dot, no siren. It is the only
     accent-coloured thing in the chrome, which is enough when nothing else
     competes for the colour. */
  /* A CTA wearing a nav row's geometry. The tint is deliberate: this is the
     one thing a new account must DO, so it gets the sidebar's only filled
     accent — but at exactly a row's height, padding and radius, so it reads
     as the first item with a highlight rather than a banner parked on the
     list. The moment an agent connects, the sidebar has no blue in it at all.

     Every property the row needs is declared here, because these buttons sit
     inside `.nav` and inherit `.nav button`'s space-between/padding/colour
     otherwise. (`.lbl` is likewise taken — it is the SUBSCRIPTIONS heading
     style — which is how "Connect your agent" once rendered as an uppercase
     section label clipped to "CONNECT YOUR AGI".) */
  .navnudge{display:flex;align-items:center;margin-bottom:6px;border-radius:99px;
    background:rgba(35,131,226,.08);transition:background .14s ease;
    animation:ctapulse 2.6s ease-out infinite}
  .navnudge:hover{background:rgba(35,131,226,.14)}
  /* selected = you are on the welcome page: held at the hover depth, ring and
     dot still — a CTA stops calling once you have answered it. The CONTAINER
     is the whole selected state; no weight change (600 pushed the label into
     ellipsis at the default sidebar width). */
  .navnudge.on{background:rgba(35,131,226,.14);animation:none}
  .navnudge.on .dot{animation:none}
  .navnudge .go{display:flex;align-items:center;justify-content:flex-start;gap:8px;flex:1;min-width:0;
    padding:6px 12px;border-radius:99px;font-size:13px;font-weight:500;color:var(--accent);text-align:left}
  /* `.nav button:hover` AND `.nav button[aria-current="true"]` both paint the
     app's warm grey + ink onto this button — over the blue tint that reads as
     mud, twice over. The container owns every state; the inner button paints
     nothing and stays accent in all of them. */
  .navnudge .go:hover{background:transparent}
  .navnudge .go[aria-current="true"]{background:transparent;color:var(--accent);font-weight:500}
  .navnudge .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .navnudge .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:0 0 auto;
    animation:nudgepulse 2.4s ease-in-out infinite}
  @keyframes nudgepulse{0%,100%{opacity:1}50%{opacity:.35}}
  /* The CTA breathes: a soft accent ring that swells and fades. Box-shadow,
     not scale — the text must hold still while the pill calls. */
  @keyframes ctapulse{0%{box-shadow:0 0 0 0 rgba(35,131,226,.30)}
    70%{box-shadow:0 0 0 7px rgba(35,131,226,0)}100%{box-shadow:0 0 0 0 rgba(35,131,226,0)}}
  /* Dismiss is its OWN button, never the row — clicking "connect" must not be
     able to mean "never show me this again". Grey at rest (only the
     invitation gets the accent), and its hover tint is blue like the pill's:
     the app's warm grey over this blue reads as mud. */
  .navnudge .x{flex:0 0 18px;width:18px;height:18px;padding:0;margin:0 5px 0 2px;border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;color:var(--ink3);opacity:0;
    transition:opacity .14s ease,background .14s ease,color .14s ease}
  .navnudge:hover .x,.navnudge .x:focus-visible{opacity:1}
  .navnudge .x:hover{background:rgba(35,131,226,.18);color:var(--ink)}
  .navnudge .go:focus-visible,.navnudge .x:focus-visible{outline:2px solid var(--accent);outline-offset:1px;opacity:1}

  /* ————— the welcome page — the first thing a new account sees —————
     One column, three beats: who you are, what this is, the one thing to do.
     It fades up once; the CTA carries the same breathing ring as the sidebar
     pill, so the page and the reminder are recognisably one campaign. */
  .welcome{max-width:440px;margin:11vh auto 0}
  .welcome.enter{animation:wfade .7s cubic-bezier(.2,.8,.2,1) both}
  .welcome h1{font-size:27px;font-weight:700;letter-spacing:-.022em}
  .welcome .wlede{margin:12px 0 0;font-size:14px;color:var(--ink2);line-height:1.65}
  .welcome .wlabel{margin:36px 0 0;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink3);font-weight:600}
  .welcome .seg{margin-top:10px}
  .wfoot{display:flex;align-items:center;gap:16px;margin-top:20px}
  .wcta{animation:ctapulse 2.4s ease-out infinite}
  .wskip{font-size:12.5px;color:var(--ink3);transition:color .14s ease}
  .wskip:hover{color:var(--ink)}
  @keyframes wfade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .navnudge,.navnudge .dot,.wcta{animation:none}
    .welcome.enter{animation:none}
  }
  /* the branch you stand on — chrome, so it lives in the chrome */
  .tbbranch{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:8px;
    font-size:12px;color:var(--ink2);transition:background .14s ease}
  .tbbranch:hover{background:var(--hover);color:var(--ink)}
  .tbbranch .bname{font-family:var(--mono);font-size:11.5px;color:var(--ink);letter-spacing:-.01em}
  .tbbranch .bdirty{font-size:10px;color:var(--wait);background:var(--wait-soft);border-radius:9px;
    padding:1px 6px;font-weight:700}

  /* ————— app frame — the sidebar is the app's spine ————— */
  .shell{display:flex;flex-direction:column;min-height:100dvh}
  .app{display:flex;flex:1;min-height:0}
  .side{width:212px;flex:0 0 auto;position:sticky;top:48px;height:calc(100dvh - 48px);overflow:hidden;
    border-right:1px solid var(--line);background:var(--side);
    transition:width .24s cubic-bezier(.2,.8,.2,1)}
  /* while dragging, width follows the cursor — an easing curve would lag it */
  .app.sizing .side{transition:none}
  .app.sizing{cursor:col-resize;user-select:none}
  /* the drag handle straddles the border without occupying layout: its own
     width is cancelled by the negative margins, so nothing shifts when the
     sidebar is collapsed and the handle goes away */
  .resizer{width:7px;margin:0 -3.5px;flex:0 0 auto;position:relative;z-index:30;cursor:col-resize;
    background:transparent;transition:background .16s ease}
  .resizer::after{content:'';position:absolute;left:3px;top:0;bottom:0;width:1px;background:transparent;
    transition:background .16s ease}
  .resizer:hover::after,.resizer.on::after{background:var(--accent)}
  .app.collapsed .resizer{display:none}
  .app.collapsed .side{width:0;border-right-color:transparent}
  /* the floating re-open button retired with the top bar: the toggle up there
     never moves, so there is nothing to reopen from a second place */
  #side-open{display:none!important}
  .side-inner{width:212px;height:100%;display:flex;flex-direction:column;padding:16px 14px 18px}
  .brand{display:flex;align-items:center;gap:9px;padding:0 10px 22px}
  .brand .tile{width:22px;height:22px;border-radius:6px;background:var(--ink);color:var(--bg);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
  .brand .bn{font-size:14px;font-weight:600;letter-spacing:-.01em}
  .brand .bs{font-size:10.5px;color:var(--ink3);margin-top:1px}
  .nav{display:flex;flex-direction:column;gap:1px}
  .nav .lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600;
    padding:16px 10px 7px;display:flex;align-items:center}
  .lbladd{margin-left:auto;width:18px;height:18px;border-radius:5px;font-size:14px;line-height:16px;
    text-align:center;color:var(--ink3);opacity:0;transition:opacity .14s ease,background .14s ease}
  .nav:hover .lbladd{opacity:1}
  .lbladd:hover{background:var(--hover);color:var(--ink)}
  .nav .navgap{height:14px}
  .nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;border-radius:7px;
    font-size:13px;color:var(--ink2);transition:background .12s ease}
  .nav button:hover{background:var(--hover);color:var(--ink)}
  .nav button[aria-current="true"]{color:var(--ink);font-weight:600;background:var(--hover)}
  /* counts, badges and locks all sit in the same box, so the column lines up */
  .nav .n,.nav .pending{flex:0 0 22px;height:18px;line-height:18px;text-align:center;
    font-variant-numeric:tabular-nums;font-weight:400;font-size:11.5px;color:var(--ink3);border-radius:9px}
  .nav .pending{font-size:10px;color:var(--wait);background:var(--wait-soft);font-weight:700}
  .nav .n svg{vertical-align:-1px}
  .nav .otag,.srow .otag{font-size:9.5px;font-weight:600;letter-spacing:.04em;color:var(--ink3);border:1px solid var(--line2);
    border-radius:99px;padding:0 6px;margin-left:5px;vertical-align:1px}
  .side .cap{font-size:11px;color:var(--ink3);padding:14px 10px 0;line-height:1.5}
  .side .spacer{flex:1}
  .main{flex:1;min-width:0}
  /* ONE measure for the whole app. Knowledge and Skills are two views of the
     same product, so a page should not visibly change width when you switch
     between them — with the sidebar away the difference showed up as a fatter
     gutter on one surface than the other. `wide` is the opt-out, for the
     handful of pages that put a second column beside the article. */
  .wrap{max-width:880px;margin:0 auto;padding:34px 40px 110px}
  .wrap.wide{max-width:980px}

  h1{font-size:26px;font-weight:600;letter-spacing:-.018em;line-height:1.15;text-wrap:balance}
  .lede{font-size:14.5px;color:var(--ink2);line-height:1.55;max-width:62ch;margin-top:9px}
  .h4{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:600;
    margin:34px 0 10px;display:flex;align-items:center;gap:9px}
  .h4 .n{font-variant-numeric:tabular-nums;letter-spacing:0}
  .h4 .cap{font-weight:400;letter-spacing:0;text-transform:none;font-size:11.5px;color:var(--ink3)}
  /* On a band of cards the count and the controls are detail, not headline —
     you can see how many there are, and you only reach for the filter when you
     want it. They fade in on hover, held in the layout by opacity rather than
     display so nothing shifts under the cursor as the row lights up.
     Two exceptions stay lit: a filter you have switched ON (a filter you
     cannot see is a page lying about what it is showing), and "Last updated
     just now", which is the answer to the button you just pressed. */
  .h4.quiet .cap,.h4.quiet .filt{opacity:0;transition:opacity .14s ease}
  .h4.quiet:hover .cap,.h4.quiet:hover .filt,
  .h4.quiet:focus-within .cap,.h4.quiet:focus-within .filt,
  .h4.quiet .filt.on,.h4.quiet .filt.spin{opacity:1}
  /* show only what needs you — appears only when something does */
  .ctxmenu{position:fixed;z-index:75;min-width:200px;background:var(--card);border:1px solid var(--line);
    border-radius:11px;box-shadow:var(--shadow);padding:5px;
    animation:cmenu-in .14s cubic-bezier(.2,.9,.3,1);transform-origin:top left}
  .ctxmenu button{display:block;width:100%;padding:8px 10px;border-radius:7px;font-size:13px;color:var(--ink2);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ctxmenu button:hover{background:var(--hover);color:var(--ink)}
  .ctxmenu button.del{color:var(--del)}
  .ctxmenu button.del:hover{background:var(--del-soft)}
  /* the second head leans away on hover — the icon says "another person" before
     the word does. Lives on `.actbtn` now: Share is the same bounded control on
     a group page and a Knowledge page, so it is the same button. */
  .pico .p2{transform-box:fill-box;transform-origin:center;
    transition:transform .26s cubic-bezier(.34,1.5,.5,1),opacity .2s ease}
  .actbtn:hover .pico .p2{transform:translate(1.6px,-1.4px) scale(1.08)}
  .actbtn:hover .pico{transform:translateX(-.5px)}
  .pico{transition:transform .26s ease}
  /* the share sheet */
  .sharerow{display:flex;gap:8px;margin-top:14px}
  .grouprow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:11px;font-size:12px;color:var(--ink3)}
  .grouprow .pill{cursor:pointer}
  .grouprow .pill:hover{background:var(--hover)}
  .filt{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;
    color:var(--ink3);flex:0 0 22px}
  .filt:hover{background:var(--hover);color:var(--ink)}
  .filt.on{background:var(--wait-soft);color:var(--wait)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .filt.spin svg{animation:spin .7s linear}
  .lastup{font-size:11px;letter-spacing:0;text-transform:none;font-weight:400;color:var(--ink3)}
  .kicker{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin-bottom:8px}
  .empty{font-size:13.5px;color:var(--ink3);padding:4px 0 6px}

  /* two menus */
  .subnav{display:flex;gap:2px;margin:28px 0 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .subnav button{display:inline-flex;align-items:center;gap:8px;padding:8px 13px 11px;font-size:13.5px;
    color:var(--ink2);border-radius:8px 8px 0 0;transition:background .14s ease,color .14s ease}
  .subnav button:hover{background:var(--hover);color:var(--ink)}
  .subnav button[aria-current="true"]{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--ink)}
  .subnav .n{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
  .subnav .n.wait{background:var(--wait-soft);color:var(--wait);font-weight:700;border-radius:9px;padding:1px 7px}

  /* tiles */
  /* 236, not 248: collapsing the sidebar swaps 40px of page padding for 64px,
     and against the app's shared measure that was just enough to drop the grid
     from three cards to two — you hide the sidebar to see MORE, so a row that
     gets shorter for it is the wrong answer. Three across in both states. */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px 12px;
    display:flex;flex-direction:column;gap:6px;min-height:114px;box-shadow:var(--card-shadow);cursor:pointer;
    position:relative;text-align:left;width:100%;
    transition:border-color .15s ease,background .15s ease,transform .1s ease}
  .card:hover{border-color:var(--line2);background:var(--card2)}
  .card:active{transform:scale(.995)}
  .card .t{font-size:14.5px;font-weight:600;letter-spacing:-.008em;display:flex;align-items:center;gap:9px;
    padding-right:26px}
  .card .d{font-size:12.5px;color:var(--ink2);line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .foot{margin-top:auto;display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink3);padding-top:8px}
  .card .foot .ver{margin-left:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:-.02em}
  .card .foot .r-wait{color:var(--wait);font-weight:600}
  .card .foot .r-ok{color:var(--ok)}
  .rdot{width:6px;height:6px;border-radius:50%;flex:0 0 6px}
  .rdot.wait{background:var(--waitb)} .rdot.ok{background:var(--ok)} .rdot.none{background:var(--ink3);opacity:.5}
  .card.pend{background:var(--wait-soft);border-color:transparent}
  .card.pend .d{color:var(--ink2)}
  .needs{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:14px 0 4px;font-size:12.5px;color:var(--ink3)}
  /* who owns a skill — a property under the title, not a control panel */
  .subprop{display:flex;align-items:center;gap:5px;margin-top:12px;font-size:12.5px;color:var(--ink3)}
  .subprop .av{width:20px;height:20px;font-size:8.5px}
  .subprop > span:last-child,.subprop > button{margin-left:3px}
  .subprop > button{color:inherit;font-size:inherit;border-radius:5px}
  .subprop > button:hover{color:var(--ink);text-decoration:underline}

  /* notifications strip — same quiet rows as the inventory prototype */
  .strip{display:flex;flex-direction:column;margin-top:12px}
  .strip-row{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:9px;font-size:13px;color:var(--ink2);
    transition:background .14s ease;width:100%}
  .strip-row:hover{background:var(--hover);color:var(--ink)}
  .sdot{width:6px;height:6px;border-radius:50%;flex:0 0 6px}
  .sdot.wait{background:var(--waitb)} .sdot.ok{background:var(--ok)} .sdot.none{background:var(--ink3);opacity:.5}
  .strip-row .go{margin-left:auto;font-size:12px;color:var(--ink3);white-space:nowrap}

  /* rows */
  .row{display:flex;align-items:center;gap:13px;width:100%;padding:12px 14px;border:1px solid var(--line);
    border-radius:12px;background:var(--card);margin-bottom:8px;box-shadow:var(--card-shadow);
    transition:border-color .15s ease,background .15s ease}
  button.row{cursor:pointer}
  button.row:hover{border-color:var(--line2);background:var(--card2)}
  .row .body{min-width:0;flex:1}
  .row .t{font-size:14px;font-weight:600;letter-spacing:-.006em;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .row .d{font-size:12.5px;color:var(--ink2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .side{flex:0 0 auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink3)}
  .row .go{font-size:12px;color:var(--ink3);white-space:nowrap}

  .av{width:26px;height:26px;border-radius:50%;background:var(--inset);border:1px solid var(--line);
    display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;
    color:var(--ink2);flex:0 0 auto}
  .avs{display:flex;gap:4px;flex-wrap:wrap}

  .pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:20px;font-size:11.5px;
    font-weight:500;background:var(--inset);color:var(--ink2);white-space:nowrap}
  .pill.wait{background:var(--wait-soft);color:var(--wait);font-weight:600}
  .pill.ok{background:var(--ok-soft);color:var(--ok)}
  .pill.ver{font-family:var(--mono);font-size:11px;letter-spacing:-.02em}
  .pill.team{border:1px solid var(--line);background:transparent}
  .chiprow{display:flex;flex-wrap:wrap;gap:7px}

  .btn{display:inline-flex;align-items:center;gap:7px;padding:7px 15px;border-radius:99px;font-size:13px;font-weight:500;
    border:1px solid var(--line2);background:transparent;transition:background .15s ease;white-space:nowrap}
  .btn:hover{background:var(--hover)}
  .btn.primary{background:var(--accent);color:#fff;border-color:transparent}
  .btn.primary:hover{background:var(--accent-hover)}
  .btn.quiet{border-color:transparent;color:var(--ink2);padding:7px 9px}
  .btn.quiet:hover{color:var(--ink);background:var(--hover)}
  .btn.small{padding:4px 12px;font-size:12.5px}
  .btn.tiny{padding:3px 10px;font-size:11.5px}
  .btn.danger{color:var(--del);border-color:var(--line2)}
  .btn.danger:hover{background:var(--del-soft)}

  .logo{width:26px;height:26px;border-radius:7px;background:var(--inset);border:1px solid var(--line);
    display:inline-flex;align-items:center;justify-content:center;flex:0 0 26px}
  .logo svg{width:15px;height:15px;display:block}
  .logo .mg{font-size:11.5px;font-weight:700}
  .logo.lg{width:40px;height:40px;border-radius:10px;flex-basis:40px}
  .logo.lg svg{width:22px;height:22px}
  .logo.lg .mg{font-size:16px}
  .logo .ic-ink{color:var(--ink)}

  /* ————— item pages ————— */
  .back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);padding:6px 10px;
    border-radius:8px;margin:0 0 18px -10px}
  .back:hover{background:var(--hover);color:var(--ink)}
  /* the page's top row — back on the left, ⋯ on the right; sticky so the
     ⋯ submenu stays put when the page scrolls to a change */
  .toprow{position:sticky;top:0;z-index:46;background:var(--bg);display:flex;align-items:center;gap:10px;
    padding:8px 0;margin:-8px 0 12px}
  .toprow .back{margin-bottom:0}
  /* the trail — every page says where it sits, so the sidebar is optional */
  .crumbs{margin-left:-8px;display:flex;align-items:center;gap:2px;flex-wrap:wrap;font-size:13px;min-width:0}
  .crumbs button{padding:5px 8px;border-radius:7px;color:var(--ink3);white-space:nowrap}
  .crumbs button:hover{background:var(--hover);color:var(--ink)}
  .crumbs .here{padding:5px 8px;color:var(--ink);font-weight:500;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:38ch}
  .crumbs .sep{color:var(--ink3);opacity:.6;font-size:12px}
  .crumbs .cwrap{position:relative;display:inline-flex;align-items:center;min-width:0}
  .crumbs .cwrap>button:first-child{transition:padding-right .16s cubic-bezier(.2,.9,.3,1)}
  .crumbs .cwrap.arrowed:hover>button:first-child,.crumbs .cwrap.arrowed:focus-within>button:first-child,
  .crumbs .cwrap.arrowed.open>button:first-child{padding-right:24px}
  /* .crumbs button sets padding and colour — this needs to outrank it, or the
     chevron gets shrunk to a few pixels inside its own box */
  .crumbs .carrow{position:absolute;right:2px;top:50%;margin-top:-9px;width:18px;height:18px;border-radius:5px;
    padding:0;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);opacity:0;
    transform:translateY(-2px);transition:opacity .14s ease,transform .14s ease,background .14s ease}
  .crumbs .carrow svg{flex:0 0 auto}
  .crumbs .cwrap:hover .carrow,.crumbs .cwrap:focus-within .carrow,.crumbs .cwrap.open .carrow{opacity:1;transform:none}
  .crumbs .carrow:hover{background:var(--line);color:var(--ink)}
  .carrow svg{display:block}
  .crumbs button.here{max-width:38ch;font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .crumbs button.here:hover,.crumbs button.here[aria-expanded="true"]{background:var(--hover)}
  @keyframes cmenu-in{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}
  .crumbs button.step{color:var(--ink3)}
  .crumbs button.step:hover,.crumbs button.step[aria-expanded="true"]{background:var(--hover);color:var(--ink)}
  .cmenu{transform-origin:top left;animation:cmenu-in .17s cubic-bezier(.2,.9,.3,1);position:absolute;top:31px;left:0;min-width:224px;max-width:300px;max-height:min(64vh,420px);overflow-y:auto;
    background:var(--card);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);padding:5px;z-index:50}
  .cmenu button{display:flex;align-items:center;gap:7px;width:100%;padding:7px 9px;border-radius:7px;
    font-size:13px;color:var(--ink2);text-align:left}
  .cmenu button:hover{background:var(--hover);color:var(--ink)}
  .cmenu button.on{color:var(--ink);font-weight:500}
  .cmenu .lk,.cmenu .ck{margin-left:auto;color:var(--ink3);display:inline-flex;flex:0 0 auto}
  .cmenu .ck{color:var(--accent);font-size:12px}
  /* all spaces — one row per place you can go */
  .srow{display:grid;grid-template-columns:196px minmax(0,1fr) 136px 64px;
    align-items:center;gap:18px;width:100%;text-align:left;padding:13px 14px;border-radius:11px;
    border:1px solid transparent}
  .srow+.srow{border-top:1px solid var(--line);border-radius:0}
  .srow:hover{background:var(--card2);border-color:var(--line);border-radius:11px}
  .srow:hover+.srow{border-top-color:transparent}
  .srow .sn{font-size:14px;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:8px;min-width:0}
  .srow .sd,.srow .sm{font-size:12.5px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .srow .sm{text-align:right;font-variant-numeric:tabular-nums}
  .srow .sx{justify-self:end;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3)}
  .srow .sx .r-wait{font-weight:600}
  @media (max-width:760px){
    .srow{grid-template-columns:minmax(0,1fr) auto;gap:6px 14px}
    .srow .sd{grid-column:1/-1;white-space:normal}
    .srow .sm{display:none}
  }
  .item-grid{display:grid;grid-template-columns:minmax(0,620px) 296px;gap:44px;align-items:start}
  .item-grid.solo{grid-template-columns:minmax(0,1fr)}
  .item-grid.solo h1,.item-grid.solo .lede{max-width:760px}
  .item-title{display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap}

  /* rail — the owner's controls, where suggestions used to live */
  .panel{border:1px solid var(--line);border-radius:13px;padding:14px 15px;margin-bottom:12px;background:var(--card);
    box-shadow:var(--card-shadow)}
  .panel .ph{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:600;
    display:flex;align-items:center;gap:8px;margin-bottom:11px}
  .panel .ph .n{display:inline-flex;min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--wait-soft);
    color:var(--wait);font-size:10.5px;font-weight:700;align-items:center;justify-content:center;letter-spacing:0}
  .panel .note{font-size:11.5px;color:var(--ink3);line-height:1.5;margin-top:9px}
  .prow{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:13px}
  .prow+.prow{border-top:1px solid var(--line)}
  .prow .pk{min-width:0;flex:1}
  .prow .pk .sub{font-size:11.5px;color:var(--ink3);display:block;margin-top:1px}
  .prow .x{color:var(--ink3);font-size:13px;padding:2px 6px;border-radius:6px;flex:0 0 auto}
  .prow .x:hover{background:var(--del-soft);color:var(--del)}
  .crmini{display:block;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;
    margin-bottom:7px;background:var(--card);transition:border-color .15s ease,background .15s ease}
  .crmini:hover{border-color:var(--line2);background:var(--card2)}
  .crmini .ct{font-size:12.5px;font-weight:600;line-height:1.35}
  .crmini .cm{font-size:11.5px;color:var(--ink3);margin-top:3px;display:flex;align-items:center;gap:6px}
  .crmini.done{opacity:.6}
  /* the files of a skill — a real folder listing, not tabs */
  .frow.isnew .fn{color:var(--accent)}
  .fdot{width:5px;height:5px;border-radius:50%;background:var(--waitb);flex:0 0 5px}
  .files{border:1px solid var(--line);border-radius:12px;padding:6px;margin-top:14px;background:var(--card);
    box-shadow:var(--card-shadow)}
  .frow{display:flex;align-items:center;gap:9px;width:100%;padding:6px 10px;border-radius:8px;
    font-size:12.5px;color:var(--ink2);transition:background .12s ease,color .12s ease}
  button.frow:hover{background:var(--hover);color:var(--ink)}
  .frow.on{background:var(--inset);color:var(--ink)}
  .frow .fn{font-family:var(--mono);font-size:11.5px;letter-spacing:-.01em;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .frow.on .fn{font-weight:600}
  .frow .tag{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);
    border:1px solid var(--line);border-radius:5px;padding:1px 5px}
  .frow .fs{margin-left:auto;font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
  .fdir{padding:9px 10px 3px;font-family:var(--mono);font-size:11px;color:var(--ink3)}
  .frow.sub{padding-left:26px}

  /* document */
  /* the instructions are the point of the page — full ink, not a caption */
  .doc{border-top:1px solid var(--line);margin-top:10px;padding-top:4px;
    font-size:13.5px;line-height:1.7;color:var(--ink)}
  .doc p{margin:10px 0}
  .doc h2{font-size:15px;font-weight:600;color:var(--ink);margin:26px 0 6px;letter-spacing:-.01em}
  .doc h3{font-size:13.5px;font-weight:600;color:var(--ink);margin:18px 0 4px}
  .doc ul,.doc ol{margin:8px 0 12px 20px;display:flex;flex-direction:column;gap:5px}
  .doc pre{font-family:var(--mono);font-size:11.5px;line-height:1.65;background:var(--inset);border:1px solid var(--line);
    border-radius:9px;padding:11px 13px;overflow-x:auto;margin:10px 0;color:var(--ink2);white-space:pre}
  .doc code{font-family:var(--mono);font-size:11.5px;background:var(--inset);border:1px solid var(--line);
    border-radius:5px;padding:1px 5px;color:var(--ink)}
  .doc pre code{border:none;background:none;padding:0}
  .doc b,.doc strong{color:var(--ink);font-weight:600}
  .doc .wiki{color:var(--ink);border-bottom:1px dotted var(--line2)}
  .doc li.check{list-style:none;margin-left:-20px;display:flex;gap:9px;align-items:baseline}
  .doc li.check .cb{width:11px;height:11px;border:1.5px solid var(--ink3);border-radius:3px;flex:0 0 11px;transform:translateY(1px)}
  .doc .note{font-size:12.5px;color:var(--ink2);margin-top:10px}
  .doc hr{border:none;border-top:1px solid var(--line);margin:22px 0}
  .doc blockquote{border-left:2px solid var(--line2);padding-left:12px;color:var(--ink3);margin:10px 0;font-size:13px}
  .doc .tablewrap{overflow-x:auto;margin:12px 0}
  .doc table{border-collapse:collapse;font-size:12.5px;min-width:100%}
  .doc th,.doc td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top;line-height:1.5}
  .doc th{color:var(--ink);font-weight:600;background:var(--inset);white-space:nowrap}
  .pathline{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-top:26px}

  /* ————— change request ————— */
  .crmeta{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2);margin-top:14px;flex-wrap:wrap}
  .why{font-size:14px;color:var(--ink2);line-height:1.6;margin-top:16px;padding-left:13px;
    border-left:2px solid var(--line2);max-width:74ch}
  /* ————— change request: one column, one question — should I take this change? ————— */
  .crv{max-width:960px}
  .crv h1,.crv .crmeta,.crv .why,.crv .scale,.crv .nodiff,.crv .diffwrap{max-width:730px}
  .crv h1{font-size:24px;font-weight:500;letter-spacing:-.015em;line-height:1.25}
  .crv .crmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-top:12px}
  .crv .crmeta .sep{color:var(--ink3)}
  .crv .why{font-size:15px;line-height:1.6;color:var(--ink);border-left:2px solid var(--line2);
    padding-left:16px;margin:24px 0 0;font-style:normal}
  .crv .scale{font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums;margin-top:24px}
  .crv .scale .plus{color:var(--ok)} .crv .scale .minus{color:var(--del)}
  /* the change, read the way version history reads: folder left, marked file right */
  /* a decision page fits the screen: the buttons never move, the file scrolls to meet them */
  .wrap.fit{height:100dvh;padding-bottom:26px;display:flex;flex-direction:column;overflow:hidden}
  .wrap.fit .crv{flex:1;min-height:0;display:flex;flex-direction:column}
  .wrap.fit .crbody{flex:1;min-height:0;align-items:stretch}
  .wrap.fit .crfiles{align-self:start;max-height:100%;overflow-y:auto}
  .wrap.fit .crview{display:flex;flex-direction:column;min-height:0}
  .wrap.fit .crdoc{flex:1;min-height:0;max-height:none}
  .wrap.fit .crtail{flex:0 0 auto;margin-top:20px}
  .wrap.fit .nodiff,.wrap.fit .diffwrap{flex:0 0 auto}
  /* too short to hold a document: give the page back its scroll */
  @media (max-height:560px){ .wrap.fit{height:auto;overflow:visible;padding-bottom:110px}
    .wrap.fit .crdoc{max-height:min(58vh,560px)} }
  .crbody{display:grid;grid-template-columns:214px minmax(0,1fr);gap:30px;align-items:start;margin-top:14px}
  .crfiles{border:1px solid var(--line);border-radius:12px;padding:12px 9px;background:var(--card)}
  .crview{position:relative}
  .crview::after{content:'';position:absolute;left:0;right:6px;bottom:0;height:36px;pointer-events:none;
    background:linear-gradient(to bottom,transparent,var(--bg))}
  .crdoc{position:relative;max-height:min(58vh,560px);overflow-y:auto;padding-right:6px;margin-top:6px}
  .crdoc .doc{margin-top:8px;border-top:none;padding-top:0}
  .crdoc .doc>*:first-child{margin-top:0}
  @media (max-width:820px){ .crbody{grid-template-columns:minmax(0,1fr)} }
  .diffwrap{font-size:15px;line-height:1.6;margin-top:12px}
  .diffwrap .ctx{color:var(--ink3)}
  .diffwrap .ctx p,.diffwrap .ctx li{margin:8px 0}
  .diffwrap .ctx pre,.diffwrap .dtext pre{font-family:var(--mono);font-size:13px;background:none;border:none;
    padding:0;margin:8px 0;white-space:pre-wrap;overflow:visible;padding-left:2em;text-indent:-2em;color:inherit}
  .diffwrap code{font-family:var(--mono);font-size:13px;background:var(--inset);border-radius:4px;padding:1px 4px}
  .dline{display:flex;gap:12px;padding:8px 12px;border-radius:8px;margin:8px 0}
  .dline.del{background:var(--del-soft)}
  .dline.ins{background:var(--ok-soft)}
  .dline .g{font-family:var(--mono);font-size:13px;flex:0 0 10px;color:var(--ink3);line-height:1.6}
  .dline.del .g{color:var(--del)} .dline.ins .g{color:var(--ok)}
  .dline .dtext{min-width:0;flex:1}
  .dline .dtext p:first-child,.dline .dtext ul:first-child,.dline .dtext ol:first-child{margin-top:0}
  .dline .dtext p:last-child,.dline .dtext ul:last-child,.dline .dtext ol:last-child{margin-bottom:0}
  .dline .dtext ul,.dline .dtext ol{margin:8px 0 8px 20px}
  mark.wdel{background:var(--wdel);color:inherit;text-decoration:line-through;border-radius:3px;padding:0 2px}
  mark.wins{background:var(--wins);color:inherit;border-radius:3px;padding:0 2px}

  /* a tool that needs you: the dot flows into a Connect button under your cursor.
     One metaball filter, two droplets — reduced-motion falls back to the end state. */
  .conn{position:relative;display:inline-flex;align-items:center;height:24px}
  .conn .goo{position:absolute;left:0;top:0;height:100%;width:120px;filter:url(#goo);pointer-events:none}
  .conn .blob,.conn .drip{position:absolute;top:50%;border-radius:99px;background:var(--waitb);display:block}
  .conn .blob{left:0;width:7px;height:7px;margin-top:-3.5px;
    transition:width .44s cubic-bezier(.34,1.45,.5,1),height .44s cubic-bezier(.34,1.45,.5,1),
      margin-top .44s cubic-bezier(.34,1.45,.5,1),background .34s ease}
  .conn .drip{left:1px;width:5px;height:5px;margin-top:-2.5px;transform:scale(.25);
    transition:transform .52s cubic-bezier(.3,1.5,.45,1),background .34s ease}
  .conn .clabel{margin-left:13px;transition:opacity .16s ease}
  .conn .cbtn{position:absolute;left:0;width:92px;height:24px;border-radius:99px;color:#fff;
    display:inline-flex;align-items:center;justify-content:center;letter-spacing:.01em;
    font-size:11.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s ease .14s}
  .card:hover .conn .blob{width:92px;height:24px;margin-top:-12px;background:var(--accent)}
  .card:hover .conn .drip{transform:translateX(68px) scale(1);background:var(--accent)}
  .card:hover .conn .clabel{opacity:0}
  .card:hover .conn .cbtn{opacity:1;pointer-events:auto}
  .nodiff{display:flex;gap:10px;align-items:flex-start;background:var(--wait-soft);color:var(--ink);
    border-radius:10px;padding:12px 14px;margin-top:24px;font-size:13.5px;line-height:1.55}
  .nodiff .nb{color:var(--wait);font-weight:600;flex:0 0 auto}
  .consq{font-size:13px;color:var(--ink2);line-height:1.55;margin-top:12px;max-width:60ch}

  .crtail{max-width:700px;margin-top:30px}
  .cractions{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .verdict{display:flex;align-items:center;gap:9px;padding:11px 14px;border-radius:11px;font-size:13.5px;margin-top:20px}
  .verdict.ok{background:var(--ok-soft);color:var(--ok)}
  .verdict.back{background:var(--wait-soft);color:var(--wait)}
  .sbnote{width:100%;margin-top:14px;padding:10px 12px;border:1px solid var(--line2);border-radius:9px;
    background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;resize:vertical;min-height:64px}
  .sbnote:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
  /* the ⋯ menu on a skill or tool page */
  .dotwrap{position:relative;margin-left:auto;flex:0 0 auto}
  .dots{width:28px;height:28px;border-radius:7px;color:var(--ink3);display:flex;align-items:center;
    justify-content:center;font-size:16px;line-height:1}
  .dots:hover,.dots[aria-expanded="true"]{background:var(--hover);color:var(--ink)}
  .dotmenu{position:absolute;top:34px;right:0;width:216px;background:var(--card);border:1px solid var(--line);
    border-radius:11px;box-shadow:var(--shadow);padding:5px;z-index:45}
  .dotmenu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:7px;
    font-size:13px;color:var(--ink2)}
  .dotmenu button:hover{background:var(--hover);color:var(--ink)}
  /* the glyph rides the row's colour, so hovering lights the whole line at once */
  .dotmenu button .mi{color:var(--ink3);flex:0 0 15px;display:inline-flex;align-items:center;justify-content:center}
  .dotmenu button:hover .mi{color:var(--ink2)}
  /* the one item you cannot undo reads as itself, icon included */
  .dotmenu button.del,.dotmenu button.del .mi{color:var(--del)}
  .dotmenu button.del:hover{background:var(--del-soft)}

  /* version history — one panel over the app: the version on the left, the list on the right */
  .vov{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
    background:rgba(55,53,47,.28);padding:22px}
  .vov.on{display:flex}
  .vovcard{width:min(1200px,100%);height:min(84vh,780px);display:flex;background:var(--card);
    border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
  .vovfiles{flex:0 0 218px;border-right:1px solid var(--line);overflow-y:auto;padding:15px 9px}
  .vovfiles .files{margin-top:6px}
  .vovmain{flex:1;min-width:0;display:flex;flex-direction:column}
  /* the page's name stays put while the body scrolls to the change */
  .vovtop{flex:0 0 auto;padding:17px 42px 14px;border-bottom:1px solid var(--line)}
  .vovname{font-size:16px;font-weight:600;letter-spacing:-.012em}
  .vovcap{font-size:11.5px;color:var(--ink3);margin-top:4px}
  .vovbody{flex:1;overflow-y:auto;padding:24px 42px 56px}
  .vovbody .doc{margin-top:0;border-top:none;padding-top:0}
  .vovbody .doc>*:first-child{margin-top:0}
  .vovrail{flex:0 0 286px;border-left:1px solid var(--line);background:var(--card2);display:flex;flex-direction:column}
  .vovrh{display:flex;align-items:center;padding:15px 14px 13px;font-size:14px;font-weight:600;letter-spacing:-.01em}
  .vovrh .x{margin-left:auto}
  .vovrows{flex:1;overflow-y:auto;padding:0 7px 7px}
  .vrow{display:block;width:100%;padding:9px 11px;border-radius:8px;text-align:left}
  .vrow:hover{background:var(--hover)}
  .vrow[aria-current="true"]{background:var(--hover)}
  .vrow .vt{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--ink)}
  .vrow .vs{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px}
  .vrow .vn{display:block;font-size:11.5px;color:var(--ink2);margin-top:3px;line-height:1.45}
  .vovrf{border-top:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
  .vovrf .rfn{font-size:11.5px;color:var(--ink3);line-height:1.45;flex:1}
  @media (max-width:1080px){ .vovfiles{flex:0 0 186px} .vovrail{flex:0 0 244px} .vovbody{padding:22px 26px 40px} .vovtop{padding:15px 26px 12px} }
  @media (max-width:820px){
    .vovcard{flex-wrap:wrap;height:min(90vh,780px)}
    .vovfiles{flex:1 1 100%;border-right:none;border-bottom:1px solid var(--line);max-height:30%}
    .vovmain{flex:1 1 100%;min-height:40%}
    .vovrail{flex:1 1 100%;border-left:none;border-top:1px solid var(--line);max-height:30%}
  }

  /* a folder you already have — the only non-agent way in */
  .drop{display:block;width:100%;text-align:left;margin-top:16px;padding:16px 15px;border-radius:12px;
    border:1.5px dashed var(--line2);background:var(--inset);transition:border-color .16s ease,background .16s ease}
  .drop:hover{border-color:var(--accent);background:var(--card2)}
  .drop .dt{display:block;font-size:13.5px;font-weight:500;color:var(--ink)}
  .drop .ds{display:block;font-size:12px;color:var(--ink3);margin-top:4px;line-height:1.5}
  .orline{display:flex;align-items:center;gap:12px;margin:16px 0 14px;font-size:12px;color:var(--ink3)}
  .orline::before,.orline::after{content:'';flex:1;height:1px;background:var(--line)}
  .msearch{width:100%;padding:8px 11px;border:1px solid var(--line2);border-radius:8px;
    background:var(--card);color:var(--ink);font-size:13px}
  .msearch:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
  .mcard details summary{cursor:pointer;font-size:12.5px;color:var(--ink2);margin:16px 0 6px;user-select:none;list-style:none}
  .mcard details summary::before{content:'› ';color:var(--ink3)}
  .mcard details[open] summary::before{content:'⌄ '}
  .mlist{max-height:280px;overflow-y:auto}

  /* menus + modal */
  /* ONE profile menu, hung off the top bar's right edge — it is who you are,
     so it is where you are, and everything that used to be a separate gear
     lives inside it. */
  .pmenu{position:fixed;right:12px;top:46px;width:274px;max-height:calc(100dvh - 62px);overflow-y:auto;
    background:var(--card);border:1px solid var(--line);
    border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none;z-index:90}
  .pmenu.on{display:block}
  .pmenu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;
    font-size:13px;color:var(--ink2)}
  .pmenu button:hover{background:var(--hover);color:var(--ink)}
  .pmenu button .mi{color:var(--ink3);flex:0 0 16px;display:inline-flex;align-items:center;justify-content:center}
  .pmenu button:hover .mi{color:var(--ink2)}
  .pmenu .mt{font-size:13px;font-weight:500;display:block}
  .pmenu .ms{font-size:11px;color:var(--ink3);line-height:1.4;display:block}
  .pmenu .ui{min-width:0;flex:1}
  .pmenu .check{color:var(--accent);font-size:13px;margin-left:auto}
  .pmenu .del{color:var(--del)}
  .pmenu .del .mi{color:var(--del);opacity:.8}
  .pmenu .del:hover{background:var(--del-soft);color:var(--del)}
  /* who you are, stated once at the top so the menu never has to repeat it */
  .pmid{display:flex;align-items:center;gap:10px;padding:9px 10px 11px;margin-bottom:4px;
    border-bottom:1px solid var(--line)}
  .pmid .nm{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pmid .em{font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .menu-label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600;
    padding:11px 10px 5px;border-top:1px solid var(--line);margin-top:5px}
  /* the trigger in the top bar */
  .tbme{display:inline-flex;align-items:center;gap:7px;padding:3px 9px 3px 3px;border-radius:99px;
    transition:background .14s ease}
  .tbme:hover,.tbme[aria-expanded="true"]{background:var(--hover)}
  .tbme .av{width:22px;height:22px;font-size:9px}
  .tbme .nm{font-size:12.5px;color:var(--ink2);white-space:nowrap}
  .tbme:hover .nm{color:var(--ink)}

  .mwrap{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;
    background:rgba(55,53,47,.25);padding:16px}
  .mwrap.on{display:flex}
  .mcard{width:460px;max-width:100%;max-height:86vh;overflow-y:auto;background:var(--card);border:1px solid var(--line);
    border-radius:16px;box-shadow:var(--shadow);padding:24px}
  .mcard h3{font-size:17px;font-weight:600;letter-spacing:-.012em;margin-bottom:6px}
  .mcard p{font-size:13px;color:var(--ink2);line-height:1.55}
  .endpoint{font-family:var(--mono);font-size:11.5px;background:var(--inset);border:1px solid var(--line);
    border-radius:8px;padding:9px 11px;margin:14px 0 0;color:var(--ink);overflow-x:auto;white-space:nowrap}

  /* the JSON snippet keeps its line breaks; everything else stays one line */
  .endpoint.pre{white-space:pre}

  /* ————— which client you already use —————
     One snippet, chosen, instead of three printed at once. Picking your
     client is a choice you made before opening this sheet, so it is a
     control rather than something to scroll past. */
  .seg{display:flex;gap:2px;padding:2px;background:var(--inset);border-radius:9px;margin:14px 0 0}
  .seg button{flex:1;padding:5px 8px;border-radius:7px;font-size:12px;color:var(--ink2);
    white-space:nowrap;transition:background .14s ease,color .14s ease}
  .seg button:hover{color:var(--ink)}
  .seg button[aria-current="true"]{background:var(--card);color:var(--ink);font-weight:600;
    box-shadow:var(--card-shadow)}
  .seghint{font-size:11.5px;color:var(--ink3);margin:10px 0 0;line-height:1.5}
  /* the copy rides the block it copies */
  .snip{position:relative;margin-top:14px}
  .snip .endpoint{margin:0;padding-right:40px}
  .snip .cp{position:absolute;top:7px;right:7px;width:24px;height:24px;border-radius:6px;
    display:inline-flex;align-items:center;justify-content:center;color:var(--ink3);
    transition:color .14s ease,background .14s ease}
  .snip .cp:hover{color:var(--ink);background:var(--hover)}
  .snip .cp.ok{color:var(--ok)}
  .mnote{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink3);line-height:1.55}
  .mcard .mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;align-items:center}
  .pick{display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border:1px solid var(--line);
    border-radius:11px;background:var(--card);margin-bottom:7px;transition:border-color .15s ease,background .15s ease}
  .pick:hover{border-color:var(--accent);background:var(--card2)}
  .pick .pt{font-size:13px;font-weight:500;display:block}
  .pick .pd{font-size:11.5px;color:var(--ink3);display:block}

  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(8px);
    background:var(--ink);color:var(--bg);font-size:13px;font-weight:500;padding:10px 18px;border-radius:99px;
    opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:80;max-width:82vw;text-align:center}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:900px){
    .app{flex-direction:column}
    .side{width:100%;height:auto;position:static;overflow:visible;border-right:none;border-bottom:1px solid var(--line)}
    .side-inner{width:100%;height:auto;flex-direction:row;align-items:center;gap:4px;flex-wrap:wrap;padding:12px 16px}
    .brand{padding:0 8px 0 0}
    .nav{flex-direction:row;flex-wrap:wrap}
    .nav .lbl,.side .cap{display:none}
    .side .spacer{display:none}
    .pmenu{right:14px;left:14px;width:auto;top:56px}
    .wrap{padding:18px 18px 90px}
    .item-grid{grid-template-columns:1fr;gap:26px}
  }

  /* =========================================================
     KNOWLEDGE — the knowledge base as a place you browse.
     Same tokens, same rows, same document type as Skills &
     tools. The only new idea is the TREE: a KB is nested, and
     a flat list would lose the one thing the nesting tells you.
     ========================================================= */
  /* the app switcher — the brand block becomes the way between apps */
  .brandrow{display:flex;align-items:center;gap:2px;margin:0 -8px 16px}
  .brand.switch{flex:1;min-width:0;border-radius:9px;padding:6px 8px;margin:0;
    transition:background .14s ease}
  .brand.switch:hover,.brand.switch[aria-expanded="true"]{background:var(--hover)}
  .brand.switch .bn,.brand.switch .bs{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand .bchev{margin-left:auto;color:var(--ink3);flex:0 0 auto;transition:transform .16s ease}
  .brand.switch[aria-expanded="true"] .bchev{transform:rotate(180deg)}
  /* drops from the brand in the top bar */
  .appmenu{position:fixed;z-index:80;left:44px;top:46px;width:246px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:5px;
    animation:cmenu-in .14s cubic-bezier(.2,.9,.3,1)}

  /* the branch switcher, dropping from the chip it belongs to */
  .branchmenu{position:fixed;z-index:80;left:196px;top:46px;width:308px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:5px;
    animation:cmenu-in .14s cubic-bezier(.2,.9,.3,1)}
  .branchmenu .bml{padding:7px 9px 5px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink3);font-weight:600}
  .brow{display:flex;align-items:flex-start;gap:9px;width:100%;padding:8px 9px;border-radius:8px}
  .brow:hover{background:var(--hover)}
  .brow .bck{width:14px;flex:0 0 14px;color:var(--accent);padding-top:2px}
  .brow .bn2{font-family:var(--mono);font-size:12px;color:var(--ink);letter-spacing:-.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brow .bd2{font-size:11.5px;color:var(--ink3);margin-top:2px;line-height:1.4}
  .brow .bstat{margin-left:auto;flex:0 0 auto;font-size:10px;font-weight:700;border-radius:9px;padding:1px 7px;
    color:var(--wait);background:var(--wait-soft);white-space:nowrap}
  .branchmenu .bsep{height:1px;background:var(--line);margin:5px 4px}
  .branchmenu .bnew{display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;border-radius:8px;
    font-size:12.5px;color:var(--ink2)}
  .branchmenu .bnew:hover{background:var(--hover);color:var(--ink)}
  .branchmenu .bnew .bi2{color:var(--ink3);display:inline-flex}
  .appmenu button{display:flex;gap:10px;width:100%;padding:9px 10px;border-radius:8px;align-items:flex-start}
  .appmenu button:hover{background:var(--hover)}
  .appmenu .ck{width:14px;flex:0 0 14px;color:var(--accent);padding-top:2px}
  .appmenu .an{font-size:13px;font-weight:600;color:var(--ink)}
  .appmenu .ad{font-size:11.5px;color:var(--ink3);line-height:1.4;margin-top:1px}

  /* the tree — a nav row that happens to nest, so it is typeset as one: same
     size, padding, radius and weight as `.nav button` in the Skills sidebar.
     Two sidebars in one app should not read as two different products. */
  .tree{display:flex;flex-direction:column;gap:1px;overflow-y:auto;flex:1;margin:0 -4px;padding:0 4px}
  .trow{display:flex;align-items:center;gap:6px;width:100%;padding:6px 10px;border-radius:7px;
    font-size:13px;color:var(--ink2);transition:background .12s ease;text-align:left}
  .trow:hover{background:var(--hover);color:var(--ink)}
  .trow[aria-current="true"]{background:var(--hover);color:var(--ink);font-weight:600}
  .trow .tw{flex:0 0 13px;width:13px;height:13px;display:inline-flex;align-items:center;justify-content:center;
    color:var(--ink3);transition:transform .16s cubic-bezier(.2,.9,.3,1)}
  .trow.open .tw{transform:rotate(90deg)}
  .trow .tn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .trow .tdot{margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--waitb);flex:0 0 6px}
  .tkids{display:flex;flex-direction:column;gap:1px}

  /* The Knowledge column starts high: the top bar already separates it from
     the window, so the page's own padding only has to keep the tabs from
     touching the bar. The Skills pages keep the roomier default — they open
     on a heading, not on a tab strip. */
  .wrap.kb{padding-top:12px}
  /* With no rail, ONE column holds tabs, title and text at the same width, so
     they share an edge and the whole page reads as a single centred block.
     Constraining the article instead would centre the prose inside a wider
     wrap and leave the tabs hanging off to one side. (The width itself is now
     the app-wide default, up in `.wrap` — this is where it came from.) */
  .wrap.kb .item-grid.solo > article{max-width:none}
  /* Collapsed, the column is centred in the whole window — so the space the
     sidebar gave up becomes margin on BOTH sides rather than more line length
     on one. Wider gutters are the point, not a side effect. */
  .app.collapsed .wrap{padding-left:64px;padding-right:64px}

  /* open documents — tabs, because a KB visit is never one file */
  .kbtabs{display:flex;align-items:center;gap:2px;margin:0 0 18px;border-bottom:1px solid var(--line);
    overflow-x:auto;scrollbar-width:none}
  .kbtabs::-webkit-scrollbar{display:none}
  .kbtab{display:inline-flex;align-items:center;gap:7px;padding:7px 10px 10px;font-size:12.5px;
    color:var(--ink3);border-radius:8px 8px 0 0;white-space:nowrap;transition:background .14s ease,color .14s ease}
  .kbtab:hover{background:var(--hover);color:var(--ink2)}
  .kbtab[aria-current="true"]{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--ink)}
  .kbtab .x{width:15px;height:15px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;
    color:var(--ink3);opacity:0;transition:opacity .12s ease,background .12s ease}
  .kbtab:hover .x,.kbtab[aria-current="true"] .x{opacity:1}
  .kbtab .x:hover{background:var(--line);color:var(--ink)}
  .kbtab .tdirty{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:0 0 6px}

  /* ————— change requests, docked where the work arrives —————
     The bottom of the tree is where the real app keeps them, and it is the
     right place: the tree is what you are reading, this is what people want
     you to change about it. It is a QUEUE, so it shows who and how much, and
     it collapses — the point is to notice it, not to live in it. */
  .crdock{flex:0 0 auto;border-top:1px solid var(--line);margin:8px -14px 0;padding:0 8px}
  .crdock-h{display:flex;align-items:center;gap:7px;width:100%;padding:10px 6px 8px;
    font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600}
  .crdock-h:hover{color:var(--ink)}
  .crdock-h .cw{width:11px;flex:0 0 11px;display:inline-flex;color:var(--ink3);
    transition:transform .16s cubic-bezier(.2,.9,.3,1)}
  .crdock-h.open .cw{transform:rotate(90deg)}
  .crdock-h .cn{margin-left:auto;font-size:10px;font-weight:700;border-radius:9px;padding:1px 7px;
    color:var(--wait);background:var(--wait-soft);letter-spacing:0}
  .crdock-list{display:flex;flex-direction:column;gap:1px;padding-bottom:6px;max-height:184px;overflow-y:auto}
  .crrow{display:block;width:100%;padding:6px 7px;border-radius:7px;transition:background .12s ease}
  .crrow:hover{background:var(--hover)}
  /* 13/11.5 — the same two sizes the tree above and the Skills nav use, so the
     whole sidebar is one typographic system rather than three */
  .crrow .ct{font-size:13px;color:var(--ink2);display:flex;gap:6px;min-width:0}
  /* the ellipsis has to live on the TEXT, not on the flex row — a flex
     container clips its children without ever drawing one */
  .crrow .ct .cx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .crrow:hover .ct{color:var(--ink)}
  .crrow .cnum{color:var(--ink3);font-variant-numeric:tabular-nums;flex:0 0 auto}
  .crrow .cm{font-size:11.5px;color:var(--ink3);margin-top:1px}

  /* ————— the page's own actions, on the page —————
     Copy belongs beside the title, not inside a ⋯ menu two clicks away: it is
     the single most common thing anyone does with a document they are about to
     paste into a chat. The split button follows the docs-site convention —
     press the left half to copy, the chevron for the other formats. */
  /* With the rail hidden the column would run the whole window wide, and a
     75-character line is where reading stops being comfortable — so the
     measure is held by the article, not by whether the rail happens to be up. */
  /* NOT centred: the breadcrumb and the ⋯ row above sit at the column's left
     edge, and an article floating in the middle of them leaves the title
     indented from its own trail. Knowledge centres the WHOLE column instead
     (`.wrap.kb.solo`), which keeps every edge in one line. */
  .item-grid.solo > article{max-width:820px}
  .pageacts{display:flex;align-items:center;gap:6px;margin-left:auto;flex:0 0 auto}
  /* the one bounded action on a page — see the note where it is rendered.
     No `overflow:hidden`: this is the dropdown's positioning parent, and
     clipping it would clip the menu out of existence. Halves round themselves. */
  .actwrap{display:inline-flex;align-items:stretch;border:1px solid var(--line2);border-radius:9px;
    background:var(--card);position:relative;transition:border-color .14s ease}
  .actwrap:hover{border-color:var(--ink3)}
  .actbtn{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;font-size:12.5px;color:var(--ink2);
    border-radius:8px 0 0 8px;transition:background .14s ease,color .14s ease}
  /* no second half to make room for — a group has exactly one thing to share */
  .actwrap.only .actbtn{border-radius:8px}
  .actbtn:hover{background:var(--hover);color:var(--ink)}
  .actchev{width:24px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink3);
    border-left:1px solid var(--line);border-radius:0 8px 8px 0;transition:background .14s ease,color .14s ease}
  .actchev:hover,.actchev[aria-expanded="true"]{background:var(--hover);color:var(--ink)}
  .actmenu{position:absolute;right:0;top:calc(100% + 5px);z-index:70;min-width:212px;background:var(--card);
    border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);padding:5px;
    animation:cmenu-in .14s cubic-bezier(.2,.9,.3,1)}
  .actmenu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 9px;border-radius:7px;
    font-size:12.5px;color:var(--ink2);white-space:nowrap}
  .actmenu button:hover{background:var(--hover);color:var(--ink)}
  .actmenu .mi{color:var(--ink3);flex:0 0 15px;display:inline-flex;align-items:center;justify-content:center}

  /* ————— the access sheet —————
     Ordered by what people came to do. Nine times in ten that is "give this to
     someone", so the field for it is first, focused, and above the fold; the
     roster is the answer to a different, rarer question and sits under it. */
  .acc-add{display:flex;gap:8px;margin-top:16px}
  .acc-add .msearch{flex:1;min-width:0;margin:0}
  .acc-sec{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600;
    margin:22px 0 2px;display:flex;align-items:baseline;gap:8px}
  .acc-sec .n{letter-spacing:0;font-weight:400;font-size:11.5px}
  .acc-row{display:flex;align-items:center;gap:9px;padding:8px 0;font-size:13px}
  .acc-row+.acc-row{border-top:1px solid var(--line)}
  .acc-row .pk{min-width:0;flex:1}
  .acc-row .pk .sub{font-size:11.5px;color:var(--ink3);display:block;margin-top:1px}
  .acc-role{font-size:12px;color:var(--ink3);white-space:nowrap}
  .acc-x{width:22px;height:22px;border-radius:6px;color:var(--ink3);display:inline-flex;
    align-items:center;justify-content:center;flex:0 0 auto}

<script type="text/plain" id="md-heyreach-campaign">
# HeyReach campaign setup

## 1. Check the account state first

`get_all_linked_in_accounts` and `get_all_campaigns` before anything else.

- `authIsValid: false` → the LinkedIn session is dead, reconnect required. A real problem.
- `isActive: false` → **not** a problem. It is derived, not a setting: a sender only
  reads as active while a campaign is actually running. Draft, paused, cancelled and
  failed campaigns all leave the sender "Available". It flips on its own when a
  campaign starts. Do not tell the user to go activate anything.
- `isValidNavigator` tells you whether InMail steps are viable at all.

## 2. Read the existing sequence before writing one

Always `get_campaign_sequence` first — on the target campaign, and on any campaign
that already works, as a reference for valid node shapes.

**Newly created HeyReach campaigns ship with stock demo copy.** It reads like a
lead-gen agency pitch ("dropped a few likes on your posts lately… since you get 50+
comments on average"). If the campaign is started without replacing it, that is what
goes to real prospects. Check for it explicitly and flag it loudly.

## 3. Sequence structure

A tree of nodes: `nodeType`, `actionDelay`, `actionDelayUnit` (`HOUR`|`DAY`),
`unconditionalNode`, `conditionalNode`, `payload`.

Rules that the API enforces and will reject you for:

- Every path ends in `END`.
- `actionDelay >= 3 HOUR` (or use `DAY`) on **every** node following a
  `CONNECTION_REQUEST`, `MESSAGE`, `INMAIL`, `VIEW_PROFILE`, `FOLLOW` or `LIKE_POST`
  — including `END` nodes. Omitting it becomes `00:00:00` and the call fails.
- `CONNECTION_REQUEST` needs both branches: `conditionalNode` = accepted,
  `unconditionalNode` = not accepted.
- `MESSAGE` and `INMAIL` need both, and their `conditionalNode` **must** be `END`
  (that is the reply-detected exit).
- `MESSAGE` may only appear after the lead is connected — on the accepted side of
  `CONNECTION_REQUEST`, or under `CHECK_IS_CONNECTION`.

Payloads:

```
MESSAGE  { messages: ["…{FIRST_NAME}…"], fallbackMessage: "…" }
INMAIL   { messages: [{subject, message}], fallbackMessage: {subject, message} }
CONNECTION_REQUEST { messages: [""], fallbackMessage: "", toBeWithdrawnAfterDays: 25 }
```

`fallbackMessage` is used when the variable cannot be filled — it must read
correctly with the name removed entirely, not with a blank left in it.

Prefer a `CHECK_IS_CONNECTION` root over a bare `CONNECTION_REQUEST` root: it
handles leads who are already 1st-degree instead of failing their first step.

## 4. Copy

- Open on the prospect's deadline or problem, never on your product, and never on AI.
- One concrete proof point with a number, anonymised unless you have permission to
  name the client.
- Follow-ups add information; they never say "just bumping this".
- Last touch gives an explicit exit ("say so and I'll leave it there") — it protects
  the sender's reputation and produces cleaner negative signal.
- Match the copy to the persona. One list per hypothesis, one campaign per list; do
  not pour mixed personas into one sequence. See [[icp-hypothesis-lists]].
- For DACH prospects, German materially lifts reply rate — but only write it if the
  human can handle replies in German. Ask.

## 5. Wire it up

```
create_empty_list → create_campaign(name, listId, accountIds, schedule, sequenceJson)
```

Or on an existing campaign: `update_campaign_settings` (name + list),
`update_campaign_accounts` (sender), `update_campaign_sequence`,
`update_campaign_schedule`.

Note that `update_campaign_settings` is where the lead list is bound — a campaign
created earlier is often still pointing at an empty starter list.

Set `excludeContactedFromOtherCampaigns: true` when running several campaigns off
one sender, or the same person gets two different pitches.

Schedule: business hours in the prospect's timezone, weekdays only
(`W. Europe Standard Time` for DACH).

## 6. Pre-launch checklist — report, do not act

- [ ] Lead count verified via `get_list_by_id` (not the import response)
- [ ] Demo copy gone, every message read end to end
- [ ] `fallbackMessage` reads correctly for every step
- [ ] InMail credits exist, if the sequence has an InMail branch — without them that
      branch silently does nothing, and it is typically half the list
- [ ] Sender attached, schedule set, daily limits sane (~20-25 connections/day/sender)

**Never call `start_campaign`.** It sends messages to real people under the human's
name. Present the checklist and stop.
</script>

<script type="text/plain" id="md-crd-skill">
---
name: create-reading-deck
description: Build a client-grade reading deck — a leave-behind read with nobody there to narrate it.
allowed-tools: []
---

# Reading deck

A **reading deck** is a document that lands in someone's inbox and is read with
nobody there to narrate it. That single fact drives every rule here: no slide may
depend on a speaker, every headline must carry its own conclusion, and anything a
reader could misread has already failed.

This skill exists because building one of these by feel costs a day of rework.
Everything below was paid for once already — see `reference/LESSONS.md`.

Version **1.4.1**. Changes are recorded in `CHANGELOG.md`.

---

## 0. Get the toolkit onto disk

This skill is scripts plus reference docs, and the scripts have to run somewhere.
Fetch the bundled files and write them into your working folder, preserving the
structure:

```
scripts/check-layout.py     deterministic visual QA
scripts/export-pdf.py       HTML -> PDF at native resolution
scripts/embed-fonts.py      inline the webfonts
scripts/video-to-gif.py     screen recording -> looping GIF (cross-platform)
scripts/video-to-gif.sh     the same, for POSIX shells
template/deck.html          the design system + worked examples of every component
template/storyline.md       the outline you write before any HTML
reference/QA-STANDARDS.md   researched MBB standards, with numbers and sources
reference/DESIGN-SYSTEM.md  exact CSS spec — read before touching styling
reference/LESSONS.md        the traps, and what each one cost
```

**Dependencies:** ffmpeg (GIFs and poster frames), Pillow (`pip install pillow`,
PDF assembly), and Google Chrome (driven headlessly for rendering and
measurement). All four scripts find Chrome automatically; set `CHROME_PATH` if
yours lives somewhere unusual.

**The KB copy is the source of truth.** If you improve the skill, land the change
here as a change request (step 9) — not only in your local copy, which nobody
else will ever see.

---

## The order of work

Do these in order. Steps 1 and 2 are where the time is won or lost.

### 1. Agree the structure before writing anything

Ask for, or extract, the **content hierarchy** and **mirror it**. If the person
gave you a nested list of sections, that IS the deck's structure. Reframing it
into a problem/solution narrative is a *proposal* you offer, never a default you
assume. Getting this wrong means rewriting every slide.

Pin down, explicitly:

| Question | Why it must be settled first |
|---|---|
| How many slides? | Copy density is a function of slide count. Changing it rewrites everything. |
| Whose hierarchy? | Theirs, unless they ask for a reframe. |
| Read-alone or presented? | Read-alone needs full sentences and no orphan context. |
| Who is the reader? | Anchors every scope decision. |

### 2. Write `storyline.md` before any HTML

Arguing about an outline is cheap; arguing about markup is not. The storyline
holds the slide map, the action titles, the horizontal-logic read-through, and —
critically — two lists the deck itself cannot carry:

- **Claims deliberately NOT made.** Anything the reader would *like* to hear but
  the source does not support. Keeping these visible stops them leaking into the
  copy.
- **Open questions.** What the source cannot answer. Do not invent answers.

Start from `template/storyline.md`.

### 3. Write the deck

Copy `template/` into your deck folder. `template/deck.html` carries the full
design system, the layout contract in a head comment, and worked examples of
every component. **Read `reference/DESIGN-SYSTEM.md` before changing any CSS.**

**Pick a theme** — one attribute on `<html>`:

    data-theme="sales"     light editorial, no accent colour  (default)
    data-theme="signal"    dark, one purple accent on the icon badges

Both themes share the same geometry, type scale and measure, so the QA
thresholds mean the same thing in either. A theme is a token block; if you are
typing a hex value into component CSS you are forking the stylesheet by
accident.

Action titles are the highest-leverage thing on the page. See
`reference/QA-STANDARDS.md` §6 for the label-vs-assertion test.

### 4. Media

Screen recordings beat still screenshots for showing a product working.

    scripts/video-to-gif.py recording.mov screenshots/01-thing.gif --width 1400

It builds a two-pass palette so UI text stays sharp, and verifies the loop flag.
The frame is kept **exactly as recorded** by default. Add `--crop` when the
recording has dead space baked in.

Whichever you use, do not force the clip into the grid's aspect ratio. Let the
media keep its aspect and size the slot to match.

**Then look at the last frame.** A GIF rests there every cycle. A recording that
ends on an empty credentials form, a spinner, or an error will loop through that
forever, under a headline claiming the opposite. Trim with `--to`.

### 5. QA gate 1 — the deck is correct

    scripts/check-layout.py deck.html --md storyline.md

Must exit 0. Run it as often as you like while writing; it is fast.

It measures what eyes miss: clipping, title-band drift, characters per line
against the WCAG ceiling, type-scale creep, bold budget, headline orphans,
vertical balance, column stranding, missing assets, placeholder text, whether the
PDF is stale, and whether the storyline still matches the deck.

**Also do a consistency pass no script covers yet:** grep every product noun and
feature name across all slides and check that no two slides contradict each
other, and that your prose vocabulary matches the words visible *inside* the
screenshots.

### 6. Make it actually self-contained

    scripts/embed-fonts.py deck.html          # inline the webfonts
    scripts/embed-fonts.py deck.html --check  # exit 1 if a remote fetch remains

The template links Google Fonts so it stays readable while you author. That link
is a **dependency**, and a deck is a document someone opens in five years,
offline, behind a proxy. Embedding costs ~270KB and buys three things: it cannot
break, it does not ping a third party from the recipient's network, and it
removes the font race.

### 7. Export

    scripts/export-pdf.py deck.html

**PDF has no animated raster format.** If the deck uses GIFs you must declare a
poster frame per slot in `posters.json`, or the exporter freezes each on frame 1.
Pick each frame for what it *proves*, not for where the clip happens to end.

### 8. QA gate 2 — the deck is sendable, then ship

    scripts/check-layout.py deck.html --md storyline.md --ship

Must exit 0. This is a **different question** from gate 1. Gate 1 asks "is the
deck correct?"; gate 2 asks "is it safe to leave the building?" — it escalates
to failure the four things that are acceptable while authoring and unacceptable
in a client's inbox: a placeholder where a screenshot should be, placeholder text
in the copy, a stale PDF, and fonts fetched from a CDN at render time.

| | Check |
|---|---|
| E2 | Client, product and person names spelled right — **check their website, not your notes** |
| E5 | Every animated file has a deliberately chosen poster frame in `posters.json` |
| E7 | Cover carries the client name, the date, and any confidentiality marking |
| E8 | Every hyperlink resolves |
| D6 | Numbers agree across pages; units and rounding consistent |

The deck is a **folder**, not a file — `deck.html` needs `screenshots/`
alongside it. Zip them.

### 9. Write down what this build taught you — required, not optional

**This is the step that makes the skill worth more next quarter than it is
today.** Skip it and the next person re-learns the same thing at the same cost.

Append to `reference/LESSONS.md` **in the knowledge base** — a lesson that only
reaches your local copy is a lesson thrown away. Open a change request against
this folder before you close the task.

Three rules that keep the file useful rather than a dump:

1. **One lesson per trap, not per incident.** If it is a new instance of an
   existing lesson, strengthen that entry.
2. **Delete lessons that stop being true.** A lessons file nobody trusts is a
   lessons file nobody reads.
3. **If the fix can be automated, automate it instead.** A lesson that could be a
   check in `scripts/check-layout.py` belongs in the script.

---

## Non-negotiables

These are cheap to honour and expensive to fix later.

1. **Every headline is an assertion.** "Knowledge you can trust" is a label and
   fails. "The graph stays current on its own" is a conclusion and passes.
2. **The titles alone must tell the story.** Read only the h2s, top to bottom. If
   that is a table of contents rather than an argument, the deck has no spine.
3. **Never fabricate a capability.** If the source does not say it, it does not
   go in — no matter how well it answers what the reader wants.
4. **Measure, do not eyeball.** Every numeric claim about the layout comes from
   `check-layout.py`.
5. **Validate your validator.** Break the deck deliberately and confirm the
   checker catches it. A check that always passes is worse than no check.
6. **Flag, do not silently fix, a content contradiction.** It is usually a real
   ambiguity in the product, not a typo.
7. **Say what you did not do.** A deck that looks finished but is not is worse
   than one that is visibly incomplete.
8. **Leave the skill better than you found it.** Step 9 is not optional.
</script>

Build a client-grade **reading deck** — a leave-behind that gets read with nobody
there to narrate it.

`SKILL.md` is the workflow; read it first. This file is the operational detail:
how to get the toolkit onto a machine, what it depends on, and the three things
people get wrong.

## Getting it onto your machine

The knowledge base is the source of truth. Two ways to work from it.

**From an agent with knowledge-base access** — the normal path. `get_skill` with

1. **Writing copy before the slide count and structure are agreed.** Every change
   to either rewrites everything downstream. Settle it first, in writing.
2. **Topic labels instead of action titles.** "Knowledge you can trust" says

   sending, or the deck renders in a fallback face offline.
4. **Trusting your eyes for layout.** Run `check-layout.py`. It catches clipping,
   over-long lines, type-scale creep and storyline drift that look fine at a glance.
