<script type="text/plain" id="md-crd-storyline">
# Storyline

Storyline. N content slides plus a title.

```
Section A
  1.   Overview            → slide 02
  1.1  Sub-thing           → slides 03 + 04
  1.2  Other sub-thing     → slide 05
Section B
  2.   Thing               → slide 06
```

**Recipient:** who this is for, and what they actually asked for. One or two
lines. Everything else in the deck is a scope decision made against this.

---

## Slide map

| # | Section | Action title | Source items | Content |
|---|---------|--------------|--------------|---------|
| 01 | — | Title | — | — |
| 02 | Section A | *An assertion, not a label* | framing | what this slide covers |
| 03 | A · Sub | *…* | 1.1a, 1.1b | … |

---

## Horizontal logic

Read only the titles, top to bottom. They must carry the whole argument with the
bodies removed. If this reads as a table of contents, the deck has no spine.

> Assertion one.
> → Assertion two.
> → Assertion three.

---

## Screenshots

| Slot | Slide | Shows |
|---|---|---|
| `01-thing.png` | 03 | Which screen, in what state, and what must be visible |

Capture briefs render on the slides themselves until the images exist.

For recordings, record the poster frame choice in `posters.json` — the PDF
export needs it, and the reason matters as much as the timestamp.

---

## Claims deliberately NOT made

1. **Claim.** Why the source does not support it, and what the source does say.

## Open questions

1. **Question.** Why it matters to this reader.

---

## Design standards applied

Verified with `check-layout.py`, not by eye:

| Standard | Result |
|---|---|
| Action titles | N of N are assertions |
| Line length (WCAG 1.4.8 ceiling 80 CPL) | … |
| Frozen title position | identical y on every slide |
| Type scale | 6 steps |
| Bold discipline | longest span N words |
</script>

<script type="text/plain" id="md-crd-design">
# Bevel Light Editorial — Reading-Deck Design System

The spec for `template/deck.html` — and for any new deck built on it.

A **reading deck** argues unattended, in a browser or as a PDF. No presenter, no
narrator, no live Q&A. Every rule below protects that: fixed frames so nothing
clips, one measure so nothing tires the eye, no colour so nothing encodes meaning
the reader can't decode alone.

All CSS here is quoted verbatim from the template. Copy it exactly. If you change a
value you are authoring a different system — say so in the commit message.

**Do not use this system for:** a stage deck (needs bigger type, fewer words), a
deck over ~8 pages (see §9), or anything needing charts or tables (§9 — the
system has no component for either).

> §1–§13 describe the **sales** theme: light editorial, no accent colour. That
> is the default and the one every number here was measured against. A second
> theme, **signal** (dark, one purple accent), ships alongside it — see §14.

---

## 0 · The 30-second version

| | |
|---|---|
| Page | `#ECEAE4` · Slide `#FAF9F6` · ink `#14130F` |
| Type | Hanken Grotesk + IBM Plex Mono |
| Scale | **110 / 56 / 28 / 22 / 18 / 13** — exactly six, forever |
| Accent | none |
| Native size | 1920 × 1080, scaled to fit width by a 10-line script |
| Title | frozen in a 168px band, same y on every slide |
| Measure | 680px body / 780px lede — never removed |
| Body budget | **631px** of vertical space under the band, per slide |

Shipped deck: 6 pages, 5 content slides + title. 3 looping GIFs at 2100×1682.

---

## 1 · Starting a new deck

Copy the skill's `template/` folder. Then change exactly these seven things —
nothing else in the boilerplate is deck-specific.

| # | What | Where |
|---|---|---|
| 1 | `<title>` | `<head>` |
| 2 | Capture standard block | `<head>` comment |
| 3 | Title-slide `h1` / subtitle / legal line | `.title-center` |
| 4 | `.foot` denominators on every slide | every `.foot` |
| 5 | `.toplabel` taxonomy | every `.head` |
| 6 | The five to seven `h2`s | every `.titleband` |
| 7 | Poster frames: gif path → source, timestamp, reason | `posters.json` |

**The fonts are a hard dependency, not a nicety.** Every character-count ceiling
in §6 and §8 assumes Hanken Grotesk is loaded.
</script>

<script type="text/plain" id="md-crd-qa">
# MBB-Grade Reading Deck — QA Reference

**Scope:** leave-behind / pre-read documents read *without a presenter*. Not stage decks. Target artifact: 5–15 pages that must survive being forwarded to someone who was never in the room.

**Canvas:** native 1920×1080 = 13.333in × 7.5in at 144 dpi. **1pt = 2px on this canvas.** All px figures are native-canvas px unless stated.

**Time budget for a 6-page deck:** argument pass 20 min → auto checks 1 min → layout/type pass 15 min → export & delivery 10 min. ≈45 min. If you are spending 3 hours, you are fixing design on a broken argument.

---

## 0 · SHIP GATE

### 0.1 Severity model

Every finding gets one letter. This is what stops a review turning into a taste argument.

| Sev | Meaning | Action |
|---|---|---|
| **B** | Blocker — the deck says the wrong thing, or is unsafe to send | Do not send. Fix or pull the page. |
| **M** | Must-fix — measurable violation of a threshold in this document | Fix before send. The number decides. |
| **N** | Note — house-style or judgement call | Log it, ship anyway. |

**Rule:** anything in §8 ("standards we deliberately do not apply") cannot be raised above N. Raising it as M is itself the defect.

### 0.2 The checklist

`[AUTO]` = a script decides. `[SEMI]` = script flags, human adjudicates. `[HUMAN]` = judgement, no script will ever do it.

**Phase A — argument. If any A item fails, stop. Design work on a page whose title is wrong is wasted work.**
</script>

<script type="text/plain" id="md-crd-lessons">
# LESSONS.md — the traps, what they cost, and what catches them now

Paid for once, on the BEO platform & services deck (6 slides, one real recipient, ~2 days of rework). Every item below is a defect that shipped or nearly shipped.

## What each trap cost, and what catches it now

| # | Trap | Cost | Caught now by |
|---|---|---|---|
| 1 | Narrative arc invented instead of mirroring the brief's hierarchy | 4 turns; every slide rewritten | Nothing automated — §1 |
| 2 | Slide count never agreed (12 → 9 → 6) | All copy written 3× | Nothing automated — §2 |
| 3 | Probe measured `.body.scrollHeight`; `.body` is `flex:1` | Every slide reported "ok" while clipped | `check-layout.py` → `clipping` |
| 4 | 3 independent agents fabricated the same 3 claims | Near-miss: false product claims to a prospect | `CLAIMS NOT MADE` list — human only |
| 5 | Column width guessed: 840px assumed 69 CPL, measured 84 | Over the 80 CPL ceiling on every body row | `check-layout.py` → `measure` |
| 6 | Slide 04 implied SharePoint ships; slide 06 sold it as custom work | Survived 3 single-slide reviews | grep loop — no script yet |
| 7 | Prose renamed "connectors" → "integrations"; the PNGs still said **Connectors** | Shipped copy/UI mismatch | Human re-read of every shot |
| 8 | Markdown patch reported MISS, was treated as landed | 5+ silent md/HTML drifts | `check-layout.py --md` → `sync` |
| 9 | PDF froze slide 04's GIF on an empty Atlassian API-token form | Worst possible still, to a prospect | `posters.json` + eyeball every page |

Anything in the "human only" rows is still live. The script cannot save you there.

## 1. Before any file exists

**Mirror the source hierarchy on the first pass.** The brief was a plain hierarchy. A multi-agent "storyline design" pass produced a problem/diagnosis arc instead. The user: *"this storytelling structure makes no sense"*. Narrative arcs feel like value-add, so they get applied by default rather than proposed.
</script>

<script type="text/plain" id="code-crd-v2gsh">
#!/usr/bin/env bash
# video-to-gif.sh — turn a screen recording into a looping GIF for a deck slot.
#
#   ./video-to-gif.sh recording.mov out.gif                 # as-recorded (default)
#   ./video-to-gif.sh recording.mov out.gif --crop          # auto-strip padding
#   ./video-to-gif.sh recording.mov out.gif --width 1400    # smaller file
#   ./video-to-gif.sh recording.mov out.gif --to 6          # first 6 seconds only
#
# WHEN YOU NEED --crop
# The default keeps the frame exactly as recorded, which is what you want when
# you already framed the capture yourself.
#
# Reach for --crop when the recording has dead space baked in: macOS window
# recordings carry ~10% black padding around the window, which on a cream slide
# reads as a black box.
#
# Either way, DO NOT force the clip into the grid's aspect ratio. Let the media
# keep its own aspect and size the slot to match it.

set -euo pipefail

die() { echo "error: $*" >&2; exit 1; }
command -v ffmpeg >/dev/null || die "ffmpeg not found (brew install ffmpeg)"

[ $# -ge 2 ] || die "usage: $0 <input.mov> <output.gif> [--crop] [--width N]"

SRC="$1"; OUT="$2"; shift 2
[ -f "$SRC" ] || die "no such file: $SRC"

WIDTH=""          # empty = keep the cropped source resolution
FPS=12            # 12 is plenty for UI motion, roughly halves the size vs 24
DOCROP=0          # off by default: keep the frame as recorded
COLORS=192        # screen content is flat; 192 colours compresses well

# ---- find the real window bounds -------------------------------------------
CROP=""
if [ "$DOCROP" = "1" ]; then
  CROP=$(ffmpeg -i "$SRC" -vf "cropdetect=limit=24:round=2:reset=0" \
                -frames:v 200 -f null - 2>&1 \
         | grep -o 'crop=[0-9:]*' | tail -1 || true)
fi

# Two passes. A single-pass GIF uses a generic web palette and text turns to mush.
# stats_mode=diff weights the palette toward the pixels that actually change.
ffmpeg -y -v error -i "$SRC" \
  -vf "${CHAIN},palettegen=stats_mode=diff:max_colors=${COLORS}" "$PAL"

# bayer dithering keeps flat UI panels from developing noise; diff_mode=rectangle
# only rewrites the changed region of each frame, which shrinks the file a lot.
ffmpeg -y -v error -i "$SRC" -i "$PAL" \
  -lavfi "${CHAIN}[x];[x][1:v]paletteuse=dither=bayer:bayer_scale=5:diff_mode=rectangle" \
  -loop 0 "$OUT"

# ---- verify, do not assume --------------------------------------------------
#   Next: check the LAST frame. A GIF rests on its final frame every cycle, so a
#   recording that ends on an empty credentials form, an error state, or a
#   spinner will loop through that forever. Trim with --to if so.
</script>

<script type="text/plain" id="code-crd-checklayout">
#!/usr/bin/env python3
"""
check-layout.py — deterministic visual QA for a reading deck.

Renders the deck in headless Chrome, injects a measurement probe, and reports
pass/fail against numeric thresholds. Exits non-zero if any FAIL, so it can gate
a commit.

    ./check-layout.py deck.html                    # human report
    ./check-layout.py deck.html --json             # machine-readable
    ./check-layout.py deck.html --md storyline.md  # also check md<->html sync

WHY THIS EXISTS
Every check here corresponds to a defect that actually shipped in a real deck and
had to be caught by eye. Eyes miss these; arithmetic does not.

MEASUREMENT TRAPS THIS SCRIPT AVOIDS (learned the hard way):
  * Slides are transform:scale()d to fit the viewport. getBoundingClientRect()
    returns SCALED pixels and will silently give you nonsense (we once measured
    23 CPL on a line that was really 84).
  * .body is flex:1, so its scrollHeight always equals its own height. We
    measure the union of its CHILDREN's bounds instead.
  * Characters-per-line cannot be counted from the string: it depends on the
    font's average advance. We measure the advance by rendering the actual text
    in the actual computed font, then divide.
"""

# ----------------------------------------------------------------- thresholds
# Every number here is defensible; see reference/QA-STANDARDS.md for sources.
T = {
    "cpl_target_max": 75,     # Bringhurst 45-75 for a single column
    "cpl_hard_max": 80,       # WCAG 2.x SC 1.4.8 (AAA) ceiling for Latin script
    "cpl_min": 40,            # below this, too many return sweeps
    "type_scale_max": 6,      # distinct font sizes carrying text
    "bold_ratio_max": 0.16,   # share of body words in <strong>
    "bold_span_max": 5,       # words in one <strong>
    "orphan_min_frac": 0.25,  # last line of a block vs the measure
}
</script>

<script type="text/plain" id="md-cb-skill">
---
name: competitor-battlecards
description: Keep one falsifiable battlecard per competitor — claims, counters, and the proof for each.
allowed-tools: [serper]
---

# Competitor battlecards

A battlecard is the answer a rep gives in eight seconds when a prospect asks **"how
are you different from them"** — written so it still holds if that prospect forwards
it to the competitor.

That one constraint kills most of what usually ends up on these cards: adjectives
nobody can check, a gap they closed two quarters ago, pricing someone heard on a
call in March.

## When to write one

Write a card when a competitor has come up in **three deals in a quarter**. Below
that bar you are guessing, and a guessed card is worse than no card — because it
gets quoted.

Do not write cards for categories. One card, one competitor, one page.

---

## The order of work

### 1. Read the losses before you write anything

Open the last five closed-lost notes that name them. You are looking for the
sentence the **buyer** said, not the reason the rep logged.

> "They were already deployed in two other teams" is a real reason.
> "Price" almost never is — it is where the conversation stopped, not why.

If fewer than five losses mention them, say so on the card. A card built on two
deals is a hypothesis and should be labelled as one.

### 2. One claim, one source

Every line carries its source in brackets: a public page, a dated deal, or a
benchmark you can re-run. See `reference/PROOF-STANDARDS.md` for what counts.

A claim with no source does not go on the card. It goes to the open-questions
list at the bottom of `reference/OBJECTIONS.md`, where someone can go and settle it.

### 3. Write the counter, not the comeback

A counter concedes the true part first.

| Comeback | Counter |
|---|---|
| "They can't really do multi-region." | "They do multi-region, and it is genuinely good if you are already on their stack. It costs a second contract and a separate admin surface — here is what that looked like for [customer]." |
| "Their AI is a wrapper." | "Their assistant answers from the docs you upload. Ours answers from the systems you already run. The difference shows up the first time an answer needs live data." |

The comeback wins the room and loses the forward. Assume every card reaches the
competitor eventually — some prospect will paste it into an email.

### 4. Price and packaging get their own line

Never quote their price from memory. Quote the published page with the date you
read it, or write **"not published — ask the buyer what they were quoted."**
A wrong number here is the fastest way to lose a deal you were winning.

### 5. Kill anything you cannot prove

Last pass, out loud: read each line and say where it came from. Anything that
gets "I think someone said" comes off the card. Card length is not the goal.

---

## What a card must contain

| Section | Rule |
|---|---|
| Position, one line | What they are genuinely good at. Written by you, not by them. |
| Where they win | At least two. If you cannot name two, you have not read the losses. |
| Where we win | Each with a named deal or a benchmark. No adjectives. |
| Traps | The questions that make the difference visible, phrased for the buyer. |
| Price and packaging | Published numbers with a date, or nothing. |
| Open questions | What you could not settle. Visible, so it gets settled. |

Start from `template/battlecard.md`. Do not invent a new shape per competitor —
reps read across cards, and a different layout each time costs them the eight
seconds this whole thing is for.

## Refreshing

Refresh when a deal contradicts the card, not on a schedule. Calendar reviews of
untouched cards produce edits nobody needed and a diff nobody reads.

Run `scripts/link-check.py` before you share one — a dead source link is a claim
without proof, and it is the first thing a sharp buyer clicks.

## Non-negotiables

- Never write a claim you would not send to the competitor directly.
- Never list a gap without the date you checked it.
- One card per competitor. No "vs the market" cards.
- The open-questions section is never empty. If it is, you stopped looking.
</script>

<script type="text/plain" id="md-cb-readme">
# competitor-battlecards

One page per competitor: what they are good at, where we win, and the proof for
every line.

`SKILL.md` is the workflow. This file is where the cards live and who keeps them.

## Where cards live

    Skills/GTM/competitor-battlecards/cards/<competitor>.md

One file per competitor, lowercase, no dates in the filename — the file **is** the
current card and its history is the version history.

## Who keeps them

The card belongs to whoever last lost or won a deal against that competitor. Not
to marketing, not to a "competitive lead". The person who was in the room writes
the update; an owner of this skill reviews it.

## The three things people get wrong

1. **Writing the card from their website.** Their site says what they want to be
   true. The losses say what buyers experienced. Start from the losses.
2. **Treating a gap as permanent.** Every gap needs the date you checked it.
   Anything older than a quarter is a rumour with a timestamp.
3. **Making it long.** A rep reads this between two calls. Two screens, hard cap.

## Before you share a card outside GTM

Assume it will be forwarded. Read it once as if you were the competitor's
founder — if any line would make you write an angry correction, that line is a
liability, not an advantage.
</script>

<script type="text/plain" id="md-cb-proof">
# Proof standards

What counts as a source, ranked. A claim carries the highest tier available.

| Tier | What it is | How to cite it |
|---|---|---|
| **A** | A dated deal — won or lost — where the buyer said it | `[Acme, lost 12 Mar]` |
| **B** | A benchmark you can re-run, with the script in this folder | `[bench: latency, 4 Apr]` |
| **C** | Their own public page, quoted with the date you read it | `[their pricing page, 2 Jun]` |
| **D** | A third party — analyst, review site, changelog | `[G2, Q1 2026]` |
| — | Anything else | not a source |

## Rules

- **Tier A beats everything.** One buyer sentence is worth ten feature comparisons.
- **Never cite a review site for a capability claim.** Reviews are about experience,
  not about what a product can do. They are fine for "onboarding takes weeks".
- **Date every C and D.** Vendors ship. An undated claim about a competitor's
  product is a claim about last year's product.
- **A screenshot is not a source** unless it carries a URL and a date in the frame.

## Re-running a benchmark

Benchmarks go stale silently — that is what makes them dangerous. Any benchmark
older than one quarter is downgraded to tier D until it is re-run.

    scripts/link-check.py --benchmarks

Prints every benchmark cited across the cards with the date it was last run, and
exits 1 if any is older than 90 days.

## Open questions

Every card ends with what you could not settle. This is not an admission of
sloppiness — it is the queue. A card with no open questions has usually stopped
being maintained.
</script>

<script type="text/plain" id="md-cb-objections">
# The objection library

Objections that come up across competitors, and the honest answer to each. Cards
link here instead of repeating them.

## "You're newer / smaller"

True and not worth arguing. Answer with what smallness buys the buyer: the
person who wrote the thing is in the room, and the roadmap bends to them for the
first year. Then name a customer of comparable size and let them ask.

Never answer this with funding raised. Nobody buys software because the vendor
has money.

## "We already have something like this"

Ask what it does today, not what it was bought for. Most of these are a tool
somebody set up two years ago that now covers a third of the job. The question
that opens it: **"When it does not know something, what happens?"**

## "How do we know our data stays ours"

Answer with the mechanism, not the promise. Where it lives, who can read it,
what happens when the contract ends, and which of those is contractual versus
technical. A buyer who asks this has been burned and can tell the difference.

## "The AI will hallucinate"

Concede immediately — models do. Then explain what makes an answer checkable
here: every answer carries where it came from, and an answer with no source is
visibly an answer with no source.

## "Can we try it on our own data first"

Yes, and this is a buying signal. The trap is a pilot with no success criterion.
Write down before it starts what would make them say yes, and who decides.

---

## Open questions

- Nobody has a good answer yet for "what happens when the person who set this up
  leaves". Draft one, test it in two deals, then put it here.
- We still have no honest comparison on procurement time. Ask the last three
  buyers how long their side took.
</script>

<script type="text/plain" id="kb-invariant">
---
nodeType: "[[NodeType]]"
---

# Name

The invariant's short name — e.g. **"No App-Level Branch Ownership"**.

# Description

What this invariant protects, in one sentence. An Invariant is a project-specific
rule that must always hold for exactly one project. It is filed as a child node
under its project's folder.

A rule that applies to every project belongs in an [[ArchitecturePrinciple]] node
instead.

# Statement

The rule itself, phrased normatively and precisely enough that a reviewer can
decide whether a change violates it. Include the concrete exceptions if any exist
— an invariant with unstated exceptions produces false-positive findings.

# Rationale

Why the invariant exists: the failure mode it prevents, or the decision it locks
in. Reviewers use this to judge borderline cases in the spirit of the rule.

# Enforcement

How the rule is checked:

- `deterministic` — name the CI tool. Reviewers skip what it already guarantees.
- `review` — a human must actively check it.

# How To Verify

What a reviewer concretely looks at: which imports to inspect, which routes or
flows to trace, what to grep for. This is what turns the rule into a repeatable
check instead of a vibe.

> An invariant nobody can verify in under a minute will be skipped, and a rule
> that is skipped is not a rule.
</script>

<script type="text/plain" id="kb-readme">
# Knowledge base

This is the whole thing: every document your agents read, and every rule about
who may read it.

## How it is laid out

- **KnowledgeBase/** — what the company knows. Ontology node types live beside
  the knowledge that instantiates them.
- **Groups/** — the skills and tools each team gets automatically.
- **Data/** — generated tables and exports. Nothing here is hand-edited.
- **Dashboards/** — rendered views, regenerated by pipelines.
- **Agents/** and **Pipelines/** — what runs, and when.

## The one rule

A folder's `access.md` says who may read it. Access resolves **closeness-first**:
the nearest rule to a file wins, so a `deny` deep in the tree beats a grant at
the root. That is what makes a locked folder actually locked, even for admins.

## Editing

Every change is a change request against `main`. Nothing is edited in place —
you propose, someone with write access applies, and the version history keeps
both sides.
</script>

/* small markdown renderer for real KB files: headings, lists, checklists,
   fenced + indented code, tables, blockquotes, rules */
function mdRender(raw, keepH1){
  const HTML_COMMENT = new RegExp('<'+'!--[\\s\\S]*?--'+'>','g');   /* built dynamically — a literal one breaks HTML script parsing */
  let md = raw.replace(/^\s*---[\s\S]*?---\s*/,'').replace(HTML_COMMENT,'').trim();
  const lines = md.split('\n');
  let out=[], inCode=false, code=[], list=null, para=[], table=null, quote=null, ind=null;
  const inline = s => esc(s)
    .replace(/\[\[([^\]]+)\]\]/g,'<span class="wiki">$1</span>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/`([^`]+)`/g,'<code>$1</code>');
  const closeList = ()=>{ if(list){ out.push('</ul>'); list=null; } };
  const flushPara = ()=>{ if(para.length){ out.push('<p>'+inline(para.join(' '))+'</p>'); para=[]; } };
  const flushTable = ()=>{ if(table){ out.push('<div class="tablewrap"><table>'+table.join('')+'</table></div>'); table=null; } };
  const flushQuote = ()=>{ if(quote){ out.push('<blockquote>'+quote.map(inline).join('<br>')+'</blockquote>'); quote=null; } };
  const flushInd = ()=>{ if(ind){ out.push('<pre><code>'+esc(ind.join('\n'))+'</code></pre>'); ind=null; } };
  const flushAll = ()=>{ flushPara(); closeList(); flushTable(); flushQuote(); flushInd(); };
  for(const line of lines){
    if(line.trim().startsWith('```')){
      flushAll();
      if(!inCode){ inCode=true; code=[]; }
      else { out.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>'); inCode=false; }
      continue;
    }
    if(inCode){ code.push(line); continue; }
    if(!list && /^\s{4,}\S/.test(line) && !line.trim().startsWith('- ')){
      flushPara(); flushTable(); flushQuote();
      (ind ||= []).push(line.replace(/^\s{4}/,''));
      continue;
    }
    flushInd();
    const t = line.trim();
    if(!t){ flushAll(); continue; }
    if(t==='---'){ flushAll(); out.push('<hr>'); continue; }
    if(t.startsWith('|')){
      flushPara(); closeList(); flushQuote();
      if(/^[\s|:\-]+$/.test(t)) continue;                               /* separator row */
      const cells = t.replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>inline(c.trim()));
      const tag = table ? 'td' : 'th';
      (table ||= []).push('<tr>'+cells.map(c=>'<'+tag+'>'+(c||'&nbsp;')+'</'+tag+'>').join('')+'</tr>');
      continue;
    }
    flushTable();
    if(t.startsWith('> ') || t==='>'){
      flushPara(); closeList();
      (quote ||= []).push(t.replace(/^>\s?/,''));
      continue;
    }
    flushQuote();
    /* h1 is normally the page title, which the page already shows — skip it.
       KB ontology nodes are the exception: there every FIELD is an h1
       (`# Statement`, `# Rationale`), so dropping them would leave a document
       of unlabelled paragraphs. `keepH1` says which kind of file this is. */
    if(t.startsWith('# ')){ flushPara(); closeList();
      if(keepH1) out.push('<h2>'+inline(t.slice(2))+'</h2>');
      continue; }
    if(t.startsWith('## ')){ flushPara(); closeList(); out.push('<h2>'+inline(t.slice(3))+'</h2>'); continue; }
    if(t.startsWith('### ')){ flushPara(); closeList(); out.push('<h3>'+inline(t.slice(4))+'</h3>'); continue; }
    if(t.startsWith('- [ ]')){
      flushPara(); if(!list){ out.push('<ul>'); list='ul'; }
      out.push('<li class="check"><span class="cb"></span><span>'+inline(t.slice(5).trim())+'</span></li>'); continue;
    }
    if(t.startsWith('- ')){
      flushPara(); if(!list){ out.push('<ul>'); list='ul'; }
      out.push('<li>'+inline(t.slice(2))+'</li>'); continue;
    }
    if(list && /^\s{2,}/.test(line)){
      const last = out[out.length-1];
      out[out.length-1] = last.endsWith('</span></li>')
        ? last.replace(/<\/span><\/li>$/,' '+inline(t)+'</span></li>')
        : last.replace(/<\/li>$/,' '+inline(t)+'</li>');
      continue;
    }
    para.push(t);
  }
  flushAll();
  return out.join('\n');
}

const fmOf = raw => {
  const m = /^\s*---\r?\n([\s\S]*?)\r?\n---/.exec(raw||''); if(!m) return null;
  const fm = {};
  m[1].split('\n').forEach(l=>{ const k = /^([a-zA-Z-]+):\s*(.*)$/.exec(l); if(k) fm[k[1]] = k[2].trim(); });
  return fm;
};
const fmList = v => String(v||'').replace(/^\[|\]$/g,'').split(',')
  .map(x=>x.trim().replace(/^['"]|['"]$/g,'')).filter(Boolean);
function skillTools(s){
  if(!s) return [];
  const f = (SKILL_FILES[s.id]||[]).find(x=>x.id==='main');
  const fm = f && f.mdId ? fmOf(docText(f.mdId)) : null;
  return fm && fm['allowed-tools']!==undefined ? fmList(fm['allowed-tools']) : (s.tools||[]);
}

function fileDoc(s, f){
  if(f.stub) return '<p>'+esc(f.file)+' · '+esc(f.stub)+' — not loaded in this prototype. The full file lives in the knowledge base.</p>';
  if(f.codeId) return '<pre><code>'+esc(docText(f.codeId).trim())+'</code></pre>'+(f.excerpt?exNote(f):'');
  if(f.mdId) return mdRender(docText(f.mdId))+(f.excerpt?exNote(f):'');
  const sk = f.inline;
  return sk.md ? mdRender(docText(sk.md))
    : '<ol>'+sk.instr.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ol>'+(sk.note?'<p class="note">'+esc(sk.note)+'</p>':'');
}
/* the source files wrap lines; match a passage regardless of where the breaks fall */
const rxEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const findRx = old => new RegExp(rxEsc(old).replace(/\s+/g,'\\s+'));
const fileText = (s,f) => (f.mdId||f.codeId) ? docText(f.mdId||f.codeId)
  : f.inline ? (f.inline.md ? docText(f.inline.md) : f.inline.instr.join('\n')) : '';
/* the file moved on since this was written — the hunk no longer lands anywhere */
const crConflicted = c => {
  const s = skillById(c.skill), files = skillFiles(s);
  return c.status==='open' && c.hunks.some(h=>{
    const f = files.find(x=>x.id===h.file);
    return !f || f.stub || !findRx(h.old).test(fileText(s,f));
  });
};
const conflictPrompt = c => 'Resolve the conflict on the change request “'+c.title+'” for the skill '+skillById(c.skill).name+' and submit the updated version for review.';
function applyHunk(sk, h){
  const f = skillFiles(sk).find(x=>x.id===h.file) || skillFiles(sk)[0];
  const id = f.mdId || f.codeId || (f.inline && f.inline.md);
  if(id){
    const cur = docText(id), rx = findRx(h.old);
    if(!rx.test(cur)) return false;
    PATCH[id] = cur.replace(rx, h.neu);
    return true;
  }
  if(sk.instr){
    const i = sk.instr.indexOf(h.old);
    if(i<0) return false;
    sk.instr[i] = h.neu;
    return true;
  }
  return false;
}

  if(inSp.length) h += '<div class="h4" style="margin-top:30px">Subscriptions you’re in<span class="cap">'+inSp.length+'</span>'+
    '<button class="filt" data-newspace title="New subscription" aria-label="New subscription">+</button></div><div class="rows">'+
    inSp.map(sp=>row({ t:sp.name, a:'data-space="'+sp.id+'"', tag:isSpaceAdmin(sp)?'Owner':'',
      d:sp.size+' people · run by '+sp.admins.map(x=>personById(x).name).join(', '),
      m:skillsOf(sp), x:wait(spaceAttention(sp)) })).join('')+'</div>';

  if(locked.length) h += '<div class="h4" style="margin-top:30px">Ask to subscribe<span class="cap">'+locked.length+'</span></div><div class="rows">'+
    locked.map(sp=>row({ t:sp.name, a:'data-space="'+sp.id+'"',
      d:sp.size+' people · run by '+sp.admins.map(x=>personById(x).name).join(', '),
      m:skillsOf(sp),
      x:hasRequested(sp.id)?'<span>Requested</span>':'<span>'+LOCK_SVG+'</span>' })).join('')+'</div>';
  return h;
}

/* just you — the sign-ins only you can set, and the skills no space carries.

   Built exactly like a subscription page, because it is one: the same trail,
   the same title row with the same three actions, the same two bands under the
   same two words. It used to be its own dialect — a bare "Add skills or tools"
   button under the heading, a count that explained itself ("3 — only you have
   these"), and "Integrations" where every other page says "Tools". Three ways
   of saying the same thing is three things to learn. */
function renderPersonal(){

     "Just you" was the title again, in smaller type */

  h += '<div class="h4 quiet" style="margin-top:34px">Tools<span class="cap">'+TOOLS.length+'</span></div>'+toolTiles();

/* the files panel — a skill is a folder, always shown as one, even with a single file */
/* the folder, always — opt.touched overrides which files get the yellow dot
   (open change requests on the page; the version's own change inside history) */
function filesPanel(s, files, af, opt){
  const o = opt || {};
  const touched = o.touched || new Set(openCRs(s.id).flatMap(c=>c.hunks.map(h=>h.file)));
  const allNew = !!o.allNew;   /* nothing to mark against — the whole folder is the change */
  const attr = o.attr || 'data-ftab';
  const groups = [], gmap = {};
  files.forEach(f=>{
    const i = f.file.indexOf('/');
    const dir = i<0 ? '' : f.file.slice(0, i+1);
    if(!gmap[dir]){ gmap[dir] = { dir, rows:[] }; groups.push(gmap[dir]); }
    gmap[dir].rows.push(f);
  });
  const frow = (f, dir) =>
    '<button class="frow'+(f.id===af.id?' on':'')+(dir?' sub':'')+(allNew?' isnew':'')+'" '+attr+'="'+f.id+'">'+
    '<span class="fn">'+esc(dir ? f.file.slice(dir.length) : f.file)+'</span>'+
    (f.id==='main'?'<span class="tag">Main</span>':'')+
    (!allNew && touched.has(f.id)?'<span class="fdot"></span>':'')+
    '<span class="fs">'+esc(fsize(f))+'</span></button>';
  return '<div class="h4" style="margin-top:'+(o.top||'26px')+'">Files<span class="cap">'+files.length+'</span></div>'+
    '<div class="files">'+groups.map(g=>
      (g.dir?'<div class="fdir">'+esc(g.dir)+'</div>':'')+g.rows.map(f=>frow(f, g.dir)).join('')
    ).join('')+'</div>';
}

/* ————— version history: one panel over the app — the version on the left, the list on the right ————— */
const verSrcCR = (sid, vv) => CRS.find(c=>c.status==='applied' && c.skill===sid && c.to===vv);
/* what that version changed, marked in the file itself: red struck out, green added */
function diffDoc(s, f, hunks){
  const id = f.mdId || f.codeId || (f.inline && f.inline.md);
  let raw = id ? docText(id)
    : (f.inline && f.inline.instr ? f.inline.instr.map((x,i)=>(i+1)+'. '+x).join('\n\n') : null);
  if(raw===null) return fileDoc(s, f);
  const marks = [];
  hunks.forEach((x,k)=>{
    /* applied: the new text is in the file. Open: only the old text is. */
    let rx = x.neu ? findRx(x.neu) : null;
    if(!rx || !rx.test(raw)) rx = x.old ? findRx(x.old) : null;
    if(!rx || !rx.test(raw)) return;
    const S = String.fromCharCode(0xE100+k);
    raw = raw.replace(rx, S);
    marks.push({ S, old:x.old, neu:x.neu });
  });
  let html = f.codeId ? '<pre><code>'+esc(raw.trim())+'</code></pre>' : mdRender(raw);
  marks.forEach(m=>{
    html = html.replace(m.S,
      (m.old ? '<mark class="wdel">'+esc(norm(m.old))+'</mark> ' : '')+
      (m.neu ? '<mark class="wins">'+esc(norm(m.neu))+'</mark>' : ''));
  });
  return html;
}
/* the panel: the selected version rendered on the left, every version on the right */
function vovHtml(){
  const s = skillById(state.skill); if(!s) return '';
  const v = ver(s.id), files = skillFiles(s);

  const src = verSrcCR(s.id, x.v);
  const isOwner = acc(s.id).owners.includes(state.user);
  /* the files this version touched — dotted in the list, and where it opens */
  const touched = new Set(src ? src.hunks.map(h=>h.file) : []);
  const f = files.find(y=>y.id===state.vfile) || files.find(y=>touched.has(y.id)) || files[0];
  const mine = src ? src.hunks.filter(k=>k.file===f.id) : [];

  const doc = '<div class="vovtop">'+
      '<div class="vovname">'+esc(s.name)+'</div>'+
      '<div class="vovcap">'+esc(f.file)+' · '+esc(x.v)+' · '+esc(x.when)+' · '+esc(personById(x.by).name)+
        (mine.length ? ' · what changed is marked'
          : touched.size ? ' · not changed in this version'
          : ' · no change request on file — showing the text as it stands today')+'</div>'+
    '</div>'+
    '<div class="vovbody"><div class="doc">'+
      (mine.length ? diffDoc(s, f, mine) : fileDoc(s, f))+
    '</div></div>';

  const rows = v.history.map((y,i)=>
    '<button class="vrow" data-vsel="'+i+'" aria-current="'+(state.vsel===i)+'">'+
    '<span class="vt">'+esc(y.v)+(i===0?' · current':'')+'</span>'+
    '<span class="vs">'+esc(y.when)+' · '+esc(personById(y.by).name)+'</span>'+
    '<span class="vn">'+esc(y.note)+'</span></button>').join('');

  const foot = state.vsel===0
    ? '<span class="rfn">This is what every agent uses today.</span>'
    : isOwner
      ? '<span class="rfn">Restoring makes '+esc(x.v)+' current again.</span>'+
        '<button class="btn small primary" data-restore>Restore</button>'
      : '<span class="rfn">'+esc(acc(s.id).owners.map(o=>personById(o).name.split(' ')[0]).join(' or '))+
        ' can restore this version.</span>';

  return '<div class="vovcard">'+
    '<div class="vovfiles">'+filesPanel(s, files, f, { touched, attr:'data-vfile', top:'0' })+'</div>'+
    '<div class="vovmain">'+doc+'</div>'+
    '<aside class="vovrail">'+
      '<div class="vovrh">Version history<button class="x" data-vclose title="Close">✕</button></div>'+
      '<div class="vovrows">'+rows+'</div>'+
      '<div class="vovrf">'+foot+'</div>'+
    '</aside></div>';
}

const GROUP_PATH = { gtm:'Skills/GTM', org:'Skills/Organization', general:'Skills/General', eng:'Skills/Engineering' };
function fsize(f){
  if(f.stub) return f.stub;
  if(f.excerpt) return f.excerpt;
  const id = f.mdId || f.codeId || (f.inline && f.inline.md);
  const n = id ? docText(id).length
    : (f.inline && f.inline.instr) ? f.inline.instr.join(' ').length + (f.inline.note||'').length : 0;
  return n ? Math.max(1, Math.round(n/1024))+' KB' : '';
}

  /* yours first, then a gap, then the ones you'd have to ask for */
  const srow = sp => {
    const member = sp.members.includes(state.user);
    const att = member ? spaceAttention(sp) : 0;
    const right = !member ? '<span class="n">'+LOCK_SVG+'</span>'
      : att ? '<span class="pending">'+att+'</span>'
      : cnt(sp.skills.length);
    return '<button data-space="'+sp.id+'" aria-current="'+(cur===sp.id)+'">'+
      '<span>'+esc(sp.name)+(isSpaceAdmin(sp)?'<span class="otag">Owner</span>':'')+'</span>'+right+'</button>';
  };
  const inSp = SPACES.filter(sp=>sp.members.includes(state.user));
  const locked = SPACES.filter(sp=>!sp.members.includes(state.user));
  h += inSp.map(srow).join('');
  if(locked.length) h += '<div class="navgap"></div>'+locked.map(srow).join('');
  h += '</nav>';
  /* No profile block down here any more: you live in the top bar, in one
     button, on both surfaces. */
  return h+'</div>';
}

/* A place's own actions, beside its name — the same three on every one of
   them, the way a Knowledge page carries its own.

   Everyone sees all three, and they do the same thing for everyone. There is
   ONE way to put a skill somewhere: you add it. There used to be two — owners
   "added", everyone else "proposed" — which meant the same button in the same
   spot opened a different flow with different words depending on who pressed
   it, and the person who taught you the app could not tell you what you would
   see. Who reviews what is a property of the subscription, not of the door.

   Weight follows stakes. Share is bounded because it is the only action here
   with a consequence for other people; + is an icon because it is frequent and
   reversible; the rest live behind ⋯. No chevron on Share, unlike a Knowledge
   page: a file can be shared at two scopes (itself, or its folder), a place
   has exactly one thing to share.

   The ⋯ is the one part that varies, because its items are about YOUR
   relationship to the place: an owner can delete it, a member can leave it,
   and neither is true of your own list — you cannot resign from yourself. */
function spaceActs(sp, admin){
  return '<span class="pageacts">'+
    '<span class="actwrap only">'+
      '<button class="actbtn" data-sharesheet="'+sp.id+'">'+PEOPLE_SVG+'Share</button></span>'+
    '<button class="tbicon" data-add="'+sp.id+'" title="Add a skill or tool" aria-label="Add a skill or tool">'+I_PLUS+'</button>'+
    dotsHtml(
      mi('data-splink="'+sp.id+'"', I_LINK, 'Copy link')+
      (sp.personal ? ''
        : admin ? mi('class="del" data-delspace="'+sp.id+'"', I_TRASH, 'Delete subscription')
                : mi('data-leavespace="'+sp.id+'"', I_OUT, 'Leave this subscription')))+
    '</span>';
}

function renderSpace(sp){
  const admin = isSpaceAdmin(sp);
  const member = sp.members.includes(state.user);
  const admNames = sp.admins.map(x=>personById(x).name).join(', ');

  /* a space you're not in — visible, locked, requestable */

    return '<div class="toprow">'+crumbs([ROOT, { t:sp.name, menu:placesMenu(sp.id) }])+'</div>'+
      '<div class="item-title"><h1>'+esc(sp.name)+'</h1><span class="pill team" style="display:inline-flex;align-items:center;gap:5px">'+LOCK_SVG+' Locked</span></div>'+
      '<p class="lede">'+sp.size+' people · run by '+esc(admNames)+'</p>'+
      '<p class="lede" style="margin-top:6px">'+sp.skills.length+' skills · '+sp.tools.length+' tools — visible to members only.</p>'+
      (hasRequested(sp.id)
        ? '<div class="verdict back" style="max-width:440px;margin-top:20px">Requested — '+esc(admNames)+' decides who joins.</div>'
        : '<div style="margin-top:20px"><button class="btn primary" data-reqaccess="'+sp.id+'">Subscribe to its skills and tools</button></div>');
  }

  const pend = spacePending(sp.id);
  let h = '<div class="toprow">'+crumbs([ROOT, { t:sp.name, menu:placesMenu(sp.id) }])+'</div>'+
    '<div class="item-title"><h1>'+esc(sp.name)+'</h1>'+spaceActs(sp, admin)+'</div>';

  /* in a space, "needs you" is setup: a skill whose tool you haven't connected,
     plus anything waiting for your review */
  const blocked = sp.skills.filter(sid=>{ const s = skillById(sid); return s && blockedBy(s).length; });
  const needN = blocked.length + (admin?pend.length:0);
  const shown = state.filter ? blocked : sp.skills;
  h += '<div class="h4 quiet" style="margin-top:30px">Skills<span class="cap">'+
    (sp.skills.length+(admin?pend.length:0))+'</span>'+(needN?filterBtn():'')+refreshBtn()+'</div>';
  h += '<div class="grid">'+
    (admin ? pend.map(p=>
      '<div class="card pend" role="button" tabindex="0" data-pending="'+p.id+'">'+
        '<span class="t">'+esc(p.skill.name)+'</span>'+
        '<span class="d">'+esc(p.skill.desc)+'</span>'+
        '<span class="foot"><span class="rdot wait"></span><span class="r-wait">Waiting for your review</span>'+
        '</span></div>').join('') : '')+
    shown.map(sid=>{
      const s = skillById(sid); if(!s) return '';
      const own = acc(sid).owners.includes(state.user);
      /* a space tile's yellow is "this won't run for you yet", not "someone wants a change" */
      const blocked = blockedBy(s);
      return '<div class="card" role="button" tabindex="0" data-'+(own?'skill':'doc')+'="'+sid+'">'+
        '<span class="t">'+esc(s.name)+'</span>'+
        '<span class="d">'+esc(s.desc)+'</span>'+
        '<span class="foot">'+
        (blocked.length?'<span class="rdot wait"></span><span class="r-wait">Needs '+
          esc(blocked.map(t=>t.name).join(' and '))+'</span>':'')+
        '<span class="ver">'+esc(ver(sid).v)+'</span></span></div>';
    }).join('')+'</div>';
  if(!sp.skills.length && !(admin&&pend.length))
    h += '<div class="empty">No skills yet. Add one, or ask your agent to write one for '+esc(sp.name)+'.</div>';

  h += '<div class="h4 quiet" style="margin-top:34px">Tools<span class="cap">'+sp.tools.length+'</span></div>';
  h += '<div class="grid">'+sp.tools.map(tid=>{

      '<span class="t">'+logoHtml(t)+esc(t.name)+'</span>'+

      '<span class="foot">'+foot+'</span></div>';
  }).join('')+'</div>';
  if(!sp.tools.length) h += '<div class="empty">No tools yet.</div>';
  return h;
}

      '<span>'+esc(p.when)+'</span><span class="sep">·</span><span>new · 1.0.0</span>'+

    '<div class="why">'+esc(p.why)+'</div>'+

      '<div class="crview"><div class="vovcap">'+esc(af.file)+' · new — there’s nothing current to compare it against</div>'+
        '<div class="crdoc"><div class="doc">'+fileDoc(s, af)+'</div></div>'+
      '</div></div>';
  h += '<div class="crtail">';
  if(p.status==='sent-back'){
    const rv = p.verdictBy ? personById(p.verdictBy) : personById(sp.admins[0]);
    h += '<div class="verdict back">'+(p.by===state.user
      ? esc(rv.name)+' sent this back — revise it and ask again.'
      : (p.verdictBy===state.user ? 'You' : esc(rv.name))+' sent this back to '+esc(a.name.split(' ')[0])+'. They can revise it and ask again.')+'</div>';
    if(p.reason) h += '<div class="why" style="margin-top:10px">'+esc(rv.name.split(' ')[0])+': “'+esc(p.reason)+'”</div>';
  }

  else if(p.by===state.user)
    h += '<div class="verdict back">Your proposal. '+esc(sp.admins.map(x=>personById(x).name).join(', '))+' decides what joins '+esc(sp.name)+'.</div>';
  else
    h += '<div class="verdict back">Waiting on '+esc(sp.admins.map(x=>personById(x).name).join(', '))+' to review.</div>';
  return h+'</div></div>';
}

/* =========================================================
   A change request — the proposed next version
   ========================================================= */
/* the words that actually differ, so the eye lands on them and not the sentence */
function wordDiff(a, b){
  const A = norm(a).split(' '), B = norm(b).split(' ');
  let s = 0;
  while(s < A.length && s < B.length && A[s] === B[s]) s++;
  let e = 0;
  while(e < A.length-s && e < B.length-s && A[A.length-1-e] === B[B.length-1-e]) e++;
  return { pre:A.slice(0,s).join(' '), aMid:A.slice(s, A.length-e).join(' '),
           bMid:B.slice(s, B.length-e).join(' '), post:A.slice(A.length-e).join(' ') };
}
const rawOf = (s, f) => {
  const id = f.mdId || f.codeId || (f.inline && f.inline.md);
  if(id) return docText(id);
  return (f.inline && f.inline.instr) ? f.inline.instr.map((x,i)=>(i+1)+'. '+x).join('\n\n') : '';
};
/* a block is what a reader sees as one thing: a paragraph, or a single list item —
   splitting only on blank lines would put a whole list on both sides of the diff */
function blocksOf(raw){
  const out = [];
  raw.split(/\n{2,}/).forEach(p=>{
    if(/^\s*(?:[-*+]\s|\d+\.\s)/m.test(p)) p.split(/\n(?=\s*(?:[-*+]\s|\d+\.\s))/).forEach(x=>out.push(x));
    else out.push(p);
  });
  return out.filter(t=>t.trim());
}

function renderCR(c){
  const s = skillById(c.skill), p = personById(c.by), v = ver(s.id);
  const owners = acc(s.id).owners;
  const mine = owners.includes(state.user);
  const canReview = mine && c.by !== state.user;      /* a co-owner can’t confirm their own request */
  const reviewer = personById(owners.find(o=>o!==c.by) || owners[0]);
  const conflict = crConflicted(c);
  const applied = c.status==='applied';
  const files = skillFiles(s);
  const touched = []; c.hunks.forEach(x=>{ if(!touched.includes(x.file)) touched.push(x.file); });
  if(!files.some(f=>f.id===state.crFile)) state.crFile = touched[0];
  const af = files.find(f=>f.id===state.crFile) || files[0];
  const fh = c.hunks.filter(x=>x.file===state.crFile);
  const others = files.length - touched.length;
  /* count passages, not source lines — the files hard-wrap, which would inflate this */
  const lines = t => t ? norm(t).split('\n').length : 0;
  const plus = c.hunks.reduce((n,x)=>n+lines(x.neu), 0);
  const minus = c.hunks.reduce((n,x)=>n+lines(x.old), 0);

  let h = '<div class="toprow">'+crumbs(skillTrail(s, { t:'Change request', menu:allCRs(s.id).map(x=>({ t:x.title, a:'data-cr="'+x.id+'"', on:x.id===c.id })) }))+'</div>'+
    '<div class="crv">'+
    '<h1>'+esc(c.title)+'</h1>'+
    '<div class="crmeta">'+avHtml(p)+'<span>'+esc(p.name)+'</span><span class="sep">·</span>'+
      '<span>'+esc(c.when)+'</span><span class="sep">·</span>'+
      '<span>'+esc(v.v)+' → '+esc(c.to)+'</span>'+
      (c.status==='sent-back'?'<span class="pill wait">Sent back</span>':'')+
      (applied?'<span class="pill ok">Applied</span>':'')+
      (c.status==='withdrawn'?'<span class="pill">Withdrawn</span>':'')+'</div>'+
    '<div class="why">'+esc(c.why)+'</div>';

  if(conflict){
    /* no honest comparison exists — say so, name the version it was written against */
    h += '<div class="nodiff"><span class="nb">Can’t compare</span>'+
      '<span>'+esc(af.file)+' changed after '+esc(p.name.split(' ')[0])+' wrote this against '+esc(v.v)+
      ', so there is no honest before and after to show. Rebasing it on the current file is the fix.</span></div>'+
      '<div class="scale">What '+esc(p.name.split(' ')[0])+' proposed</div>'+
      '<div class="diffwrap"><div class="dline del"><span class="g">−</span><div class="dtext">'+esc(c.hunks[0].old)+'</div></div>'+
      '<div class="dline ins"><span class="g">+</span><div class="dtext">'+esc(c.hunks[0].neu)+'</div></div></div>';
  } else {
    h += '<div class="scale">'+touched.length+' file'+(touched.length>1?'s':'')+' · '+
      '<span class="plus">+'+plus+'</span> <span class="minus">−'+minus+'</span></div>';
    /* the folder on the left, the file with the change marked in it on the right —
       the same reading as version history */
    h += '<div class="crbody">'+
      '<div class="crfiles">'+filesPanel(s, files, af, { touched:new Set(touched), attr:'data-crfile', top:'0' })+'</div>'+
      '<div class="crview"><div class="vovcap">'+esc(af.file)+
          (fh.length ? ' · what changes is marked' : ' · not touched by this request')+'</div>'+
        '<div class="crdoc"><div class="doc">'+(fh.length ? diffDoc(s, af, fh) : fileDoc(s, af))+'</div></div>'+
      '</div></div>';
  }

  h += '<div class="crtail">';
  if(c.status==='withdrawn')
    h += '<div class="verdict back">'+(c.by===state.user?'You withdrew this request.':esc(p.name.split(' ')[0])+' withdrew this request.')+' Nothing changed for anyone.</div>';
  else if(c.status==='applied')
    h += '<div class="verdict ok">You applied this on '+esc(c.appliedWhen||'today')+' — it is version '+esc(c.to)+' for everyone.</div>';
  else if(c.status==='sent-back'){
    const rv = c.verdictBy ? personById(c.verdictBy) : reviewer;
    h += '<div class="verdict back">'+(c.by===state.user
      ? esc(rv.name)+' sent this back — revise it and ask again.'
      : (c.verdictBy===state.user ? 'You' : esc(rv.name))+' sent this back to '+esc(p.name.split(' ')[0])+'. They can revise it and ask again.')+'</div>';
    if(c.reason) h += '<div class="why" style="margin-top:10px">'+esc(rv.name.split(' ')[0])+': “'+esc(c.reason)+'”</div>';
  }
  else if(canReview){
    h += conflict
      ? '<div class="cractions"><button class="btn primary" data-sendback="'+c.id+'">Send back to rebase</button>'+
        '<button class="btn" data-copy="'+esc(conflictPrompt(c))+'">Copy the instruction</button></div>'+
        '<p class="consq">Nothing changes for anyone until '+esc(p.name.split(' ')[0])+' sends it again against '+esc(v.v)+'.</p>'
      : '<div class="cractions"><button class="btn primary" data-apply="'+c.id+'">Apply as '+esc(c.to)+'</button>'+
        '<button class="btn" data-sendback="'+c.id+'">Send back with a note</button></div>'+
        '<p class="consq">Every agent that connects after this picks up '+esc(c.to)+'. There’s no staged rollout.</p>';
  }
  else if(c.by===state.user)
    h += '<div class="verdict back">This is your request. '+esc(reviewer.name)+' reviews it — you can’t apply your own.</div>'+
      '<div style="margin-top:10px"><button class="btn tiny quiet" data-withdraw="'+c.id+'" style="padding-left:0">Withdraw this request</button></div>';
  else
    h += '<div class="verdict back">Waiting on '+esc(reviewer.name)+' to review.</div>';

  return h+'</div></div>';
}

const minePrompt = 'Help me build a skill or tool for myself at Bevel. Ask me what it should do, draft it, and add it to my own list — it stays mine until I propose it to a subscription.';

/* A folder you cannot read is simply not in this tree.
   The Skills sidebar lists locked GROUPS on purpose — a group is a place you
   might ask to join, so naming it is the invitation. A file tree is not that:
   it is the map of what you can open, and rows that refuse to open are noise
   in the one list that should be entirely actionable. */

const kbf = p => KBF.find(f=>f.p===p);
const kbName = p => p.split('/').pop();
const kbOpenDir = d => state.kbOpen.includes(d);

/* Build the nested shape from flat paths — the same thing the file API returns. */
function kbTree(){
  const root = { dirs:new Map(), files:[] };
  const dirAt = path => {
    let node = root, sofar = '';
    for(const seg of path.split('/')){
      sofar = sofar ? sofar+'/'+seg : seg;
      if(!node.dirs.has(seg)) node.dirs.set(seg, { name:seg, path:sofar, dirs:new Map(), files:[] });
      node = node.dirs.get(seg);
    }
    return node;
  };
  KBF.forEach(f=>{
    const i = f.p.lastIndexOf('/');
    (i<0 ? root : dirAt(f.p.slice(0,i))).files.push(f);
  });
  return root;
}

/* Names and one caret, nothing else.

   The folder icon was saying "this is a folder" next to a caret that already
   said it, and the file icons were saying "this is a table" next to a name
   ending in `.csv`. Both were decoration standing in the place where the name
   should start. The caret earns its slot because it is the only thing here you
   can act on — and a folder with nothing in it doesn't get one, because there
   is nothing to open. */
function kbRowsHtml(node, depth){
  const pad = () => 'style="padding-left:'+(10 + depth*13)+'px"';
  let h = '';
  [...node.dirs.values()].forEach(d=>{
    const open = kbOpenDir(d.path);
    const kids = d.dirs.size + d.files.length;
    h += '<button class="trow'+(open?' open':'')+'" '+pad()+' data-kbdir="'+esc(d.path)+'" aria-expanded="'+open+'">'+
      '<span class="tw">'+(kids?I_CARET:'')+'</span>'+
      '<span class="tn">'+esc(d.name)+'</span></button>';
    if(open) h += '<div class="tkids">'+kbRowsHtml(d, depth+1)+'</div>';
  });
  /* the empty caret slot is what keeps a file's name in line with its
     siblings' — the indent is the tree, so it has to survive the icon */
  node.files.forEach(f=>{
    h += '<button class="trow" '+pad()+' data-kbfile="'+esc(f.p)+'" aria-current="'+(state.kbFile===f.p)+'">'+
      '<span class="tw"></span>'+
      '<span class="tn">'+esc(kbName(f.p))+'</span>'+
      (f.cr?'<span class="tdot" title="Open change request"></span>':'')+'</button>';
  });
  return h;
}

/* The Knowledge sidebar: which branch you stand on, then the tree. */
function kbSideHtml(){
  let h = '<div class="side-inner" style="width:'+state.sideW+'px">';
  h += '<div class="tree">'+kbRowsHtml(kbTree(), 0)+'</div>';
  h += crDockHtml();
  return h+'</div>';
}

/* =========================================================
   Who can read this — the same sheet for a file and a folder.

   Access in the KB is a property of a PATH, and it inherits: what you grant
   on a folder is what everything inside it gets. That is the whole reason
   this sheet says which rule it is editing and where a grant came from — an
   access dialog that hides inheritance teaches people to grant twice.
   ========================================================= */
function kbAccessModal(path){
  state.accPath = path;               /* so a group toggle can re-render the sheet */
  const isDir = !kbf(path);
  const name = kbName(path);
  const thing = isDir ? 'folder' : 'file';
  /* The folders above this path that grant something, nearest last. Real
     inheritance walks the whole ancestry; the shape is what matters here. */
  const segs = path.split('/');
  const root = segs[0];
  const gran = segs.length>2 ? segs.slice(0, segs.length-1).join('/') : null;
  const inherited = [
    { folder:root, people:[['Everyone','Every signed-in person'],['Juan Viera','juan@bevel.software']] },
  ];
  if(gran) inherited.push({ folder:gran, people:[['Engineering','8 people']] });

  const person = (label, sub, right) =>
    '<div class="acc-row"><span class="logo"><span class="mg">'+esc(label[0])+'</span></span>'+

/* =========================================================

function renderKb(){

  h += '<div class="item-grid'+(state.kbRail?'':' solo')+'"><article>';
  /* The actions live ON the page, beside its name: copy it, edit it, and the
     rest behind the ⋯ where things you use monthly belong. */
  /* Share is the bounded button because it is the one action with a
     consequence for other people; copy and edit are icons — frequent, private,
     and instantly reversible. Weight follows stakes, not frequency. */
  h += '<div class="item-title"><h1>'+esc(kbName(f.p).replace(/\.(md|csv|gif)$/,''))+'</h1>'+
    '<span class="pageacts">'+
      '<span class="actwrap">'+
        '<button class="actbtn" data-kbshare="'+esc(f.p)+'">'+PEOPLE_SVG+'Share</button>'+
        '<button class="actchev" data-sharemenu aria-expanded="'+(!!state.sharemenu)+'" aria-haspopup="menu" aria-label="More sharing options">'+

        (state.sharemenu ? '<div class="actmenu" role="menu">'+
          mi('data-kbshare="'+esc(f.p)+'"', PEOPLE_SVG, 'Manage access…')+
          mi('data-kblink="'+esc(f.p)+'"', I_LINK, 'Copy link to this page')+
          mi('data-kbshare="'+esc(parentOf(f.p) || f.p)+'"', I_FOLDER, 'Share the whole folder')+
        '</div>' : '')+
      '</span>'+
      '<button class="tbicon" data-copypage title="Copy page as Markdown" aria-label="Copy page as Markdown">'+I_COPY+'</button>'+
      '<button class="tbicon" data-kbedit title="Edit this file" aria-label="Edit this file">'+I_EDIT+'</button>'+
      dotsHtml(
        mi('data-rail', I_INFO, state.kbRail?'Hide file details':'File details')+
        mi('data-vhist', I_CLOCK, 'Version history')+
        mi('data-kbraw', I_CODE, 'View raw file')+
        mi('data-copypath="'+esc(f.p)+'"', I_LINK, 'Copy path'))+
    '</span></div>';

  if(f.cr) h += '<div class="panel" style="margin-top:14px;background:var(--wait-soft);border-color:transparent">'+
    '<div class="ph">Open change request</div>'+
    '<div style="font-size:13px;color:var(--ink2);margin-top:2px">Ali proposed tightening the enforcement wording. '+

function kbTabsHtml(){
  if(!state.kbTabs.length) return '';
  return '<div class="kbtabs" role="tablist">'+state.kbTabs.map(p=>{
    const f = kbf(p); if(!f) return '';
    return '<button class="kbtab" data-kbfile="'+esc(p)+'" aria-current="'+(state.kbFile===p)+'" role="tab">'+
      (f.cr?'<span class="tdirty"></span>':'')+
      '<span>'+esc(kbName(p))+'</span>'+
      '<span class="x" data-kbclose="'+esc(p)+'" role="button" aria-label="Close '+esc(kbName(p))+'">'+I_X+'</span></button>';
  }).join('')+'</div>';
}

/* One renderer per kind — the viewer's whole job is saying what a file MEANS. */
function kbBody(f){
  if(f.kind==='csv')  return kbTableHtml(f);
  if(f.kind==='img')  return '<div class="kbimg"><span class="ph">'+I_IMG+'</span>'+
    '<span>'+esc(kbName(f.p))+' — 1240 × 720</span></div>'+
    '<div class="kbfoot">Images render as themselves. The viewer never shows you base64 and calls it a file.</div>';
  return '<div class="doc">'+mdRender(docText(f.mdId||'kb-readme'), !!f.h1fields)+'</div>';
}

const CLICKS = {
  'data-app': b=>{
    const id = b.getAttribute('data-app');
    state.app = id; state.appmenu = false;
    if(id==='kb'){ state.view = 'kb'; }
    else { state.view = 'home'; state.skill=null; state.cr=null; state.space=null; }
    render(); window.scrollTo({top:0});
  },
  'data-appmenu': ()=>{ state.appmenu = !state.appmenu; render(); },
  'data-kbdir': b=>{
    const d = b.getAttribute('data-kbdir');
    const i = state.kbOpen.indexOf(d);
    if(i<0) state.kbOpen.push(d); else state.kbOpen.splice(i,1);
    render();
  },
  'data-kbfile': b=>{
    const p = b.getAttribute('data-kbfile');
    state.kbFile = p;
    if(!state.kbTabs.includes(p)) state.kbTabs.push(p);
    /* Opening a file always opens the folders above it — otherwise a link out
       lands you on a document the tree cannot show you. */
    const segs = p.split('/'); let sofar='';
    for(let i=0;i<segs.length-1;i++){ sofar = sofar?sofar+'/'+segs[i]:segs[i]; if(!state.kbOpen.includes(sofar)) state.kbOpen.push(sofar); }
    render(); window.scrollTo({top:0});
  },
  'data-kbclose': b=>{
    const p = b.getAttribute('data-kbclose');
    const i = state.kbTabs.indexOf(p);
    if(i>-1) state.kbTabs.splice(i,1);
    if(state.kbFile===p) state.kbFile = state.kbTabs[Math.max(0,i-1)] || KBF[0].p;
    render();
  },
  'data-rail': ()=>{ state.kbRail = !state.kbRail; state.dots=''; render(); },
  'data-kbedit': ()=>toast('Opens the editor on this file. Your edits become a change request.'),

  'data-kblink': b=>{ state.sharemenu=false; render(); copyNow('https://bevel.software/kb/'+b.getAttribute('data-kblink'), 'Link copied.'); },
  'data-crdock': ()=>{ state.crdock = !state.crdock; render(); },
  'data-kbcropen': b=>{

       the subject of is a diff floating in space. */

    if(!state.kbTabs.includes(c.open)) state.kbTabs.push(c.open);
    const segs = c.open.split('/'); let sofar='';

         glyph. It goes green for the same 1.5s instead. */
      if(b.classList.contains('cp')){
        b.classList.add('ok');
        clearTimeout(b._t); b._t = setTimeout(()=>b.classList.remove('ok'), 1500);
      } else {
        if(!b.dataset.orig) b.dataset.orig = b.textContent;
        b.textContent = '✓ Copied';
        clearTimeout(b._t); b._t = setTimeout(()=>{ b.textContent = b.dataset.orig; }, 1500);

         do — the rest happens in your agent. In the product the nudge would
         clear on the first MCP session instead, which is the real proof;
         `data-mcp` is the demo standing in for it. Marked only on a
         SUCCESSFUL copy: the clipboard can be refused outright, and clearing
         the one reminder for a copy that never happened would strand someone
         mid-setup. */

         of the page tree on the welcome page, and a full re-render would
         destroy it mid-flash — "✓ Copied" would blink out the instant it

      if(b.hasAttribute('data-mcp')){

        if(m) PATCH[id] = txt.replace(m[0], k.old);

    const target = v.history[state.vsel];
    v.v = target.v;
    v.history.unshift({ v:target.v, when:'just now', by:state.user, note:'Restored the '+target.v+' version.' });

document.addEventListener('click', e=>{
  let n = e.target instanceof Element ? e.target : null;
  const onCrumb = !!(n && n.closest('[data-crumb]'));
  if(state.ctx && !(n && n.closest('.ctxmenu'))){ state.ctx=null; render(); }
  /* clicking anywhere but the switcher (or its own menu) puts it away */
  if(state.appmenu && !(n && n.closest('.appmenu')) && !(n && n.closest('[data-appmenu]'))){ state.appmenu=false; render(); }
  if(state.branchmenu && !(n && n.closest('.branchmenu')) && !(n && n.closest('[data-branchmenu]'))){ state.branchmenu=false; render(); }
  if(state.sharemenu && !(n && n.closest('.actwrap'))){ state.sharemenu=false; render(); }
  if(state.crumb!==null && !onCrumb) state.crumb = null;   /* picking one, or clicking away, closes it */
  while(n && n !== document.documentElement){
    for(const a in CLICKS){
      if(n.hasAttribute(a)){ CLICKS[a](n); return; }
    }
    /* render() as well as renderMenu(): the trigger lives in the top bar now,
       so its aria-expanded is part of the bar's markup */
    if(n.id==='me'){ state.menu = !state.menu; render(); renderMenu(); return; }
    n = n.parentElement;
  }
  if(state.crumb===null && !onCrumb && document.querySelector('.cmenu')) render();
  if(state.menu && !e.target.closest('#pmenu')){ state.menu=false; renderMenu(); }
  if(state.dots && !e.target.closest('.dotwrap')){
    state.dots='';
    if(state.tool) toolModal(toolById(state.tool)); else render();
  }
  /* the panel's own backdrop closes it */
  if(state.vhist && e.target instanceof Element && e.target.id==='vov'){ state.vhist=false; render(); }
});
function render(){
  $('#topbar').innerHTML = topbarHtml();
  const side = $('#side');
  side.innerHTML = state.app==='kb' ? kbSideHtml() : sideHtml();
  /* the frame's width is state; the inner column keeps its own so the rows
     slide out intact when collapsed instead of reflowing on the way */
  side.style.width = state.collapsed ? '0px' : state.sideW+'px';
  const main = $('#main');
  main.innerHTML = state.app==='kb'       ? renderKb()
                 : state.view==='cr'      ? renderCR(crById(state.cr))
                 : state.view==='skill'   ? renderSkill(skillById(state.skill))
                 : state.view==='doc'     ? renderDoc(skillById(state.skill))
                 : state.view==='space'   ? renderSpace(spaceById(state.space))
                 : state.view==='pending' ? renderPending(pendById(state.pend))
                 : state.view==='personal'? renderPersonal()
                 : state.view==='spaces'  ? renderSpaces()
                 : state.view==='welcome' ? renderWelcome()
                 : renderHome();
  /* the two pages you decide on hold their actions on screen */
  main.classList.toggle('fit', state.view==='cr' || state.view==='pending');
  main.classList.toggle('kb', state.app==='kb');
  main.classList.toggle('solo', state.app==='kb' && !state.kbRail);
  /* Wider only where there is a second column to hold: a rail, or the two
     panes of a change request. Everything else — Knowledge, groups, the
     gallery — shares one measure, so the gutters match across the app. */
  main.classList.toggle('wide', state.app==='kb'
    ? state.kbRail
    : (state.view==='cr' || state.view==='pending' || state.view==='skill'));
  $('#ctx').innerHTML = ctxHtml();
  const vw = $('#vov');
  vw.innerHTML = state.vhist ? vovHtml() : '';
  vw.classList.toggle('on', !!state.vhist);
  /* a diff below the fold is a diff nobody sees — open on the change itself */
  if(state.vhist){
    const b = vw.querySelector('.vovbody'), m = vw.querySelector('.doc mark');
    if(b && m) b.scrollTop = Math.max(0, m.offsetTop - 170);
  }
  if(state.view==='cr'){
    const b = main.querySelector('.crdoc'), m = main.querySelector('.crdoc mark');
    if(b && m) b.scrollTop = Math.max(0, m.offsetTop - 130);
  }
}
/* =========================================================
   Dragging the sidebar wider.

   Width is written straight to the element during the drag rather than through
   render(): rebuilding the whole tree on every mousemove is both slow and
   destructive — it would blow away the row you are hovering. State catches up
   once on mouseup, which is also the only moment the new width matters.

   Keyboard gets the same control: a separator you can only drag is a control
   half the people cannot use.
   ========================================================= */
const SIDE_MIN = 180, SIDE_MAX = 460;
const clampW = w => Math.max(SIDE_MIN, Math.min(SIDE_MAX, Math.round(w)));
(function sidebarResize(){
  const grip = $('#resizer'), app = $('#app'), side = $('#side');
  if(!grip) return;
  let dragging = false;

  const move = e => {
    if(!dragging) return;
    e.preventDefault();
    const w = clampW(e.clientX - side.getBoundingClientRect().left);
    state.sideW = w;
    side.style.width = w+'px';
    const inner = side.querySelector('.side-inner');
    if(inner) inner.style.width = w+'px';
  };
  const stop = ()=>{
    if(!dragging) return;
    dragging = false;
    app.classList.remove('sizing');
    grip.classList.remove('on');
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', stop);
    render();                       /* one rebuild, at the end */
  };
  grip.addEventListener('mousedown', e=>{
    if(state.collapsed) return;
    e.preventDefault();
    dragging = true;
    app.classList.add('sizing');
    grip.classList.add('on');
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', stop);
  });
  /* double-click resets to the default, the way a split pane should */
  grip.addEventListener('dblclick', ()=>{ state.sideW = 212; render(); });
  grip.addEventListener('keydown', e=>{
    const step = e.shiftKey ? 32 : 8;
    if(e.key==='ArrowLeft'){ e.preventDefault(); state.sideW = clampW(state.sideW - step); render(); }
    if(e.key==='ArrowRight'){ e.preventDefault(); state.sideW = clampW(state.sideW + step); render(); }
    if(e.key==='Home'){ e.preventDefault(); state.sideW = 212; render(); }
  });
})();

/* right-click a subscription you run — share it, or delete it */
document.addEventListener('contextmenu', e=>{
  const el = e.target instanceof Element ? e.target : null;
  if(!el) return;
  const place = () => ({ x:Math.min(e.clientX, window.innerWidth-232), y:Math.min(e.clientY, window.innerHeight-160) });

  /* Knowledge: every row in the tree has a menu, folder or file. Right-click
     is where a file tree keeps access and downloads — the platform already
     works this way, and a tree that ignores the right button is a tree people
     will right-click anyway. */
  const row = el.closest('#side [data-kbdir], #side [data-kbfile]');
  if(row){
    e.preventDefault();
    state.ctx = { kb: row.getAttribute('data-kbdir') || row.getAttribute('data-kbfile'), ...place() };
    render();
    return;
  }

  const b = el.closest('#side [data-space]');
  const sp = b && spaceById(b.getAttribute('data-space'));
  if(!sp || !isSpaceAdmin(sp)) return;          /* nothing to offer on one you don't run */
  e.preventDefault();
  state.ctx = { sp:sp.id, ...place() };
  render();
});
document.addEventListener('keydown', e=>{
  if((e.key==='Enter' || e.key===' ') && e.target instanceof Element && e.target.matches('.card[role="button"]')){
    e.preventDefault(); e.target.click(); return;
  }
  if(e.key!=='Escape') return;
  if($('#mwrap').classList.contains('on')) closeModal();
  else if(state.sharemenu){ state.sharemenu=false; render(); }
  else if(state.branchmenu){ state.branchmenu=false; render(); }
  else if(state.appmenu){ state.appmenu=false; render(); }
  else if(state.ctx){ state.ctx=null; render(); }
  else if(state.crumb!==null){ state.crumb=null; render(); }
  else if(state.vhist){ state.vhist=false; render(); }
  else if(state.dots){ state.dots=''; render(); }
  else if(state.menu){ state.menu=false; renderMenu(); }
  else if(state.view==='cr'){ state.view='skill'; render(); }
  else if(state.view==='doc'||state.view==='pending'){ state.view = state.space?'space':'home'; render(); }
  else if(state.view==='space'||state.view==='personal'){ state.view='spaces'; state.space=null; render(); }
  else if(state.view==='spaces'){ state.view='home'; render(); }
  else if(state.view==='skill'){ state.view='home'; state.skill=null; render(); }
});

/* boot — hash hooks for demos: #user=john&view=skill&s=create-reading-deck&tab=design */
try{
  const hp = new URLSearchParams(location.hash.slice(1));
  if(hp.get('user')) state.user = hp.get('user');
  if(hp.get('theme')) document.documentElement.dataset.theme = hp.get('theme');
  /* #app=kb opens the Knowledge surface; #kb=<path> opens one document in it */
  if(hp.get('app')==='kb' || hp.get('kb')){ state.app='kb'; state.view='kb'; }
  if(hp.get('kb')){
    const p = hp.get('kb');
    if(kbf(p)){
      state.kbFile = p;
      if(!state.kbTabs.includes(p)) state.kbTabs.push(p);
      const segs = p.split('/'); let sofar='';
      for(let i=0;i<segs.length-1;i++){ sofar = sofar?sofar+'/'+segs[i]:segs[i]; if(!state.kbOpen.includes(sofar)) state.kbOpen.push(sofar); }
    }
  }
  if(hp.get('s')){ state.view='skill'; state.skill=hp.get('s'); }
  if(hp.get('personal')) state.view = 'personal';
  if(hp.get('spaces')) state.view = 'spaces';
  if(hp.get('tab')) state.tabFile = hp.get('tab');
  if(hp.get('cr')){ state.view='cr'; state.cr=hp.get('cr'); }
  if(hp.get('space')){ state.view='space'; state.space=hp.get('space'); }
  if(hp.get('doc')){ state.view='doc'; state.skill=hp.get('doc'); }
  if(hp.get('pending')){ const pp=pendById(hp.get('pending')); if(pp){ state.view='pending'; state.pend=pp.id; state.space=pp.space; } }
}catch(e){}
render();
try{ if(new URLSearchParams(location.hash.slice(1)).get('agent')) agentModal(); }catch(e){}
</script>
