name: Publish Docker image

# Builds the production image and pushes it to GHCR so self-hosters (and the
# app-store templates) can pull ghcr.io/bevel-software/hexis instead of
# building from source. `latest` tracks main; version tags come from git tags.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# One publish per ref at a time, newest wins. Without this, two closely spaced
# pushes to main can finish out of order and leave `latest` pointing at the
# older commit.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to reviewed commit SHAs (release tag alongside each) so a
# moved or compromised tag cannot run arbitrary code with the package-write
# token and publish an altered image.
jobs:
  # The same gate every pull request passes, re-run on the exact commit being
  # published. The Test workflow's own triggers never see a `v*` tag push, and
  # nothing else ties this job to a green run — without this, an image could be
  # published from a commit whose tests fail.
  test:
    uses: ./.github/workflows/test.yml
    # Explicit, so a permissive repository default can never hand the gate's
    # jobs a write-scoped token.
    permissions:
      contents: read

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/bevel-software/hexis
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # The Dockerfile bakes this into the image so `GET /api/health` can
          # report which commit is running; `.git` is dockerignored, so the
          # build can't read it itself.
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
