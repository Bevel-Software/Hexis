name: KB Architecture Review

# The PR author triggers the review by commenting `/bevel-review` on the PR,
# by convention after CodeRabbit has finished its code-level pass. The agent
# loads the architecture-review skill + this repo's rules from the knowledge
# base, reviews the diff, and routes the outcome per the project's Review
# Policy — go-ahead / bounce to author / escalate — as PR comments.
#
# Setup (once per repo):
#   - repo variable  KNOWLEDGE_BASE_API_URL  — e.g. https://<company>.bevel.software
#   - repo secret    KNOWLEDGE_BASE_CONNECTION_KEY — from the KB settings page
#
# The agent's INSTRUCTIONS live in the knowledge base, not here: this file
# passes the skill's path plus the run's context (repo, PR number, KB origin,
# verdict path) and nothing else. Reviewing behaviour is then versioned and
# reviewed like every other rule, and the two repositories that run this
# workflow cannot drift apart.
#
# Split into three jobs on purpose. Actions permissions are per-JOB, not per-
# step, so anything the agent's job can do, a prompt injection riding in on the
# PR can do too. The agent reads attacker-controllable text by design — the
# diff, the description, every comment on the thread — so the token it sits
# next to must not be able to publish the PR's own check, nor speak on the PR.
# `start` opens the check, `review` runs the agent with NO write access to this
# repository at all, and `publish` turns the verdict the agent recorded into
# the PR comment and the commit status.

on:
  issue_comment:
    types: [created]

jobs:
  # ---------------------------------------------------------------------------
  # Gate the command and open the check. Nothing attacker-controlled is read
  # here beyond the comment body prefix, and no secret is in scope.
  # ---------------------------------------------------------------------------
  start:
    # This repo is public and `issue_comment` is NOT covered by the fork-PR
    # approval policy: the run starts immediately, on the default branch, with
    # the KB connection key and a write-scoped token in scope. Without a gate
    # any GitHub account could comment `/bevel-review` on any PR and drive the
    # agent. First filter: association, so a drive-by comment never spins up a
    # runner. It is deliberately broader than "write access" — MEMBER is every
    # org member (org base permission here is `read`) and COLLABORATOR is any
    # invitation at any level — so the job re-checks for real below.
    if: >-
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/bevel-review') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write     # react to the triggering comment
      statuses: write   # open the pending check
    outputs:
      ref: ${{ steps.pr.outputs.ref }}
      sha: ${{ steps.pr.outputs.sha }}

    steps:
      # Second filter, and the authoritative one: narrow the association gate
      # down to actual write access on THIS repo. Runs before anything else, so
      # an unauthorized comment costs one API call and stops.
      #
      # The permission endpoint wants push access itself; if the job token is
      # ever scoped too thinly for it, fall back to the association the `if:`
      # already validated rather than bricking the command — that fallback is
      # exactly the old behaviour, never weaker.
      - name: Authorize commenter
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.event.comment.user.login }}
          ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          set -uo pipefail

          if ! perm=$(gh api "repos/${{ github.repository }}/collaborators/$ACTOR/permission" \
                        --jq .permission 2>/dev/null); then
            echo "::warning::Could not read $ACTOR's repo permission — falling back to author_association=$ASSOCIATION."
            exit 0
          fi

          case "$perm" in
            admin|maintain|write)
              echo "$ACTOR authorized (permission=$perm)." ;;
            *)
              echo "::error::$ACTOR has permission '$perm' on this repository — /bevel-review needs write access."
              exit 1 ;;
          esac

      # Instant sign of life: react 👀 to the triggering comment so the author
      # knows the command was seen while the agent (~3 min) spins up.
      #
      # It is cosmetic, so it must never be able to gate the review. Reacting
      # needs a permission the job token is not reliably granted — it returned
      # `Resource not accessible by integration` (403) here even with
      # `issues: write` in scope — and steps run under `bash -e`, so that 403
      # took down `start` before it could open the check. `publish` is gated on
      # `needs.start.result == 'success'`, so the whole review died and the PR
      # kept whatever stale status it already had. Swallow the failure into a
      # warning: losing the 👀 is a papercut, losing the review is not.
      - name: Acknowledge the command
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST \
            "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes \
            || echo "::warning::Could not react to the triggering comment — continuing with the review."

      - name: Resolve PR head branch
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "ref=$(gh pr view ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --json headRefName -q .headRefName)" >> "$GITHUB_OUTPUT"
          echo "sha=$(gh pr view ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --json headRefOid -q .headRefOid)" >> "$GITHUB_OUTPUT"

      # issue_comment runs attach to the default branch, not the PR, so the run
      # itself never shows in the PR's checks. Publish a commit STATUS on the PR
      # head instead: pending now; the `publish` job sets the final state to
      # match the agent's routing verdict. Make `bevel/architecture-review` a
      # required check in branch protection to enforce the review policy
      # mechanically.
      - name: Mark review status pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ steps.pr.outputs.sha }}" \
            -f state=pending \
            -f context=bevel/architecture-review \
            -f description="Architecture review running" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # ---------------------------------------------------------------------------
  # Run the agent. This job holds the KB key and can comment on the PR, but it
  # deliberately has NO `statuses: write` — an injected agent must not be able
  # to stamp `bevel/architecture-review` green on this or any other commit.
  # It records its verdict to a file; `publish` is what turns that into a check.
  # ---------------------------------------------------------------------------
  review:
    needs: start
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # READ-ONLY, deliberately. The agent needs to see the PR (description,
      # threads, checks) to review it, and nothing more: `publish` speaks for
      # it. Anything writable here is writable by a prompt injection too.
      contents: read
      pull-requests: read
      issues: read
      # The agent's Review Policy will not hand out a go-ahead without green
      # CI, and CI here is a CHECK RUN, not a commit status — two different
      # APIs behind two different scopes. `checks: read` covers the first.
      checks: read
      # And `actions: read` beside it, because the agent asks BOTH questions:
      # the check runs on a commit, and the workflow runs behind them. Granting
      # only the first still left it reporting 403 on "Actions workflow runs"
      # and caveating a go-ahead for evidence it could only half see.
      actions: read
    outputs:
      verdict_b64: ${{ steps.verdict.outputs.verdict_b64 }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.start.outputs.ref }}
          # Full history so the agent can diff against the PR base branch.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The prompt is a POINTER, not a policy. Everything about how to behave —
      # untrusted-input handling, what to read, what to deliver — lives in the
      # skill named below and is versioned in the knowledge base. Keep this
      # block to the run's own facts: they are the only things the KB cannot
      # know. The verdict path is written out in full rather than as
      # `$VERDICT_FILE`, so the agent never has to depend on a shell expanding
      # it correctly.
      - name: Run architecture review
        run: npx --yes @bevel-software/pipeline-agent@latest
        env:
          KNOWLEDGE_BASE_API_URL: ${{ vars.KNOWLEDGE_BASE_API_URL }}
          KNOWLEDGE_BASE_CONNECTION_KEY: ${{ secrets.KNOWLEDGE_BASE_CONNECTION_KEY }}
          GH_TOKEN: ${{ github.token }}
          AGENT_PROMPT: |
            Read the skill `Plugins/Engineering/review/pr-review-pipeline/SKILL.md`
            from the knowledge base and follow it exactly. It is the contract for
            this run: how to treat what you read, what to review, and what to
            deliver. Read it before anything else, and before reading any part of
            the pull request.

            To reach it: call the KnowledgeBase `start_session` tool once, then
            pass the returned id as `sessionId` on every later KnowledgeBase call.
            `list_files` the workspace root once to learn the repo folder's name
            and prefix the skill path with it.

            Run context:
            - Repository: ${{ github.repository }}
            - Pull request: #${{ github.event.issue.number }}
            - Knowledge base origin: ${{ vars.KNOWLEDGE_BASE_API_URL }}
            - Verdict file (write your verdict JSON here): ${{ runner.temp }}/bevel-verdict.json

      # Hand the verdict to `publish` as one base64 line. `always()` so a
      # crashed or silently-declining agent still yields an (empty) verdict for
      # `publish` to turn into an errored check rather than one stuck pending.
      #
      # Base64 because the payload is multi-line JSON and job outputs are
      # single-line strings — encoding it is what keeps a newline inside a
      # finding from ending the output and injecting workflow commands. It is
      # transport, NOT sanitisation: `publish` still validates every field.
      - name: Collect the verdict
        id: verdict
        if: always()
        env:
          VERDICT_FILE: ${{ runner.temp }}/bevel-verdict.json
        run: |
          set -uo pipefail

          if [ ! -s "$VERDICT_FILE" ]; then
            echo "Agent recorded no verdict at $VERDICT_FILE."
            exit 0
          fi

          if ! jq -e . "$VERDICT_FILE" >/dev/null 2>&1; then
            echo "::warning::Verdict file is not valid JSON — treating as no verdict."
            cat "$VERDICT_FILE"
            exit 0
          fi

          # A job output is bounded (~1 MB); a verdict past that makes the write
          # fail and strands the run. Cap it here and let `publish` report the
          # ordinary no-verdict status instead.
          verdict_b64=$(jq -c . "$VERDICT_FILE" | base64 -w0)
          if [ "${#verdict_b64}" -gt 800000 ]; then
            echo "::warning::Verdict is ${#verdict_b64} encoded bytes — too large to publish; treating as no verdict."
            cat "$VERDICT_FILE"
            exit 0
          fi
          echo "verdict_b64=$verdict_b64" >> "$GITHUB_OUTPUT"
          cat "$VERDICT_FILE"

          cat "$VERDICT_FILE"
  # ---------------------------------------------------------------------------
  # The only job that speaks on the PR. It reads the agent's verdict and renders
  # it; it never reads the PR itself. Splitting it out is what lets the review
  # job run with no write access at all: an injected agent can propose a comment
  # body, but only through the four validated fields below, and it can never
  # stamp its own check.
  #
  # Runs on every outcome so the check is never left stuck on "pending —
  # running": the agent can fail to reach a verdict without failing its step (it
  # exits 0 having declined to act), and `failure()` does not fire for that.
  # ---------------------------------------------------------------------------
  publish:
    needs: [start, review]
    if: always() && needs.start.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
      issues: write   # the review comment (a PR is an issue for this endpoint)

    steps:
      # Everything in the verdict came through an agent that reads attacker-
      # controllable text, so treat all four fields as hostile: allowlist the
      # outcome, cap and de-newline the prose, cap the finding count, and
      # require the link to point at the knowledge base or this repository.
      # jq does the parsing — the payload never reaches the shell as code.
      - name: Render the verdict
        id: render
        env:
          VERDICT_B64: ${{ needs.review.outputs.verdict_b64 }}
          KB_ORIGIN: ${{ vars.KNOWLEDGE_BASE_API_URL }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Every extraction below must degrade to "no verdict" rather than
          # abort the job: this step runs under `set -e`, and a malformed
          # payload that killed it would leave the PR's check stuck on pending
          # forever — the exact failure this job exists to prevent. So decode
          # and shape-check first, then give every jq program a total answer
          # (`tostring`, array coercion) for inputs of the wrong type.
          outcome=none
          headline=""
          url=""
          : > findings.md

          if [ -z "${VERDICT_B64:-}" ]; then
            echo "No verdict recorded by the agent."
          elif ! printf '%s' "$VERDICT_B64" | base64 -d > verdict.json 2>/dev/null; then
            echo "::warning::Verdict payload did not decode — treating as no verdict."
          elif ! jq -e 'type == "object"' verdict.json >/dev/null 2>&1; then
            echo "::warning::Verdict is not a JSON object — treating as no verdict."
          else
            outcome=$(jq -r '(.outcome? // "") | tostring | ascii_downcase | gsub("[^a-z-]"; "")' verdict.json)
            case "$outcome" in
              go-ahead|bounce|escalated) ;;
              *) echo "::warning::Unrecognised outcome from the agent: $outcome"; outcome=none ;;
            esac

            headline=$(jq -r '(.headline? // "") | tostring | gsub("[[:space:]]+"; " ") | .[0:120]' verdict.json)

            # One markdown bullet per finding, severity forced onto the
            # allowlist so the agent cannot invent a louder label.
            jq -r '
              ((.findings? // []) | if type == "array" then . else [] end)[:8][]
              | select(type == "object")
              | ((.severity? // "") | tostring) as $s
              | (if $s == "violation" then "violation"
                 elif $s == "question" then "question"
                 else "risk" end) as $sev
              | ((.text? // "") | tostring | gsub("[[:space:]]+"; " ") | .[0:200]) as $text
              | select($text != "")
              | "- **" + $sev + "** — " + $text
            ' verdict.json > findings.md

            url=$(jq -r '(.one_pager_url? // "") | tostring | gsub("[[:space:]]"; "")' verdict.json)
          fi


          # A status target_url and a comment body are both bounded; a URL past
          # any sane length is not a link anyone can follow anyway.
          if [ "${#url}" -gt 2000 ]; then
            echo "::warning::Discarding over-long one_pager_url from the agent (${#url} chars)"
            url=""
          fi

          case "$url" in
            "${KB_ORIGIN%/}"/*|"$REPO_URL"/*) ;;
            "") ;;
            *) echo "::warning::Discarding off-site one_pager_url from the agent: $url"; url="" ;;
          esac

          {
            echo "outcome=$outcome"
            echo "headline=$headline"
            echo "url=$url"
          } >> "$GITHUB_OUTPUT"

          # The comment body: verdict line, the risks and blockers, the link.
          # Nothing else — depth lives in the one-pager, which is behind the
          # knowledge base's access model rather than on a public PR.
          case "$outcome" in
            go-ahead)  title="Architecture review: **go-ahead**" ;;
            bounce)    title="Architecture review: **changes requested**" ;;
            escalated) title="Architecture review: **escalated to a tech lead**" ;;
            *)         title="Architecture review: **did not complete**" ;;
          esac

          {
            printf '%s' "$title"
            [ -n "$headline" ] && printf ' — %s' "$headline"
            printf '\n\n'

            if [ -s findings.md ]; then
              cat findings.md
            elif [ "$outcome" = go-ahead ]; then
              echo "No risks or blockers found."
            elif [ "$outcome" = none ]; then
              echo "The review agent finished without recording a verdict. Nothing was published for this run — re-trigger with \`/bevel-review\`."
            fi

            printf '\n'
            if [ -n "$url" ]; then
              printf '[Full analysis](%s)\n' "$url"
            elif [ "$outcome" = none ]; then
              printf '[Run log](%s)\n' "$RUN_URL"
            fi
          } > comment.md

          echo "--- comment body ---"
          cat comment.md

      # Post as a NEW comment rather than editing a previous one: the thread is
      # the audit trail, and each re-trigger is a distinct review of a distinct
      # state. `--body-file` keeps the body off the command line entirely.
      - name: Post the review comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST \
            "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            -F body=@comment.md \
            --jq .html_url

      - name: Publish the review status
        # `if: always()`: the comment step above can fail (a large body, a
        # transient API error) and `set -e` would then skip this one, leaving the
        # pending status `start` posted sitting on the commit for good. Every run
        # closes its own status.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.start.outputs.sha }}
          OUTCOME: ${{ steps.render.outputs.outcome }}
          HEADLINE: ${{ steps.render.outputs.headline }}
          URL: ${{ steps.render.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -z "${SHA:-}" ]; then
            echo "No PR head sha resolved — no status to publish."
            exit 0
          fi

          case "$OUTCOME" in
            go-ahead)  state=success; fallback="Architecture review passed" ;;
            bounce)    state=failure; fallback="changes requested — see review comment" ;;
            escalated) state=pending; fallback="awaiting tech lead decision" ;;
            *)         state=error;   fallback="Review agent posted no verdict — see run log, then re-trigger /bevel-review" ;;
          esac

          description="${HEADLINE:-}"
          if [ "$state" = "error" ] || [ -z "$description" ]; then
            description="$fallback"
          fi

          target_url="${URL:-$RUN_URL}"

          echo "Publishing bevel/architecture-review = $state ($description)"
          gh api -X POST "repos/$REPO/statuses/$SHA" \
            -f state="$state" \
            -f context=bevel/architecture-review \
            -f description="$description" \
            -f target_url="$target_url"
