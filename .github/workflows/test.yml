name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          # 22 is the minimum for isolated-vm@6, which is a transitive dep of
          # @utcp/code-mode and won't compile against Node 20's V8 headers
          # (missing `v8::SourceLocation`). engines pins >=22 <23 (native ABI).
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test
