name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
  # Lets another workflow run this suite as a gate on its own trigger, on the
  # exact commit it is about to act on. Nothing calls it today — the image
  # publish that did was removed — but a release or deploy workflow that needs
  # "only tested commits ship" should call this rather than restate the suite.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    # Building and testing a fork PR runs that contributor's code on the runner
    # — unavoidable, and fine, because the run holds nothing worth stealing: no
    # secrets, and GitHub forces a read-only token on fork PRs anyway. Stating
    # the scope here keeps that true if the repo-wide default workflow
    # permission is ever flipped back to read/write in settings.
    permissions:
      contents: read
    # A real Postgres for the tests that are about what the database ends up
    # holding (`*.pg.test.ts`, today the personal-data backfill): they skip
    # without `TEST_DATABASE_URL`, so this is what makes them run at all. The
    # same major the compose file ships, pinned by digest for the reason the
    # actions below are. The password guards nothing: the server lives for
    # this job, on the runner, and each test works in a database it creates.
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Actions are pinned to reviewed commit SHAs (release tag alongside each):
    # this suite is what says a commit is good, so a moved or compromised tag
    # must not be able to tamper with the workspace that decides that.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The merge commit and its base parent, for "Lint changed files".
          fetch-depth: 2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The version this repo's own image ships. 22 is also the minimum for
          # isolated-vm@6, a transitive dep of @utcp/code-mode that won't compile
          # against Node 20's V8 headers (missing `v8::SourceLocation`). The
          # PUBLISHED local server supports more than this one major — see the
          # `hexis-mcp` job below, which is where that range is tested.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Licence policy gate. Fails on any dependency that offers no permissive
      # licence (GPL/AGPL/SSPL/…) or declares one we have not classified, so a
      # new dep can't quietly put copyleft into a shipped artifact. `pnpm build`
      # runs the same check, but as a separate step ahead of it the failure is
      # unambiguous and costs no compile time.
      - run: pnpm run notices:check

      - run: pnpm build

      # `pnpm build` already typechecks the packages whose build IS `tsc`
      # (shared, mcp-core, core-backend, hexis-mcp). Three are not covered by
      # it: core-frontend and apps/server have no build step, and apps/web
      # builds with vite, which does not typecheck. A type error in any of
      # those reached dev unnoticed until someone ran tsc locally. After
      # `pnpm build` so the cross-package `dist/` types it resolves exist.
      - run: pnpm typecheck

      # ESLint over the files a pull request changes. Not `pnpm lint`: the repo
      # as a whole still carries errors in files nobody is touching, so a
      # repo-wide gate would fail every PR. This holds each PR to leaving the
      # files it edits clean. On `pull_request` the checkout is GitHub's merge
      # commit, whose first parent is the base, so `HEAD^1..HEAD` is exactly
      # what the PR changes (hence `fetch-depth: 2` above). `pipefail`, because
      # the default shell has none: a failing `git diff` would hand `xargs -r`
      # nothing, and the step would pass having linted nothing.
      - name: Lint changed files
        if: github.event_name == 'pull_request'
        run: |
          set -o pipefail
          git diff --name-only --diff-filter=ACMR -z HEAD^1 HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs' \
            | xargs -0 -r pnpm exec eslint --no-warn-ignored --max-warnings 0

      # `pnpm test` is `pnpm -r run test`, and a recursive run prefixes every
      # child line with its package ("packages/core-backend test: …"). Vitest's
      # built-in GitHub Actions reporter prints `::error file=…` annotations,
      # but a workflow command only counts at the start of a line — so a failing
      # test left nothing but "Process completed with exit code 1", and the job
      # log that names it needs admin rights. Hiding the prefix turns every
      # failure into a public annotation on the check.
      - run: pnpm -r --reporter-hide-prefix run test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      # Design-system ratchet. The UI is migrating onto semantic tokens, so a
      # hard ban would fail against the remaining ~520 off-system call sites.
      # This only fails when the count goes UP — i.e. when new off-system
      # values are introduced. slate is already at 0, so for that rule the
      # ratchet is a hard ban. Needed because `--color-slate-*: initial`
      # fails silently:
      # Tailwind emits no rule for an unknown utility, so a stale class is a
      # no-op rather than a build error.
      - run: pnpm ds:check

  # The local MCP server is the one thing in this repo that runs on OTHER
  # PEOPLE'S machines, at whatever Node they happen to have — so "it works on
  # the version we build the image with" says nothing about it. Its supported
  # range is exactly the Node majors `isolated-vm` publishes a prebuilt binary
  # for (`SUPPORTED_NODE_MAJORS` in packages/hexis-mcp/src/preflight.ts); a
  # major without one would compile C++ on the user's laptop, which is the
  # failure the range exists to prevent rather than a version we support. This
  # matrix is therefore the evidence behind the `engines` field, and
  # `supported-node.test.ts` fails if the two ever disagree.
  hexis-mcp:
    name: hexis-mcp (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # WHICH majors still work is this job's entire output, so one failing
      # must not cancel the other and leave that unanswered.
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # Installing is itself part of what this job checks: `isolated-vm`'s
      # install script downloads a prebuilt binary when one matches this ABI
      # and falls back to a C++ compile when none does, so a major that lost
      # its binary shows up here as a long, fragile step before any test runs.
      - run: pnpm install --frozen-lockfile

      # Only what the package under test needs. Its workspace dependency is
      # consumed as built `dist/`, and the rest of the monorepo (the web app,
      # the API server) is covered by the job above on the version its image
      # actually ships.
      - run: pnpm --filter "@bevel-software/hexis-mcp^..." run build

      - run: >-
          pnpm --filter @bevel-software/platform-mcp-core
          --filter @bevel-software/hexis-mcp
          --reporter-hide-prefix run test
