name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
  # Lets other workflows run this suite as a gate on their own trigger — the
  # image publish re-runs it on the exact commit it is about to publish.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    # This suite is also the publish workflow's gate, so its actions are pinned
    # to reviewed commit SHAs (release tag alongside each) for the same reason
    # the publish steps are: a moved tag must not be able to tamper with the
    # workspace that decides whether an image ships.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # 22 is the minimum for isolated-vm@6, which is a transitive dep of
          # @utcp/code-mode and won't compile against Node 20's V8 headers
          # (missing `v8::SourceLocation`). engines pins >=22 <23 (native ABI).
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Licence policy gate. Fails on any dependency that offers no permissive
      # licence (GPL/AGPL/SSPL/…) or declares one we have not classified, so a
      # new dep can't quietly put copyleft into a shipped artifact. `pnpm build`
      # runs the same check, but as a separate step ahead of it the failure is
      # unambiguous and costs no compile time.
      - run: pnpm run notices:check

      - run: pnpm build

      - run: pnpm test

      # Design-system ratchet. The UI is migrating onto semantic tokens, so a
      # hard ban would fail against the remaining ~520 off-system call sites.
      # This only fails when the count goes UP — i.e. when new off-system
      # values are introduced. slate is already at 0, so for that rule the
      # ratchet is a hard ban. Needed because `--color-slate-*: initial`
      # fails silently:
      # Tailwind emits no rule for an unknown utility, so a stale class is a
      # no-op rather than a build error.
      - run: pnpm ds:check
